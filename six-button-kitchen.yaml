esphome:
  name: wall-switch-kitchen-living-room
  friendly_name: Vypinač kuchyně, obývací pokoj

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_kitchen

ota:
  - platform: esphome
    password: !secret ota_password_kitchen

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.101
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wall-Switch-Kitchen"
    password: !secret ap_password_kitchen

captive_portal:



number:
  - platform: template
    name: "Press Threshold"
    id: press_threshold
    optimistic: true
    min_value: 200
    max_value: 1000
    step: 100
    unit_of_measurement: "ms"
    initial_value: 500


globals:
  - id: kuchyne_1_press_start
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: kuchyne_2_press_start
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: obyvak_1_press_start
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: obyvak_2_press_start
    type: unsigned long
    restore_value: no
    initial_value: '0'
  - id: jidelna_press_start
    type: unsigned long
    restore_value: no
    initial_value: '0'



binary_sensor:
  # D1 - Kuchyně 1
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Kuchyně 1 Raw"
    id: kuchyne_1_raw
    filters:
      - delayed_on_off: 35ms
    on_press:
      - lambda: |-
          if (id(kuchyne_1_press_start) == 0) id(kuchyne_1_press_start) = millis();
    on_release:
      - lambda: |-
          unsigned long start = id(kuchyne_1_press_start);
          if (start == 0) return;
          unsigned long duration = millis() - start;
          id(kuchyne_1_press_start) = 0;
          if (duration < id(press_threshold).state) {
            id(kuchyne_1_short_press).publish_state(true);
          }

  - platform: template
    name: "Kuchyně 1 Short Press"
    id: kuchyne_1_short_press
    lambda: |-
      return false;
    filters:
      - delayed_off: 200ms


  - platform: template
    name: "Kuchyně 1 Long Press"
    lambda: |-
      if (id(kuchyne_1_raw).state) {
        // ensure start time is recorded
        if (id(kuchyne_1_press_start) == 0) id(kuchyne_1_press_start) = millis();
        // while held, long press becomes true once duration >= threshold
        return (millis() - id(kuchyne_1_press_start)) >= id(press_threshold).state;
      } else {
        // released -> not in long-press state
        return false;
      }


  # D2 - Kuchyně 2
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Kuchyně 2 Raw"
    id: kuchyne_2_raw
    filters:
      - delayed_on_off: 35ms
    on_press:
      - lambda: |-
          if (id(kuchyne_2_press_start) == 0) id(kuchyne_2_press_start) = millis();
    on_release:
      - lambda: |-
          unsigned long start = id(kuchyne_2_press_start);
          if (start == 0) return;
          unsigned long duration = millis() - start;
          id(kuchyne_2_press_start) = 0;
          if (duration < id(press_threshold).state) {
            id(kuchyne_2_short_press).publish_state(true);
          }

  - platform: template
    name: "Kuchyně 2 Short Press"
    id: kuchyne_2_short_press
    lambda: |-
      return false;
    filters:
      - delayed_off: 200ms


  - platform: template
    name: "Kuchyně 2 Long Press"
    lambda: |-
      if (id(kuchyne_2_raw).state) {
        if (id(kuchyne_2_press_start) == 0) id(kuchyne_2_press_start) = millis();
        return (millis() - id(kuchyne_2_press_start)) >= id(press_threshold).state;
      } else {
        return false;
      }


