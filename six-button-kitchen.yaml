esphome:
  name: wall-switch-kitchen-living-room
  friendly_name: Vypinač kuchyně, obývací pokoj

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "r75QnDmaos54nsOHDNJ96kPU3OkSCtkdDbvOrSijDwU="

ota:
  - platform: esphome
    password: "901b98bdb6d4ba613e7aa6ccb26555c6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.101
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Wall-Switch-Kitchen"
    password: "A649eqhMm729"

captive_portal:


number:
  - platform: template
    name: "Press Threshold"
    id: press_threshold
    optimistic: true
    min_value: 100
    max_value: 5000
    step: 100
    unit_of_measurement: "ms"
    initial_value: 1000


binary_sensor:
  - # D1 at board
    platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    name: Vypinač kuchyně 1
    filters:
      - delayed_on_off: 25ms
  - # D2 at board
    platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: Vypinač kuchyně 2
    filters:
      - delayed_on_off: 25ms
  - # D5 at board
    platform: gpio
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
      inverted: true
    name: Vypinac obyvak 1
    filters:
      - delayed_on_off: 25ms
  - # D6 at board
    platform: gpio
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: true
      inverted: true
    name: Vypinac obyvak 2
    filters:
      - delayed_on_off: 25ms
  - # D7 at board
    platform: gpio
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    name: Vypinac jidelna
    filters:
      - delayed_on_off: 25ms
