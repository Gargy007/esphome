esphome:
  name: boiler-room--main-tank
  friendly_name: Boiler room - main tank

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_main_tank

ota:
  - platform: esphome
    password: !secret ota_password_main_tank

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.110
    gateway: 192.168.1.1
    subnet: 255.255.255.0


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Boiler-Room--Main-Tank"
    password: !secret ap_password_main_tank

captive_portal:

one_wire:
  - platform: gpio
    pin: GPIO2
# [20:18:24][C][gpio.one_wire:082]:     0x17000005627f4428 (DS18B20)
# [20:18:24][C][gpio.one_wire:082]:     0xfe00000568a02428 (DS18B20)
# [20:18:24][C][gpio.one_wire:082]:     0x3a0000055a472428 (DS18B20)
# [20:18:24][C][gpio.one_wire:082]:     0xcd00000562870528 (DS18B20)
sensor:
  - platform: dallas_temp
    address: 0x3a0000055a472428
    name: Teplota B1
    update_interval: 30s
  - platform: dallas_temp
    address: 0x17000005627f4428
    name: Teplota B2
    update_interval: 30s
  - platform: dallas_temp
    address: 0xcd00000562870528
    name: Teplota B3
    update_interval: 30s
  - platform: dallas_temp
    address: 0xfe00000568a02428
    name: Teplota B4
    update_interval: 30s  

output:
  - platform: gpio
    pin: GPIO15
    id: gpio_rele
  - platform: gpio
    pin: GPIO5
    id: gpio_led_yellow
  - platform: gpio
    pin: GPIO4
    id: gpio_led_red
  - platform: gpio
    pin: GPIO0
    id: gpio_led_green
    
switch:
  - platform: output
    name: LED Yellow
    output: gpio_led_yellow
    id: switch_led_yellow
    internal: True
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  - platform: output
    name: LED Green
    output: gpio_led_green
    id: switch_led_green
    internal: True
  - platform: output
    name: Rele
    output: gpio_rele
    id: switch_rele
    # When this switch changes, update the target switch
    on_state:
      - switch.control:
          id: switch_led_yellow
          state: !lambda "return x;"

binary_sensor:
  - platform: switch
    name: "Status - Green"
    source_id: switch_led_green  # References the id of the switch above
  - platform: switch
    name: "Status - Yellow"
    source_id: switch_led_yellow  # References the id of the switch above
  - platform: switch
    name: "Status - Red"
    source_id: switch_led_red  # References the id of the switch above

interval:
  - interval: 1s
    then:
      if:
        condition:
          wifi.connected:
        then:
          - if:
              condition:
                api.connected:
              then:
                - switch.turn_on: switch_led_green
                - switch.turn_off: switch_led_red
              else:
                - switch.turn_off: switch_led_red
                - switch.turn_on: switch_led_green
                - delay: 500ms
                - switch.turn_off: switch_led_green
                - delay: 500ms
        else:
          - switch.turn_off: switch_led_green
          - switch.turn_on: switch_led_red
          - switch.turn_on: switch_rele
          - delay: 500ms
          - switch.turn_off: switch_led_red
          - delay: 500ms