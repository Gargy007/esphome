esphome:
  name: kuchyn--tlacitko-dvere
  friendly_name: Kuchyn - Tlacitko dvere
  platformio_options:   
    platform: https://github.com/platformio/platform-espressif32.git#6.7.0

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf
    version: 5.2.1
    platform_version: 6.7.0
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "iPGxdkjrMXqAk5WYy6vs89Nb5v3c9weBgBxoZ8WKPAA="

ota:
  - platform: esphome
    password: "61e19a7011d5b2f0f25b9fc69f535cda"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.100
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Kuchyn--Tlacitko-Dvere"
    password: "0f9QKEmKhG9U"

captive_portal:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    name: Kuchyn Push Button 1
    filters:
      - delayed_off: 40ms
  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    name: Kuchyn Push Button 2
    filters:
      - delayed_off: 40ms
    