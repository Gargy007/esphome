views:
  - type: panel
    title: Home
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          height: 100vh
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr
          grid-gap: 12px
          margin: 4px
        cards:
          - type: vertical-stack
            cards:
              - type: picture-entity
                entity: camera.sopka_jitka
                show_state: false
                show_name: false
                camera_view: auto
                fit_mode: cover
                camera_image: camera.sopka_jitka
              # ── Hodiny ──
              - type: custom:button-card
                entity: sensor.time
                show_name: false
                show_state: true
                show_icon: false
                tap_action:
                  action: none
                styles:
                  card:
                    - height: 265px
                    - background: var(--card-background-color)
                  state:
                    - font-size: 144px
                    - font-weight: 600
                    - letter-spacing: 4px
                    - color: var(--primary-text-color)
             
          - type: vertical-stack
            cards:
              - type: weather-forecast
                entity: weather.forecast_domov
                show_forecast: true
                forecast_type: daily
              # ── Fotovoltaika ──
              - type: custom:button-card
                entity: sensor.solax_pv_power
                show_name: false
                show_state: false
                show_icon: true
                show_label: true
                layout: icon_label
                icon: mdi:solar-power-variant
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-wallboard/fotovoltaika
                custom_fields:
                  bar: |
                    [[[
                      const v = parseFloat(entity.state) || 0;
                      const pct = Math.max(0, Math.min(v / 12000 * 100, 100));
                      let color = '#9e9e9e';
                      if (v > 2000) color = '#4caf50';
                      else if (v > 500) color = '#ff9800';
                      else if (v > 0) color = '#f44336';
                      return `<div style="width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden">
                        <div style="width:${pct}%;height:100%;border-radius:6px;background:${color};transition:width 0.5s ease"></div>
                      </div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--secondary-text-color);margin-top:2px"><span>0</span><span>12 kW</span></div>`;
                    ]]]
                label: |
                  [[[
                    const pv = parseFloat(entity.state) || 0;
                    const bat = parseFloat(states['sensor.solax_srtr36bbae_battery_remaining_capacity'].state) || 0;
                    const grid = parseFloat(states['sensor.solax_srtr36bbae_grid_power'].state) || 0;
                    const pvStr = pv >= 1000 ? (pv/1000).toFixed(1) + ' kW' : Math.round(pv) + ' W';
                    const gridStr = grid > 0 ? '↑' + Math.round(grid) + ' W' : grid < 0 ? '↓' + Math.round(Math.abs(grid)) + ' W' : '—';
                    const pvColor = pv > 2000 ? '#4caf50' : pv > 500 ? '#ff9800' : '#9e9e9e';
                    return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Fotovoltaika</div>
                      <div style="font-size:26px;font-weight:bold;color:${pvColor}">${pvStr}</div>
                      <div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">🔋 ${Math.round(bat)}%  🔌 ${gridStr}</div>
                    </div>`;
                  ]]]
                styles:
                  card:
                    - height: 130px
                    - background: |
                        [[[
                          const pv = parseFloat(entity.state) || 0;
                          if (pv > 2000) return 'linear-gradient(135deg, rgba(76,175,80,0.15) 0%, rgba(76,175,80,0.03) 100%)';
                          if (pv > 500) return 'linear-gradient(135deg, rgba(255,152,0,0.12) 0%, rgba(255,152,0,0.03) 100%)';
                          return 'var(--card-background-color)';
                        ]]]
                  icon:
                    - width: 56px
                    - color: |
                        [[[
                          const pv = parseFloat(entity.state) || 0;
                          if (pv > 2000) return '#4caf50';
                          if (pv > 500) return '#ff9800';
                          return '#9e9e9e';
                        ]]]
                  label:
                    - text-align: left
                    - padding: 0
                  custom_fields:
                    bar:
                      - padding: 0 16px 8px
                      - position: absolute
                      - bottom: 0
                      - left: 0
                      - right: 0
                      - width: calc(100% - 32px)
                  grid:
                    - padding-bottom: 35px
              # ── Bazén ──
              - type: custom:button-card
                entity: sensor.tcp_modbus_pool_water_temperature
                show_name: false
                show_state: false
                show_icon: true
                show_label: true
                layout: icon_label
                icon: mdi:pool
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-wallboard/bazen
                custom_fields:
                  bar: |
                    [[[
                      const v = parseFloat(entity.state) || 0;
                      const pct = Math.max(0, Math.min((v - 5) / 27 * 100, 100));
                      const pump = states['binary_sensor.bazen_modbus_filtration_pump'].state === 'on';
                      let color = '#9e9e9e';
                      if (pump) { color = v >= 26 ? '#4caf50' : v >= 22 ? '#ff9800' : '#2196f3'; }
                      return `<div style="width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden">
                        <div style="width:${pct}%;height:100%;border-radius:6px;background:${color};transition:width 0.5s ease"></div>
                      </div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--secondary-text-color);margin-top:2px"><span>5°C</span><span>32°C</span></div>`;
                    ]]]
                label: |
                  [[[
                    const temp = parseFloat(entity.state);
                    const tempStr = !isNaN(temp) ? temp.toFixed(1) + '°C' : '—';
                    const err = states['binary_sensor.bazen_modbus_pool_error'].state === 'on';
                    const errList = states['sensor.bazen_modbus_pool_error_list'].state || '';
                    const pump = states['binary_sensor.bazen_modbus_filtration_pump'].state === 'on';
                    const ph = parseFloat(states['sensor.bazen_modbus_ph_level'].state);
                    const tempColor = !isNaN(temp) && temp >= 24 ? '#4caf50' : !isNaN(temp) && temp >= 18 ? '#ff9800' : '#2196f3';
                    let status = '';
                    if (err && !errList.includes('BOOST') && !errList.includes('AntiFrost')) {
                      status = '<span style="color:#f44336">⚠️ ' + errList + '</span>';
                    } else {
                      let p = [];
                      if (!isNaN(ph) && pump) p.push('pH ' + ph.toFixed(1));
                      p.push(pump ? '✅ Filtrace' : '⏸️ Klid');
                      status = p.join('  ');
                    }
                    return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Bazén</div>
                      <div style="font-size:26px;font-weight:bold;color:${tempColor}">${tempStr}</div>
                      <div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">${status}</div>
                    </div>`;
                  ]]]
                styles:
                  card:
                    - height: 130px
                    - background: |
                        [[[
                          const err = states['binary_sensor.bazen_modbus_pool_error'].state === 'on';
                          const errList = states['sensor.bazen_modbus_pool_error_list'].state || '';
                          if (err && !errList.includes('BOOST') && !errList.includes('AntiFrost')) return 'linear-gradient(135deg, rgba(244,67,54,0.15) 0%, rgba(244,67,54,0.03) 100%)';
                          const pump = states['binary_sensor.bazen_modbus_filtration_pump'].state === 'on';
                          if (pump) return 'linear-gradient(135deg, rgba(33,150,243,0.12) 0%, rgba(33,150,243,0.03) 100%)';
                          return 'var(--card-background-color)';
                        ]]]
                  icon:
                    - width: 56px
                    - color: |
                        [[[
                          const err = states['binary_sensor.bazen_modbus_pool_error'].state === 'on';
                          const errList = states['sensor.bazen_modbus_pool_error_list'].state || '';
                          if (err && !errList.includes('BOOST') && !errList.includes('AntiFrost')) return '#f44336';
                          const pump = states['binary_sensor.bazen_modbus_filtration_pump'].state === 'on';
                          if (pump) return '#2196f3';
                          return '#9e9e9e';
                        ]]]
                  label:
                    - text-align: left
                    - padding: 0
                  custom_fields:
                    bar:
                      - padding: 0 16px 8px
                      - position: absolute
                      - bottom: 0
                      - left: 0
                      - right: 0
                      - width: calc(100% - 32px)
                  grid:
                    - padding-bottom: 35px
               # ── Topení + VZT ──
              - type: custom:button-card
                entity: sensor.atrea_vzt_control_vzt_aktualni_rezim
                show_name: false
                show_state: false
                show_icon: true
                show_label: true
                layout: icon_label
                icon: mdi:home-thermometer
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-wallboard/domov
                custom_fields:
                  bar: |
                    [[[
                      const klimat = states['climate.domaci_topeni'];
                      const v = klimat ? parseFloat(klimat.attributes.current_temperature) || 20 : 20;
                      const pct = Math.max(0, Math.min((v - 15) / 13 * 100, 100));
                      let color = '#9e9e9e';
                      if (v >= 21 && v <= 24) color = '#4caf50';
                      else if (v >= 19) color = '#ff9800';
                      else color = '#2196f3';
                      return `<div style="width:100%;height:12px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden">
                        <div style="width:${pct}%;height:100%;border-radius:6px;background:${color};transition:width 0.5s ease"></div>
                      </div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--secondary-text-color);margin-top:2px"><span>15°C</span><span>28°C</span></div>`;
                    ]]]
                label: |
                  [[[
                    const havarie = states['binary_sensor.kotelna_regulator_plyn_havarie'].state === 'on';
                    const vzt = entity.state;
                    const klimat = states['climate.domaci_topeni'];
                    const temp = klimat ? parseFloat(klimat.attributes.current_temperature) : null;
                    const tempStr = temp != null ? (Math.round(temp * 10) / 10) + '°C' : '—';
                    const tempColor = temp >= 21 && temp <= 24 ? '#4caf50' : temp >= 19 ? '#ff9800' : '#2196f3';
                    if (havarie) return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Topení + VZT</div>
                      <div style="font-size:26px;font-weight:bold;color:#f44336">${tempStr}</div>
                      <div style="font-size:11px;color:#f44336;margin-top:4px">⚠️ HAVÁRIE kotle!</div>
                    </div>`;
                    let parts = [];
                    const kotelStav = states['sensor.kotelna_regulator_plyn_stav'].state;
                    const topi = kotelStav && kotelStav !== 'Klid' && kotelStav !== 'Vypnutý' && kotelStav !== 'unknown' && kotelStav !== 'unavailable';
                    if (topi) parts.push('🔥 ' + kotelStav);
                    if (vzt === 'Nárazové větrání' || vzt === 'Větrání (Profuk)') parts.push('💨 Větrá');
                    else if (vzt === 'Pouze Topení') parts.push('🔥 VZT topí');
                    return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Topení + VZT</div>
                      <div style="font-size:26px;font-weight:bold;color:${tempColor}">${tempStr}</div>
                      <div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">${parts.join('  ') || 'Klid'}</div>
                    </div>`;
                  ]]]
                styles:
                  card:
                    - height: 130px
                    - background: |
                        [[[
                          const havarie = states['binary_sensor.kotelna_regulator_plyn_havarie'].state === 'on';
                          if (havarie) return 'linear-gradient(135deg, rgba(244,67,54,0.2) 0%, rgba(244,67,54,0.03) 100%)';
                          const kotelStav = states['sensor.kotelna_regulator_plyn_stav'].state;
                          const topi = kotelStav && kotelStav !== 'Klid' && kotelStav !== 'Vypnutý' && kotelStav !== 'unknown' && kotelStav !== 'unavailable';
                          if (topi) return 'linear-gradient(135deg, rgba(252,174,30,0.12) 0%, rgba(252,174,30,0.03) 100%)';
                          return 'var(--card-background-color)';
                        ]]]
                  icon:
                    - width: 56px
                    - color: |
                        [[[
                          const havarie = states['binary_sensor.kotelna_regulator_plyn_havarie'].state === 'on';
                          if (havarie) return '#f44336';
                          const kotelStav = states['sensor.kotelna_regulator_plyn_stav'].state;
                          const topi = kotelStav && kotelStav !== 'Klid' && kotelStav !== 'Vypnutý' && kotelStav !== 'unknown' && kotelStav !== 'unavailable';
                          if (topi) return '#fcae1e';
                          const vzt = entity.state;
                          if (vzt === 'Nárazové větrání' || vzt === 'Větrání (Profuk)') return '#2196f3';
                          return '#9e9e9e';
                        ]]]
                  label:
                    - text-align: left
                    - padding: 0
                  custom_fields:
                    bar:
                      - padding: 0 16px 8px
                      - position: absolute
                      - bottom: 0
                      - left: 0
                      - right: 0
                      - width: calc(100% - 32px)
                  grid:
                    - padding-bottom: 35px
              # ── Rolety ──
              - type: custom:button-card
                entity: cover.okna_terasa
                show_name: false
                show_state: false
                show_icon: true
                show_label: true
                layout: icon_label
                icon: mdi:window-shutter
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-wallboard/rolety
                label: |
                  [[[
                    const covers = [
                      { name: 'Dveře', e: states['cover.terasa_dvere'] },
                      { name: 'Okna', e: states['cover.okna_terasa'] },
                      { name: 'Kuchyň', e: states['cover.kuchyn_roleta_roleta'] }
                    ];
                    const open = covers.filter(c => c.e && c.e.state === 'open').length;
                    const mainText = open === 0 ? 'Vše zavřeno' : open === 3 ? 'Vše otevřeno' : open + '× otevřeno';
                    const mainColor = open === 0 ? '#9e9e9e' : '#4caf50';
                    const detail = covers.map(c => {
                      if (!c.e) return '';
                      const pos = c.e.attributes.current_position;
                      return pos != null ? c.name + ' ' + pos + '%' : c.name + (c.e.state === 'open' ? ' ↑' : ' ↓');
                    }).filter(s => s).join('  ');
                    return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Rolety</div>
                      <div style="font-size:22px;font-weight:bold;color:${mainColor}">${mainText}</div>
                      <div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">${detail}</div>
                    </div>`;
                  ]]]
                styles:
                  card:
                    - height: 90px
                    - background: |
                        [[[
                          const covers = ['cover.terasa_dvere', 'cover.okna_terasa', 'cover.kuchyn_roleta_roleta'];
                          const open = covers.filter(c => states[c] && states[c].state === 'open').length;
                          if (open > 0) return 'linear-gradient(135deg, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.03) 100%)';
                          return 'var(--card-background-color)';
                        ]]]
                  icon:
                    - width: 56px
                    - color: |
                        [[[
                          const covers = ['cover.terasa_dvere', 'cover.okna_terasa', 'cover.kuchyn_roleta_roleta'];
                          const open = covers.filter(c => states[c] && states[c].state === 'open').length;
                          return open > 0 ? '#4caf50' : '#9e9e9e';
                        ]]]
                  label:
                    - text-align: left
                    - padding: 0
              # ── Zahrada ──
              - type: custom:button-card
                entity: light.jezirko_cerpadlo_vodopad
                show_name: false
                show_state: false
                show_icon: true
                show_label: true
                layout: icon_label
                icon: mdi:flower
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-wallboard/zahrada
                label: |
                  [[[
                    const vodopad = states['light.jezirko_cerpadlo_vodopad'];
                    const potok = states['light.jezirko_cerpadlo_filtr'];
                    const uv = states['light.jezirko_uv_lampa'];
                    const osv = states['light.jezirko_osvetleni'];
                    const on = [vodopad, potok, uv, osv].filter(e => e && e.state === 'on').length;
                    const mainText = on === 0 ? 'Vše vypnuto' : on + '× zapnuto';
                    const mainColor = on === 0 ? '#9e9e9e' : '#4caf50';
                    let detail = [];
                    if (vodopad && vodopad.state === 'on') detail.push('💧 Vodopád');
                    if (potok && potok.state === 'on') detail.push('🌊 Potok');
                    if (uv && uv.state === 'on') detail.push('🔆 UV');
                    if (osv && osv.state === 'on') detail.push('💡 Světlo');
                    return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Zahrada</div>
                      <div style="font-size:22px;font-weight:bold;color:${mainColor}">${mainText}</div>
                      <div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">${detail.join('  ') || 'Jezírko v klidu'}</div>
                    </div>`;
                  ]]]
                styles:
                  card:
                    - height: 90px
                    - background: |
                        [[[
                          const items = ['light.jezirko_cerpadlo_vodopad', 'light.jezirko_cerpadlo_filtr', 'light.jezirko_uv_lampa', 'light.jezirko_osvetleni'];
                          const on = items.filter(e => states[e] && states[e].state === 'on').length;
                          if (on > 0) return 'linear-gradient(135deg, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.03) 100%)';
                          return 'var(--card-background-color)';
                        ]]]
                  icon:
                    - width: 56px
                    - color: |
                        [[[
                          const items = ['light.jezirko_cerpadlo_vodopad', 'light.jezirko_cerpadlo_filtr', 'light.jezirko_uv_lampa', 'light.jezirko_osvetleni'];
                          const on = items.filter(e => states[e] && states[e].state === 'on').length;
                          return on > 0 ? '#4caf50' : '#9e9e9e';
                        ]]]
                  label:
                    - text-align: left
                    - padding: 0
              # ── Sekačka ──
              - type: custom:button-card
                entity: lawn_mower.zerik
                show_name: false
                show_state: false
                show_icon: true
                show_label: true
                layout: icon_label
                icon: mdi:robot-mower
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-wallboard/sekacka
                label: |
                  [[[
                    const stav = entity.state;
                    const bat = parseFloat(states['sensor.zerik_baterie'].state) || 0;
                    const postup = parseFloat(states['sensor.zerik_postup'].state) || 0;
                    let stavText = stav;
                    let stavColor = '#9e9e9e';
                    if (stav === 'mowing') { stavText = 'Seče'; stavColor = '#4caf50'; }
                    else if (stav === 'docked') { stavText = 'V doku'; stavColor = '#2196f3'; }
                    else if (stav === 'paused') { stavText = 'Pauza'; stavColor = '#ff9800'; }
                    else if (stav === 'returning') { stavText = 'Vrací se'; stavColor = '#9c27b0'; }
                    else if (stav === 'error') { stavText = 'Chyba!'; stavColor = '#f44336'; }
                    let detail = '🔋 ' + Math.round(bat) + '%';
                    if (stav === 'mowing' && postup > 0) detail += '  📊 ' + Math.round(postup) + '%';
                    return `<div style="line-height:1.3">
                      <div style="font-size:13px;font-weight:600;margin-bottom:2px">Sekačka</div>
                      <div style="font-size:22px;font-weight:bold;color:${stavColor}">${stavText}</div>
                      <div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">${detail}</div>
                    </div>`;
                  ]]]
                styles:
                  card:
                    - height: 90px
                    - background: |
                        [[[
                          const s = entity.state;
                          if (s === 'mowing') return 'linear-gradient(135deg, rgba(76,175,80,0.12) 0%, rgba(76,175,80,0.03) 100%)';
                          if (s === 'error') return 'linear-gradient(135deg, rgba(244,67,54,0.15) 0%, rgba(244,67,54,0.03) 100%)';
                          return 'var(--card-background-color)';
                        ]]]
                  icon:
                    - width: 56px
                    - color: |
                        [[[
                          const s = entity.state;
                          if (s === 'mowing') return '#4caf50';
                          if (s === 'docked') return '#2196f3';
                          if (s === 'paused') return '#ff9800';
                          if (s === 'error') return '#f44336';
                          return '#9e9e9e';
                        ]]]
                  label:
                    - text-align: left
                    - padding: 0
            view_layout:
              grid-column: 2
  - type: panel
    path: domov
    title: Topení + VZT
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          height: 100vh
          grid-template-columns: 1fr 1fr
          grid-template-rows: 1fr
          grid-gap: 12px
          margin: 4px
        cards:
          - type: vertical-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    entity: sensor.atrea_vzt_control_vzt_aktualni_rezim
                    name: Větrání
                    show_name: false
                    show_state: true
                    show_icon: true
                    styles:
                      card:
                        - height: 100px
                    state:
                      - value: Žádný
                        icon: mdi:fan-off
                        show_state: false
                        styles:
                          icon:
                            - color: var(--disabled-text-color)
                          card:
                            - opacity: 0.6
                      - value: Klid
                        icon: mdi:sleep
                        styles:
                          icon:
                            - color: '#9e9e9e'
                      - value: Nárazové větrání
                        icon: mdi:fan-speed-3
                        styles:
                          icon:
                            - color: '#00d1ff'
                            - animation: rotating 1s linear infinite
                      - value: Nárazové větrání + Topení
                        icon: mdi:sun-thermometer
                        styles:
                          icon:
                            - color: '#ff9800'
                      - value: Větrání (Profuk)
                        icon: mdi:weather-windy
                        styles:
                          icon:
                            - color: '#2196f3'
                            - animation: rotating 3s linear infinite
                      - value: Větrání (Profuk) + Topení
                        icon: mdi:waves-arrow-up
                        styles:
                          icon:
                            - color: '#ff5722'
                      - value: Pouze Topení
                        icon: mdi:radiator
                        styles:
                          icon:
                            - color: '#f44336'
                      - operator: default
                        icon: mdi:fan
                        styles:
                          icon:
                            - color: '#00d1ff'
                  - type: custom:button-card
                    entity: sensor.atrea_vzt_control_vzt_duvod_narazoveho_vetrani
                    show_name: false
                    show_icon: true
                    show_state: true
                    styles:
                      card:
                        - height: 100px
                    state:
                      - value: Žádný
                        icon: mdi:fan-off
                        show_state: false
                        styles:
                          icon:
