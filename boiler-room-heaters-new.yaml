esphome:
  name: boiler-room-v2
  friendly_name: Boiler room V2

esp32:
  board: esp32-c6-devkitc-1 # XIAO C6 používá toto nastavení
  variant: esp32c6
  framework:
    type: esp-idf



# Enable logging
logger:
  level: INFO
  logs:
    sensor: WARN
    dallas.sensor: WARN

# Enable Home Assistant API
api:
  encryption:
    key: "9L/bk2VmBAQsr1AOstQ5VefpNbnjGAEziDRPrTKyEBw="

ota:
  - platform: esphome
    password: "259251edf6e7e1e27ce716db258d0e94"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.113
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Boiler-Room-Heaters_v2"
    password: "tMUQtkVnJjVW"

captive_portal:

# --- SBĚRNICE (podle schématu) ---
i2c:
  sda: GPIO22
  scl: GPIO23

spi:
  clk_pin: GPIO19
  miso_pin: GPIO20

one_wire:
  - platform: gpio
    pin: GPIO17 # Pin označený jako D5/DS18B20

# 0x3c00000559fe8628 (DS18B20) OK - Plynovy kotel vystup
# 0x0f00000559c87528 (DS18B20) OK - Plynovy kotel vrat
# 0xfb000003ea4ce628 (DS18B20) OK - Kotel na tuhá paliva vystup
# 0x60000003ea354528 (DS18B20) OK - Kotel na tuhá paliva vrat



globals:
  - id: last_pump_run_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: pump_forced_run
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: display_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_valve_close_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'

sensor:
  - platform: dallas_temp
    address: 0x3c00000559fe8628
    name: Teplota - Plynovy kotel> vystup
    id: teplota_plynovy_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x0f00000559c87528
    name: Teplota - Plynovy kotel> vrat
    id: teplota_plynovy_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0xfb000003ea4ce628
    name: Teplota - Kotel> Vystup
    id: teplota_kotel_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x60000003ea354528
    name: Teplota - Kotel> vrat
    id: teplota_kotel_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  # Teplota komína (Termočlánek přes SPI)
  - platform: max6675
    name: "Teplota - Komín (Termočlánek)"
    id: teplota_komin
    cs_pin: GPIO18
    update_interval: 10s

  # Průtok vody (podle schématu na GPIO16 - D6)
  - platform: pulse_meter
    pin: GPIO16
    name: "Aktuální průtok vody"
    id: prutok_vody
    unit_of_measurement: "l/min"
    internal_filter: 100us
    timeout: 5min
    filters:
      - lambda: return (x / 450.0);
    total:
      name: "Celkový průtok vody"
      id: celkovy_prutok
      unit_of_measurement: "L"
      accuracy_decimals: 1
  
  # Vypočítané rozdíly teplot
  - platform: template
    name: "Rozdíl teplot - Plynový kotel"
    id: rozdil_plynovy
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_plynovy_vystup).state) || isnan(id(teplota_plynovy_vrat).state)) {
        return {};
      }
      return id(teplota_plynovy_vystup).state - id(teplota_plynovy_vrat).state;
  
  - platform: template
    name: "Rozdíl teplot - Kotel na tuhá paliva"
    id: rozdil_kotel
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_kotel_vystup).state) || isnan(id(teplota_kotel_vrat).state)) {
        return {};
      }
      return id(teplota_kotel_vystup).state - id(teplota_kotel_vrat).state;

number:
  - platform: template
    name: "Regulátor - Rozdíl zapnutí"
    id: regulator_rozdil_zapnuti
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    on_value:
      then:
        - lambda: |-
            float vypnuti = id(regulator_rozdil_vypnuti).state;
            float zapnuti = x;
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(regulator_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("regulator", "Automatická korekce: Rozdíl vypnutí nastaven na %.1f°C (zapnutí - 2°C)", nova_hodnota);
            }
  
  - platform: template
    name: "Regulátor - Rozdíl vypnutí"
    id: regulator_rozdil_vypnuti
    min_value: 0
    max_value: 28
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    on_value:
      then:
        - lambda: |-
            float zapnuti = id(regulator_rozdil_zapnuti).state;
            float vypnuti = x;
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(regulator_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("regulator", "Neplatná hodnota! Rozdíl vypnutí musí být min. o 2°C nižší než zapnutí. Nastaveno na %.1f°C", nova_hodnota);
            }
  
  - platform: template
    name: "Havarijní limit - Teplota"
    id: havarijni_limit_teplota
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box

output:
  - platform: gpio
    pin: GPIO0
    id: gpio_rele_ventil_voda
  - platform: gpio
    pin: GPIO1
    id: gpio_rele_obehove_cerpadlo
  - platform: gpio
    pin: GPIO2
    id: gpio_rele_plyn
  - platform: gpio
    pin: GPIO21
    id: gpio_led_red

switch:
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  
  - platform: output
    output: gpio_rele_ventil_voda
    name: "Hlavní ventil vody"
    id: switch_hlavni_ventil
    on_turn_off:
      then:
        - lambda: |-
            id(last_valve_close_time) = millis();

  - platform: output
    name: Oběhové čerpadlo kotle
    output: gpio_rele_obehove_cerpadlo
    id: switch_obehove_cerpadlo
  
  - platform: output
    output: gpio_rele_plyn
    name: "Spínání plynového kotle"
    id: switch_plynovy_kotel
  
  - platform: template
    name: "Regulátor - Povolit automatiku"
    id: regulator_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: template
    name: "Status - Čerpadlo běží"
    id: status_cerpadlo_bezi
    lambda: |-
      return id(switch_obehove_cerpadlo).state;
  
  - platform: template
    name: "Status - Havarijní režim"
    id: status_havarijni_rezim
  
  - platform: template
    name: "Status - Chyba čidla"
    id: status_chyba_cidla

text_sensor:
  - platform: template
    name: "Stav regulátoru"
    id: stav_regulatoru
    update_interval: never

interval:
  # Střídání stránek displeje každých 4 sekund
  - interval: 4s
    then:
      - lambda: |-
          // Při havárii nebo chybě čidla zobrazit 4 stránky, jinak 3
          int max_pages = (id(status_havarijni_rezim).state || id(status_chyba_cidla).state) ? 4 : 3;
          id(display_page) = (id(display_page) + 1) % max_pages;

  # LED status indikace - každou sekundu
  - interval: 1s
    then:
      - lambda: |-
          if (id(status_chyba_cidla).state || id(status_havarijni_rezim).state) {
            id(switch_led_red).turn_on();
          } else {
            id(switch_led_red).turn_off();
          }
  
  # Hlavní regulační logika - každých 10 sekund
  - interval: 10s
    then:
      - lambda: |-
          static bool last_pump_state = false;
          static bool last_emergency_state = false;
          static bool last_sensor_error = false;
          
          bool pump_should_run = false;
          bool emergency_mode = false;
          bool sensor_error = false;
          std::string status_text = "Neaktivní";
          
          float temp_kotel_vystup = id(teplota_kotel_vystup).state;
          float temp_kotel_vrat = id(teplota_kotel_vrat).state;
          float rozdil = 0;
          
          if (isnan(temp_kotel_vystup) || isnan(temp_kotel_vrat)) {
            sensor_error = true;
            pump_should_run = true;
            emergency_mode = true;
            status_text = "CHYBA ČIDLA - Čerpadlo ZAP";
            
            if (!last_sensor_error) {
              ESP_LOGE("regulator", "CHYBA: Nefunkční teplotní čidlo! Zapínám čerpadlo jako bezpečnostní opatření.");
              last_sensor_error = true;
            }
          } else {
            last_sensor_error = false;
            rozdil = temp_kotel_vystup - temp_kotel_vrat;
            
            float havarijni_limit = id(havarijni_limit_teplota).state;
            if (temp_kotel_vystup > havarijni_limit) {
              pump_should_run = true;
              emergency_mode = true;
              
              char buffer[100];
              snprintf(buffer, sizeof(buffer), "HAVÁRIE - Teplota %d°C > %d°C", 
                       (int)temp_kotel_vystup, (int)havarijni_limit);
              status_text = buffer;
              
              if (!last_emergency_state) {
                ESP_LOGE("regulator", "HAVÁRIE! Teplota výstupu %.1f°C překročila limit %.1f°C - ZAPÍNÁM ČERPADLO!", 
                         temp_kotel_vystup, havarijni_limit);
                last_emergency_state = true;
              }
            } else {
              if (last_emergency_state) {
                ESP_LOGI("regulator", "Havarijní režim ukončen. Teplota %.1f°C pod limitem %.1f°C", 
                         temp_kotel_vystup, havarijni_limit);
                last_emergency_state = false;
              }
              
              if (id(regulator_enable).state) {
                float rozdil_zapnuti = id(regulator_rozdil_zapnuti).state;
                float rozdil_vypnuti = id(regulator_rozdil_vypnuti).state;
                bool current_pump_state = id(switch_obehove_cerpadlo).state;
                
                if (!current_pump_state && rozdil >= rozdil_zapnuti) {
                  pump_should_run = true;
                  
                  char buffer[100];
                  snprintf(buffer, sizeof(buffer), "Regulace ZAP - Rozdíl %d°C >= %d°C", 
                           (int)rozdil, (int)rozdil_zapnuti);
                  status_text = buffer;
                  
                  ESP_LOGI("regulator", "Zapínám čerpadlo: Rozdíl teplot %.1f°C >= %.1f°C (Výstup: %.1f°C, Vrát: %.1f°C)", 
                           rozdil, rozdil_zapnuti, temp_kotel_vystup, temp_kotel_vrat);
                } else if (current_pump_state && rozdil <= rozdil_vypnuti) {
                  pump_should_run = false;
                  
                  char buffer[100];
                  snprintf(buffer, sizeof(buffer), "Regulace VYP - Rozdíl %d°C <= %d°C", 
                           (int)rozdil, (int)rozdil_vypnuti);
                  status_text = buffer;
                  
                  ESP_LOGI("regulator", "Vypínám čerpadlo: Rozdíl teplot %.1f°C <= %.1f°C (Výstup: %.1f°C, Vrát: %.1f°C)", 
                           rozdil, rozdil_vypnuti, temp_kotel_vystup, temp_kotel_vrat);
                } else {
                  pump_should_run = current_pump_state;
                  
                  char buffer[100];
                  if (current_pump_state) {
                    snprintf(buffer, sizeof(buffer), "Regulace BĚH - Rozdíl %d°C", (int)rozdil);
                  } else {
                    snprintf(buffer, sizeof(buffer), "Regulace ČEKÁ - Rozdíl %d°C", (int)rozdil);
                  }
                  status_text = buffer;
                }
              } else {
                status_text = "Automatika vypnuta";
              }
            }
          }
          
          id(status_havarijni_rezim).publish_state(emergency_mode);
          id(status_chyba_cidla).publish_state(sensor_error);
          id(stav_regulatoru).publish_state(status_text);
          
          if (pump_should_run != last_pump_state) {
            if (pump_should_run) {
              id(switch_obehove_cerpadlo).turn_on();
              id(last_pump_run_time) = millis();
            } else {
              id(switch_obehove_cerpadlo).turn_off();
            }
            last_pump_state = pump_should_run;
          }
          
          if (id(switch_obehove_cerpadlo).state) {
            id(last_pump_run_time) = millis();
          }
  
  # Kontrola týdenního běhu čerpadla - každou hodinu
  - interval: 1h
    then:
      - lambda: |-
          const unsigned long WEEK_IN_MS = 7UL * 24UL * 60UL * 60UL * 1000UL;
          const unsigned long FIVE_MINUTES_MS = 5UL * 60UL * 1000UL;
          
          unsigned long current_time = millis();
          unsigned long last_run = id(last_pump_run_time);
          
          unsigned long time_since_last_run;
          if (current_time >= last_run) {
            time_since_last_run = current_time - last_run;
          } else {
            time_since_last_run = current_time;
          }
          
          if (time_since_last_run > WEEK_IN_MS && !id(pump_forced_run)) {
            ESP_LOGW("maintenance", "Čerpadlo neběželo %.1f dní - spouštím 5minutový testovací běh proti zatuhnutí", 
                     time_since_last_run / (24.0 * 60.0 * 60.0 * 1000.0));
            
            id(pump_forced_run) = true;
            id(switch_obehove_cerpadlo).turn_on();
            id(stav_regulatoru).publish_state("Testovací běh - ochrana proti zatuhnutí");
            
            id(forced_run_timer).execute();
          }

script:
  - id: forced_run_timer
    then:
      - delay: 5min
      - lambda: |-
          if (id(pump_forced_run)) {
            ESP_LOGI("maintenance", "Testovací běh dokončen - vypínám čerpadlo");
            id(switch_obehove_cerpadlo).turn_off();
            id(pump_forced_run) = false;
            id(last_pump_run_time) = millis();
          }

# --- DISPLAY ---
font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_medium
    size: 12
  - file: "gfonts://Roboto"
    id: font_large
    size: 16

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 1s
    id: oled_display
    lambda: |-
      // Pomocná funkce pro formátování času
      auto format_time_ago = [](unsigned long ms_ago) -> std::string {
        if (ms_ago == 0) return "Nikdy";
        unsigned long seconds = ms_ago / 1000;
        if (seconds < 60) return str_sprintf("%lus", seconds);
        unsigned long minutes = seconds / 60;
        if (minutes < 60) return str_sprintf("%lumin", minutes);
        unsigned long hours = minutes / 60;
        if (hours < 24) return str_sprintf("%luh", hours);
        unsigned long days = hours / 24;
        return str_sprintf("%lud", days);
      };
      
      // Hlavička - stejná pro všechny stránky
      it.filled_rectangle(0, 0, 128, 13);
      
      // STRÁNKA 0: PLYNOVÝ KOTEL
      if (id(display_page) == 0) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "PLYN");
        
        // Zda topí
        it.printf(2, 16, id(font_small), "Status:");
        it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, 
                  id(switch_plynovy_kotel).state ? "TOPI" : "NETOPI");
        
        // Výstup
        it.printf(2, 26, id(font_small), "Vystup:");
        if (!isnan(id(teplota_plynovy_vystup).state)) {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(teplota_plynovy_vystup).state);
        } else {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
        
        // Vrát
        it.printf(2, 36, id(font_small), "Vrat:");
        if (!isnan(id(teplota_plynovy_vrat).state)) {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(teplota_plynovy_vrat).state);
        } else {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
        
        // Delta
        it.printf(2, 46, id(font_small), "Delta:");
        if (!isnan(id(rozdil_plynovy).state)) {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(rozdil_plynovy).state);
        } else {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      }
      
      // STRÁNKA 1: KOTEL NA TUHÁ PALIVA
      else if (id(display_page) == 1) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "KOTEL");
        
        // Zda topí (čerpadlo běží = topí)
        it.printf(2, 16, id(font_small), "Status:");
        it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, 
                  id(switch_obehove_cerpadlo).state ? "TOPI" : "NETOPI");
        
        // Pokud netopí, kdy naposledy běželo čerpadlo
        if (!id(switch_obehove_cerpadlo).state) {
          it.printf(2, 26, id(font_small), "Posl.beh:");
          unsigned long time_ago = millis() - id(last_pump_run_time);
          std::string time_str = format_time_ago(time_ago);
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%s", time_str.c_str());
        } else {
          // Výstup
          it.printf(2, 26, id(font_small), "Vystup:");
          if (!isnan(id(teplota_kotel_vystup).state)) {
            it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                      id(teplota_kotel_vystup).state);
          } else {
            it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "---");
          }
        }
        
        // Vrát
        it.printf(2, 36, id(font_small), "Vrat:");
        if (!isnan(id(teplota_kotel_vrat).state)) {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(teplota_kotel_vrat).state);
        } else {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
        
        // Delta
        it.printf(2, 46, id(font_small), "Delta:");
        if (!isnan(id(rozdil_kotel).state)) {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(rozdil_kotel).state);
        } else {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      }
      
      // STRÁNKA 2: VODA
      else if (id(display_page) == 2) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "VODA");
        
        // Aktuální průtok
        it.printf(2, 16, id(font_small), "Prutok:");
        if (!isnan(id(prutok_vody).state)) {
          it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "%.1f L/min", 
                    id(prutok_vody).state);
        } else {
          it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
        
        // Celkový průtok
        it.printf(2, 26, id(font_small), "Celkem:");
        if (!isnan(id(celkovy_prutok).state)) {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.0f L", 
                    id(celkovy_prutok).state);
        } else {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
        
        // Ventil status
        it.printf(2, 36, id(font_small), "Ventil:");
        it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, 
                  id(switch_hlavni_ventil).state ? "OTEVRENY" : "ZAVRENY");
        
        // Kdy naposledy zavřen
        it.printf(2, 46, id(font_small), "Zavren:");
        unsigned long time_ago = millis() - id(last_valve_close_time);
        std::string time_str = format_time_ago(time_ago);
        it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%s", time_str.c_str());
      }
      
      // STRÁNKA 3: ERROR/HAVÁRIE (zobrazí se jen při problému)
      else if (id(display_page) == 3) {
        if (id(status_havarijni_rezim).state) {
          it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "HAVARIE!");
          
          it.printf(2, 16, id(font_small), "Teplota:");
          it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(teplota_kotel_vystup).state);
          
          it.printf(2, 26, id(font_small), "Limit:");
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.0f°C", 
                    id(havarijni_limit_teplota).state);
          
          it.printf(2, 36, id(font_small), "Cerpadlo:");
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, 
                    id(switch_obehove_cerpadlo).state ? "ZAP" : "VYP");
          
          it.printf(2, 46, id(font_small), "Akce: Chlazeni!");
          
        } else if (id(status_chyba_cidla).state) {
          it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "CHYBA");
          
          it.printf(2, 16, id(font_small), "Typ: Cidlo");
          
          it.printf(2, 26, id(font_small), "Vystup:");
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, 
                    isnan(id(teplota_kotel_vystup).state) ? "CHYBA" : "OK");
          
          it.printf(2, 36, id(font_small), "Vrat:");
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, 
                    isnan(id(teplota_kotel_vrat).state) ? "CHYBA" : "OK");
          
          it.printf(2, 46, id(font_small), "Cerpadlo: ZAP");
        }
      }
      
      // Status bar na spodku - OPRAVENO
      it.line(0, 52, 128, 52);
      
      // Indikátor stránky a status
      if (id(status_havarijni_rezim).state) {
        // Bílý obdélník od y=53 do y=63 (celkem 11 pixelů)
        it.filled_rectangle(0, 53, 128, 11);
        // Text na y=53 (hned pod čárou)
        it.printf(64, 53, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER, 
                  "!HAVARIE! %d/4", id(display_page) + 1);
      } else if (id(status_chyba_cidla).state) {
        it.printf(64, 53, id(font_small), TextAlign::TOP_CENTER, 
                  "ERR:CIDLO %d/4", id(display_page) + 1);
      } else {
        it.printf(64, 53, id(font_small), TextAlign::TOP_CENTER, 
                  "< %d / 3 >", id(display_page) + 1);
      }