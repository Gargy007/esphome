esphome:
  name: boiler-room-heaters
  friendly_name: Boiler room - heaters

esp8266:
  board: esp01_1m

# Enable logging
logger:
  level: INFO
  logs:
    sensor: WARN
    dallas.sensor: WARN

# Enable Home Assistant API
api:
  encryption:
    key: "9L/bk2VmBAQsr1AOstQ5VefpNbnjGAEziDRPrTKyEBw="

ota:
  - platform: esphome
    password: "259251edf6e7e1e27ce716db258d0e94"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.111
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Boiler-Room-Heaters"
    password: "tMUQtkVnJjVW"

captive_portal:

# 0x3c00000559fe8628 (DS18B20) OK - Plynovy kotel vystup
# 0x0f00000559c87528 (DS18B20) OK - Plynovy kotel vrat
# 0xfb000003ea4ce628 (DS18B20) OK - Kotel na tuhá paliva vystup
# 0x60000003ea354528 (DS18B20) OK - Kotel na tuhá paliva vrat

one_wire:
  - platform: gpio
    pin: GPIO2

globals:
  - id: last_pump_run_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  - id: pump_forced_run
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: dallas_temp
    address: 0x3c00000559fe8628
    name: Teplota - Plynovy kotel> vystup
    id: teplota_plynovy_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x0f00000559c87528
    name: Teplota - Plynovy kotel> vrat
    id: teplota_plynovy_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0xfb000003ea4ce628
    name: Teplota - Kotel> Vystup
    id: teplota_kotel_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x60000003ea354528
    name: Teplota - Kotel> vrat
    id: teplota_kotel_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  # Vypočítané rozdíly teplot
  - platform: template
    name: "Rozdíl teplot - Plynový kotel"
    id: rozdil_plynovy
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_plynovy_vystup).state) || isnan(id(teplota_plynovy_vrat).state)) {
        return {};
      }
      return id(teplota_plynovy_vystup).state - id(teplota_plynovy_vrat).state;
  
  - platform: template
    name: "Rozdíl teplot - Kotel na tuhá paliva"
    id: rozdil_kotel
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_kotel_vystup).state) || isnan(id(teplota_kotel_vrat).state)) {
        return {};
      }
      return id(teplota_kotel_vystup).state - id(teplota_kotel_vrat).state;

number:
  - platform: template
    name: "Regulátor - Rozdíl zapnutí"
    id: regulator_rozdil_zapnuti
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    on_value:
      then:
        - lambda: |-
            float vypnuti = id(regulator_rozdil_vypnuti).state;
            float zapnuti = x;
            // Kontrola: vypnutí musí být minimálně o 2°C nižší než zapnutí
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(regulator_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("regulator", "Automatická korekce: Rozdíl vypnutí nastaven na %.1f°C (zapnutí - 2°C)", nova_hodnota);
            }
  
  - platform: template
    name: "Regulátor - Rozdíl vypnutí"
    id: regulator_rozdil_vypnuti
    min_value: 0
    max_value: 28
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    on_value:
      then:
        - lambda: |-
            float zapnuti = id(regulator_rozdil_zapnuti).state;
            float vypnuti = x;
            // Kontrola: vypnutí musí být minimálně o 2°C nižší než zapnutí
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(regulator_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("regulator", "Neplatná hodnota! Rozdíl vypnutí musí být min. o 2°C nižší než zapnutí. Nastaveno na %.1f°C", nova_hodnota);
            }
  
  - platform: template
    name: "Havarijní limit - Teplota"
    id: havarijni_limit_teplota
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box

output:
  - platform: gpio
    pin: GPIO15
    id: gpio_rele_obehove_cerpadlo
  - platform: gpio
    pin: GPIO5
    id: gpio_led_yellow
  - platform: gpio
    pin: GPIO4
    id: gpio_led_red
  - platform: gpio
    pin: GPIO0
    id: gpio_led_green
    
switch:
  - platform: output
    name: LED Yellow
    output: gpio_led_yellow
    id: switch_led_yellow
    internal: True
  
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  
  - platform: output
    name: LED Green
    output: gpio_led_green
    id: switch_led_green
    internal: True
  
  - platform: output
    name: Oběhové čerpadlo kotle
    output: gpio_rele_obehove_cerpadlo
    id: switch_obehove_cerpadlo
  
  - platform: template
    name: "Regulátor - Povolit automatiku"
    id: regulator_enable
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: template
    name: "Status - Čerpadlo běží"
    id: status_cerpadlo_bezi
    lambda: |-
      return id(switch_obehove_cerpadlo).state;
  
  - platform: template
    name: "Status - Havarijní režim"
    id: status_havarijni_rezim
  
  - platform: template
    name: "Status - Chyba čidla"
    id: status_chyba_cidla

text_sensor:
  - platform: template
    name: "Stav regulátoru"
    id: stav_regulatoru
    update_interval: never

interval:
  # LED status indikace - každou sekundu
  - interval: 1s
    then:
      - lambda: |-
          // Červená LED - chyba čidla nebo havarijní režim
          if (id(status_chyba_cidla).state || id(status_havarijni_rezim).state) {
            id(switch_led_red).turn_on();
          } else {
            id(switch_led_red).turn_off();
          }
          
          // Žlutá LED - čerpadlo běží
          if (id(switch_obehove_cerpadlo).state) {
            id(switch_led_yellow).turn_on();
          } else {
            id(switch_led_yellow).turn_off();
          }
          
          // Zelená LED - vše OK (wifi + api připojeno a žádná chyba)
          if (!id(status_chyba_cidla).state && !id(status_havarijni_rezim).state) {
            id(switch_led_green).turn_on();
          } else {
            id(switch_led_green).turn_off();
          }
  
  # Hlavní regulační logika - každých 10 sekund
  - interval: 10s
    then:
      - lambda: |-
          static bool last_pump_state = false;
          static bool last_emergency_state = false;
          static bool last_sensor_error = false;
          
          bool pump_should_run = false;
          bool emergency_mode = false;
          bool sensor_error = false;
          std::string status_text = "Neaktivní";
          
          float temp_kotel_vystup = id(teplota_kotel_vystup).state;
          float temp_kotel_vrat = id(teplota_kotel_vrat).state;
          float rozdil = 0;
          
          // Kontrola platnosti čidel
          if (isnan(temp_kotel_vystup) || isnan(temp_kotel_vrat)) {
            sensor_error = true;
            pump_should_run = true;
            emergency_mode = true;
            status_text = "CHYBA ČIDLA - Čerpadlo ZAP";
            
            if (!last_sensor_error) {
              ESP_LOGE("regulator", "CHYBA: Nefunkční teplotní čidlo! Zapínám čerpadlo jako bezpečnostní opatření.");
              last_sensor_error = true;
            }
          } else {
            last_sensor_error = false;
            rozdil = temp_kotel_vystup - temp_kotel_vrat;
            
            // 1. HAVARIJNÍ REŽIM - vysoká teplota
            float havarijni_limit = id(havarijni_limit_teplota).state;
            if (temp_kotel_vystup > havarijni_limit) {
              pump_should_run = true;
              emergency_mode = true;
              
              char buffer[100];
              snprintf(buffer, sizeof(buffer), "HAVÁRIE - Teplota %d°C > %d°C", 
                       (int)temp_kotel_vystup, (int)havarijni_limit);
              status_text = buffer;
              
              if (!last_emergency_state) {
                ESP_LOGE("regulator", "HAVÁRIE! Teplota výstupu %.1f°C překročila limit %.1f°C - ZAPÍNÁM ČERPADLO!", 
                         temp_kotel_vystup, havarijni_limit);
                last_emergency_state = true;
              }
            } else {
              if (last_emergency_state) {
                ESP_LOGI("regulator", "Havarijní režim ukončen. Teplota %.1f°C pod limitem %.1f°C", 
                         temp_kotel_vystup, havarijni_limit);
                last_emergency_state = false;
              }
              
              // 2. STANDARDNÍ REGULACE - pokud je povolena
              if (id(regulator_enable).state) {
                float rozdil_zapnuti = id(regulator_rozdil_zapnuti).state;
                float rozdil_vypnuti = id(regulator_rozdil_vypnuti).state;
                bool current_pump_state = id(switch_obehove_cerpadlo).state;
                
                // Hystereze - zapnout při vyšším rozdílu, vypnout při nižším
                if (!current_pump_state && rozdil >= rozdil_zapnuti) {
                  pump_should_run = true;
                  
                  char buffer[100];
                  snprintf(buffer, sizeof(buffer), "Regulace ZAP - Rozdíl %d°C >= %d°C", 
                           (int)rozdil, (int)rozdil_zapnuti);
                  status_text = buffer;
                  
                  ESP_LOGI("regulator", "Zapínám čerpadlo: Rozdíl teplot %.1f°C >= %.1f°C (Výstup: %.1f°C, Vrát: %.1f°C)", 
                           rozdil, rozdil_zapnuti, temp_kotel_vystup, temp_kotel_vrat);
                } else if (current_pump_state && rozdil <= rozdil_vypnuti) {
                  pump_should_run = false;
                  
                  char buffer[100];
                  snprintf(buffer, sizeof(buffer), "Regulace VYP - Rozdíl %d°C <= %d°C", 
                           (int)rozdil, (int)rozdil_vypnuti);
                  status_text = buffer;
                  
                  ESP_LOGI("regulator", "Vypínám čerpadlo: Rozdíl teplot %.1f°C <= %.1f°C (Výstup: %.1f°C, Vrát: %.1f°C)", 
                           rozdil, rozdil_vypnuti, temp_kotel_vystup, temp_kotel_vrat);
                } else {
                  pump_should_run = current_pump_state;
                  
                  char buffer[100];
                  if (current_pump_state) {
                    snprintf(buffer, sizeof(buffer), "Regulace BĚH - Rozdíl %d°C", (int)rozdil);
                  } else {
                    snprintf(buffer, sizeof(buffer), "Regulace ČEKÁ - Rozdíl %d°C", (int)rozdil);
                  }
                  status_text = buffer;
                }
              } else {
                status_text = "Automatika vypnuta";
              }
            }
          }
          
          // Aktualizace stavů
          id(status_havarijni_rezim).publish_state(emergency_mode);
          id(status_chyba_cidla).publish_state(sensor_error);
          id(stav_regulatoru).publish_state(status_text);
          
          // Řízení čerpadla
          if (pump_should_run != last_pump_state) {
            if (pump_should_run) {
              id(switch_obehove_cerpadlo).turn_on();
              id(last_pump_run_time) = millis();
            } else {
              id(switch_obehove_cerpadlo).turn_off();
            }
            last_pump_state = pump_should_run;
          }
          
          // Pokud čerpadlo běží, aktualizovat čas posledního běhu
          if (id(switch_obehove_cerpadlo).state) {
            id(last_pump_run_time) = millis();
          }
  
  # Kontrola týdenního běhu čerpadla - každou hodinu
  - interval: 1h
    then:
      - lambda: |-
          const unsigned long WEEK_IN_MS = 7UL * 24UL * 60UL * 60UL * 1000UL;
          const unsigned long FIVE_MINUTES_MS = 5UL * 60UL * 1000UL;
          
          unsigned long current_time = millis();
          unsigned long last_run = id(last_pump_run_time);
          
          // Ošetření přetečení millis() (cca po 49 dnech)
          unsigned long time_since_last_run;
          if (current_time >= last_run) {
            time_since_last_run = current_time - last_run;
          } else {
            // Přetečení - resetovat počítadlo
            time_since_last_run = current_time;
          }
          
          // Pokud čerpadlo neběželo více než týden
          if (time_since_last_run > WEEK_IN_MS && !id(pump_forced_run)) {
            ESP_LOGW("maintenance", "Čerpadlo neběželo %.1f dní - spouštím 5minutový testovací běh proti zatuhnutí", 
                     time_since_last_run / (24.0 * 60.0 * 60.0 * 1000.0));
            
            id(pump_forced_run) = true;
            id(switch_obehove_cerpadlo).turn_on();
            id(stav_regulatoru).publish_state("Testovací běh - ochrana proti zatuhnutí");
            
            // Naplánovat vypnutí po 5 minutách
            id(forced_run_timer).execute();
          }

script:
  - id: forced_run_timer
    then:
      - delay: 5min
      - lambda: |-
          if (id(pump_forced_run)) {
            ESP_LOGI("maintenance", "Testovací běh dokončen - vypínám čerpadlo");
            id(switch_obehove_cerpadlo).turn_off();
            id(pump_forced_run) = false;
            id(last_pump_run_time) = millis();
          }
