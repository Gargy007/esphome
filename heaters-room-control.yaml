# ============================================================================
# ESPHOME - ŘÍZENÍ KOTELNY V2
# ============================================================================
#
# POPIS PROJEKTU:
# ---------------
# Tento projekt řídí kompletní systém vytápění v kotelně s následujícími
# komponenty:
#   1. Kotel na tuhá paliva s oběhovým čerpadlem
#   2. Plynový kotel (záložní/doplňkový zdroj)
#   3. Vodní systém s hlavním ventilem a průtokoměrem
#
# Hardware: Seeed XIAO ESP32-C6
# Komunikace: WiFi + Home Assistant API
# Displej: OLED SH1106 128x64 (I2C)
# Čidla: DS18B20 (teploty), MAX6675 (termočlánek komína), průtokoměr
# Výstupy: 4x relé (čerpadlo, ventil, plyn, rezerva), LED indikace
#
# BEZPEČNOSTNÍ FUNKCE:
# --------------------
# - Automatická detekce chyb čidel → bezpečnostní režim
# - Havarijní chlazení při přehřátí
# - Ochrana čerpadla proti zatuhnutí (týdenní test)
# - Lokální indikace chyb (LED + LCD) i při výpadku WiFi/HA
# - Centralizovaný error systém pro všechny subsystémy
#
# ============================================================================

# ============================================================================
# SUBSYSTÉM 1: KOTEL NA TUHÁ PALIVA
# ============================================================================
#
# HARDWARE:
# ---------
# - Relé: GPIO1 (oběhové čerpadlo kotle)
# - Čidla teploty (DS18B20):
#   * 0xfb000003ea4ce628 - Výstup z kotle
#   * 0x60000003ea354528 - Vrát do kotle
# - Termočlánek (MAX6675): GPIO18 - Teplota komína
#
# FUNKCE:
# -------
# Primární úkol je řídit oběhové čerpadlo kotle podle teploty a stavu topení.
# Čerpadlo odvádí teplo z kotle do topného systému.
#
# LOGIKA ZAPNUTÍ ČERPADLA (OR podmínky):
# ---------------------------------------
# 1. Velký teplotní rozdíl (výstup - vrát) >= "Kotel - Rozdíl ZAP"
#    → Kotel má dostatek tepla k předání do systému
#
# 2. Vysoká teplota v komínu >= "Kotel - Komín ZAP"
#    → V kotli hoří, rychlá indikace topení (rychlejší než rozdíl teplot)
#
# 3. Manuální režim "Kotel - Manuální ZAP" = ON
#    → Uživatel může natvrdo zapnout čerpadlo
#
# 4. Havarijní režim (přehřátí nebo chyba čidla)
#    → Bezpečnostní zapnutí pro chlazení
#
# LOGIKA VYPNUTÍ ČERPADLA (AND podmínky):
# ----------------------------------------
# 1. Malý teplotní rozdíl <= "Kotel - Rozdíl VYP"
#    → Kotel nemá dostatek tepla
#
# 2. Nízká teplota v komínu <= "Kotel - Komín VYP"
#    → V kotli nehoří (nebo bez čidla komína - jen podmínka 1)
#
# 3. Není manuální režim
#    → Manuální režim má přednost, čerpadlo se nevypne
#
# HYSTEREZE:
# ----------
# Rozdíl mezi ZAP a VYP musí být minimálně 2°C, aby se zabránilo
# častému spínání čerpadla. Systém automaticky koriguje hodnoty.
#
# Příklad: ZAP=10°C, VYP=5°C
# - Při 10°C se zapne
# - Běží i při 9°C, 8°C, 7°C, 6°C (hystereze)
# - Při 5°C se vypne
# - Zůstane vypnuté při 6°C, 7°C, 8°C, 9°C
# - Při 10°C se znovu zapne
#
# HAVARIJNÍ STAVY:
# ----------------
# 1. Chyba čidla výstupu nebo vrátu
#    → Čerpadlo ZAP (bezpečnostní režim)
#    → Error: "Chyba čidla VYSTUP/VRAT"
#
# 2. Přehřátí: Teplota výstupu > "Kotel - Havarijní limit"
#    → Čerpadlo ZAP (nucené chlazení)
#    → Error: "PŘEHŘÁTÍ XX°C > YY°C"
#
# 3. Chyba čidla komína
#    → Čerpadlo ZAP (bezpečnostní režim)
#    → Error: "Chyba čidla KOMÍN"
#
# ÚDRŽBA ČERPADLA:
# ----------------
# Pokud čerpadlo neběželo více než 7 dní, automaticky se spustí
# 5minutový testovací běh proti zatuhnutí mechanických částí.
#
# NASTAVENÍ Z HOME ASSISTANT:
# ---------------------------
# - "Kotel - Rozdíl ZAP" (5-30°C, default 10°C)
# - "Kotel - Rozdíl VYP" (0-28°C, default 5°C)
# - "Kotel - Komín ZAP" (50-200°C, default 80°C)
# - "Kotel - Komín VYP" (30-150°C, default 50°C)
# - "Kotel - Havarijní limit" (70-95°C, default 85°C)
# - "Kotel - Manuální ZAP" (switch)
#
# STAVY A DIAGNOSTIKA:
# --------------------
# - "Kotel: Relé" (binary_sensor) - fyzický stav relé čerpadla
# - "Plyn: Relé" (binary_sensor) - fyzický stav relé plynu
# - "Voda: Relé" (binary_sensor) - fyzický stav relé ventilu vody
# - "Kotel - Topí (komín)" (binary_sensor)
# - "Kotel - Havarijní režim" (binary_sensor)

# - "Kotel - Čas od posledního běhu" (sensor v hodinách)
# - "Error - Kotel na tuhá paliva" (text_sensor) - aktuální chyba
#
# ============================================================================

esphome:
  name: "heaters-room-control"
  friendly_name: Kotelna regulator
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(voda_celkovy_prutok_snapshot) = 0.0f;
          id(voda_celkovy_prutok_posledni_ulozeni) = millis();
          ESP_LOGI("voda", "Obnoven celkovy odber vody: %.3f L", id(voda_celkovy_prutok_zaklad));
          if (id(voda_havarie_aktivni)) {
            id(voda_stav).publish_state("Havarie aktivni");
          } else if (id(voda_pause_aktivni)) {
            id(voda_stav).publish_state("Kontrola povodne pozastavena");
          } else if (id(switch_hlavni_ventil).state) {
            id(voda_stav).publish_state("Ventil uzavren");
          } else {
            id(voda_stav).publish_state("Pripraveno");
          }
  on_shutdown:
    then:
      - lambda: |-
          float raw_total = id(celkovy_prutok).state;
          if (!isnan(raw_total)) {
            float delta = raw_total - id(voda_celkovy_prutok_snapshot);
            if (delta > 0.0f) {
              id(voda_celkovy_prutok_zaklad) += delta;
              id(voda_celkovy_prutok_snapshot) = raw_total;
            }
          }

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  logs:
    sensor: WARN
    dallas.sensor: WARN
    # Poznamka: sensor: WARN = nelze videt normalni hodnoty v logu, jen chyby

# Enable Home Assistant API
api:
  encryption:
    key: "9L/bk2VmBAQsr1AOstQ5VefpNbnjGAEziDRPrTKyEBw="
  reboot_timeout: 0s  # Nerebootovat kdyz HA neni dostupne (napr. HA restart)

ota:
  - platform: esphome
    password: "259251edf6e7e1e27ce716db258d0e94"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.113
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "Boiler-Room-Heaters_v2"
    password: "tMUQtkVnJjVW"

captive_portal:

# --- SBĚRNICE (podle schématu) ---
i2c:
  sda: GPIO22
  scl: GPIO23
  frequency: 100000  # 100kHz - stabilnejsi nez 400kHz, mene timeoutu
  scan: false  # Nezdrzi boot scan

spi:
  clk_pin: GPIO19
  miso_pin: GPIO20

one_wire:
  - platform: gpio
    pin: GPIO17 # Pin označený jako D5/DS18B20

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - hours: 2
        minutes: 0
        seconds: 0
        days_of_week: [1]
        then:
          - lambda: |-
              if (id(voda_test_probiha)) {
                ESP_LOGW("voda", "Týdenní test již probíhá, přeskočeno");
                return;
              }
              if (id(voda_havarie_aktivni)) {
                ESP_LOGW("voda", "Týdenní test zrušen, aktivní havárie");
                return;
              }
              ESP_LOGI("voda", "Spouštím týdenní test ventilu (pondělí 2:00)");
              id(voda_test_script).execute();


# 0x3c00000559fe8628 (DS18B20) OK - Plynovy kotel vystup
# 0x0f00000559c87528 (DS18B20) OK - Plynovy kotel vrat
# 0xfb000003ea4ce628 (DS18B20) OK - Kotel na tuhá paliva vystup
# 0x60000003ea354528 (DS18B20) OK - Kotel na tuhá paliva vrat



# ============================================================================
# GLOBÁLNÍ ERROR SYSTÉM
# ============================================================================

globals:
  # Error stavy pro jednotlivé subsystémy
  - id: error_kotel_tuha_paliva
    type: std::string
    restore_value: no
    initial_value: '""'
  
  - id: error_voda
    type: std::string
    restore_value: no
    initial_value: '""'
  
  # Časy pro údržbu čerpadla
  - id: kotel_last_pump_run_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  
  - id: kotel_pump_forced_run
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: kotel_pump_manual_override
    type: bool
    restore_value: no
    initial_value: 'false'

  # Voda - havárie
  - id: voda_havarie_aktivni
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: voda_havarie_typ
    type: std::string
    restore_value: yes
    initial_value: '""'

  - id: voda_test_probiha
    type: bool
    restore_value: no
    initial_value: 'false'

  # Voda - pause režim
  - id: voda_pause_cas_aktivace
    type: unsigned long
    restore_value: yes
    initial_value: '0'

  - id: voda_pause_aktivni
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: voda_prutok_above_start
    type: unsigned long
    restore_value: yes
    initial_value: '0'

  - id: voda_test_phase
    type: int
    restore_value: no
    initial_value: '0'  # 0=idle,1=closed_wait,2=check_zero_flow,3=done

  - id: voda_test_phase_start
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: voda_test_failed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: display_page
    type: int
    restore_value: no
    initial_value: '0'

  # Kalibrace průtokoměru
  - id: kalibrace_aktivni
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: kalibrace_start_cas
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: kalibrace_start_prutok
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: kalibrace_koeficient
    type: float
    restore_value: yes
    initial_value: '7.5'

  - id: voda_celkovy_prutok_zaklad
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: voda_celkovy_prutok_snapshot
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: voda_celkovy_prutok_posledni_ulozeni
    type: unsigned long
    restore_value: no
    initial_value: '0'

  # ============ PLYNOVÝ KOTEL - stavy a monitorování ============
  - id: plyn_povolen
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: plyn_havarie_aktivni
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: plyn_havarie_typ
    type: std::string
    restore_value: yes
    initial_value: '""'

  - id: plyn_havarie_cas
    type: unsigned long
    restore_value: yes
    initial_value: '0'

  - id: plyn_zapnuto_cas
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: plyn_prvni_check_prosel
    type: bool
    restore_value: no
    initial_value: 'false'

sensor:
  - platform: dallas_temp
    address: 0x3c00000559fe8628
    name: "Plynovy kotel: Výstup"
    id: teplota_plynovy_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x0f00000559c87528
    name: "Plynovy kotel: Vrat"
    id: teplota_plynovy_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0xfb000003ea4ce628
    name: "Kotel: Výstup"
    id: teplota_kotel_vystup
    update_interval: 10s
  
  - platform: dallas_temp
    address: 0x60000003ea354528
    name: "Kotel: Vrat"
    id: teplota_kotel_vrat
    update_interval: 10s
  
  # Teplota komína (Termočlánek přes SPI)
  - platform: max6675
    name: "Kotel: Komín"
    id: teplota_komin
    cs_pin: GPIO18
    update_interval: 10s

  # Průtokoměr - KALIBROVATELNÝ
  - platform: pulse_meter
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
    name: "Aktuální průtok vody"
    id: prutok_vody
    unit_of_measurement: "L/min"
    timeout: 5s
    internal: true
    filters:
      - lambda: return x / id(kalibrace_koeficient);
    total:
      name: "Celkový průtok vody"
      id: celkovy_prutok
      unit_of_measurement: "L"
      accuracy_decimals: 3
      internal: true
      filters:
        - lambda: return x / id(kalibrace_koeficient);
    on_value:
      then: []

  # Voda - hodnoty pro HA (update_interval 5s)
  - platform: template
    name: "Aktuální průtok vody"
    id: prutok_vody_ha
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 5s
    icon: "mdi:water"
    lambda: |-
      return id(prutok_vody).state;

  - platform: template
    name: "Celkový průtok vody"
    id: celkovy_prutok_ha
    unit_of_measurement: "L"
    accuracy_decimals: 2
    update_interval: 5s
    icon: "mdi:counter"
    lambda: |-
      float raw_total = id(celkovy_prutok).state;
      if (isnan(raw_total)) {
        return id(voda_celkovy_prutok_zaklad);
      }
      float delta = raw_total - id(voda_celkovy_prutok_snapshot);
      if (delta < 0.0f) {
        delta = raw_total;
      }
      return id(voda_celkovy_prutok_zaklad) + delta;

  # Vypočítané rozdíly teplot
  - platform: template
    name: "Plynovy kotel: Rozdíl teplot"
    id: rozdil_plynovy
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_plynovy_vystup).state) || isnan(id(teplota_plynovy_vrat).state)) {
        return {};
      }
      return id(teplota_plynovy_vystup).state - id(teplota_plynovy_vrat).state;
  
  - platform: template
    name: "Kotel: Rozdíl teplot"
    id: rozdil_kotel
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_kotel_vystup).state) || isnan(id(teplota_kotel_vrat).state)) {
        return {};
      }
      return id(teplota_kotel_vystup).state - id(teplota_kotel_vrat).state;
  
  # Čas od posledního běhu (pro údržbu)
  - platform: template
    name: "Kotel: Čas od posledního běhu"
    id: kotel_cas_od_behu
    unit_of_measurement: "h"
    accuracy_decimals: 1
    update_interval: 60s
    icon: "mdi:clock-outline"
    entity_category: diagnostic
    lambda: |-
      unsigned long current_time = millis();
      unsigned long last_run = id(kotel_last_pump_run_time);
      unsigned long time_diff;
      
      if (current_time >= last_run) {
        time_diff = current_time - last_run;
      } else {
        time_diff = current_time;
      }
      
      return time_diff / (1000.0 * 60.0 * 60.0); // převod na hodiny
  
  # Voda - zbývající čas pause
  - platform: template
    name: "Voda: Zbývající čas pause"
    id: voda_pause_zbyvajici
    unit_of_measurement: "h"
    accuracy_decimals: 1
    update_interval: 60s
    icon: "mdi:timer-sand"
    entity_category: diagnostic
    lambda: |-
      if (!id(voda_pause_aktivni)) {
        return 0.0;
      }
      
      unsigned long uplynulo_ms = millis() - id(voda_pause_cas_aktivace);
      float uplynulo_h = uplynulo_ms / (60.0 * 60.0 * 1000.0);
      float delka_h = id(voda_pause_delka).state;
      float zbyvajici = delka_h - uplynulo_h;
      
      return zbyvajici > 0 ? zbyvajici : 0.0;

  # Kalibrace průtokoměru
  - platform: template
    name: "Voda: Kal. čas měření"
    id: kalibrace_cas
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: 2s
    icon: "mdi:timer"
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      if (!id(kalibrace_aktivni) || id(kalibrace_start_cas) == 0) {
        return 0.0;
      }
      return (millis() - id(kalibrace_start_cas)) / 1000.0;

  - platform: template
    name: "Voda: Kal. naměřený průtok"
    id: kalibrace_namereny_prutok
    unit_of_measurement: "L"
    accuracy_decimals: 3
    update_interval: 2s
    icon: "mdi:counter"
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      if (!id(kalibrace_aktivni)) {
        return 0.0;
      }
      return id(celkovy_prutok).state - id(kalibrace_start_prutok);

  - platform: template
    name: "Voda: Kal. aktuální koeficient"
    id: kalibrace_aktualni_koef
    unit_of_measurement: ""
    accuracy_decimals: 2
    update_interval: 30s
    icon: "mdi:cog"
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(kalibrace_koeficient);


# ============================================================================
# NASTAVENÍ (ovladatelné z Home Assistant)
# ============================================================================
number:
  # Regulace podle rozdílu teplot
  - platform: template
    name: "Kotel: Rozdíl ZAP"
    id: kotel_rozdil_zapnuti
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:thermometer-chevron-up"
    entity_category: config
    on_value:
      then:
        - lambda: |-
            float vypnuti = id(kotel_rozdil_vypnuti).state;
            float zapnuti = x;
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(kotel_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("kotel", "Auto korekce: Rozdíl VYP nastaven na %.1f°C", nova_hodnota);
            }

  - platform: template
    name: "Kotel: Rozdíl VYP"
    id: kotel_rozdil_vypnuti
    min_value: 0
    max_value: 28
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:thermometer-chevron-down"
    entity_category: config
    on_value:
      then:
        - lambda: |-
            float zapnuti = id(kotel_rozdil_zapnuti).state;
            float vypnuti = x;
            if (vypnuti >= (zapnuti - 2.0)) {
              // POZOR: nevolat publish_state na sebe - zpusobi nekonecnou rekurzi!
              ESP_LOGW("kotel", "Neplatna hodnota VYP %.1f! Must be < ZAP %.1f - 2", vypnuti, zapnuti);
            }

  # Regulace podle teploty komína
  - platform: template
    name: "Kotel: Komín ZAP"
    id: kotel_komin_zapnuti
    min_value: 50
    max_value: 200
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:fire"
    entity_category: config

  - platform: template
    name: "Kotel: Komín VYP"
    id: kotel_komin_vypnuti
    min_value: 30
    max_value: 150
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:fire-off"
    entity_category: config

  # Havarijní limit
  - platform: template
    name: "Kotel: Havarijní limit"
    id: kotel_havarijni_limit
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    optimistic: true

    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:alert-octagon"
    entity_category: config

  # Voda - max čas průtoku
  - platform: template
    name: "Voda: Max čas průtoku"
    id: voda_max_cas_prutoku
    min_value: 5
    max_value: 60
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
    icon: "mdi:timer-alert-outline"
    entity_category: config

  # Voda - min průtok
  - platform: template
    name: "Voda: Min průtok pro detekci"
    id: voda_min_prutok
    min_value: 0.1
    max_value: 5.0
    step: 0.1
    initial_value: 0.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "L/min"
    mode: box
    icon: "mdi:water-outline"
    entity_category: config

  # Voda - délka pause
  - platform: template
    name: "Voda: Délka pause"
    id: voda_pause_delka
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 24
    optimistic: true
    restore_value: true
    unit_of_measurement: "h"
    mode: box
    icon: "mdi:timer-pause-outline"
    entity_category: config
    disabled_by_default: true  # <-- SKRYTO

  # Plynový kotel - regulační hodnoty
  - platform: template
    name: "Plyn: Min. rozdíl teplot"
    id: plyn_min_rozdil
    min_value: 1
    max_value: 20
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:thermometer-lines"
    entity_category: config

  - platform: template
    name: "Plyn: Min. teplota výstupu"
    id: plyn_min_teplota_vystup
    min_value: 30
    max_value: 60
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:thermometer-low"
    entity_category: config

  # Kalibrace průtokoměru
  - platform: template
    name: "Voda: Kal. koeficient"
    id: kalibrace_koeficient_number
    min_value: 1.0
    max_value: 50.0
    step: 0.1
    initial_value: 7.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "imp/L"
    mode: box
    icon: "mdi:cog"
    entity_category: diagnostic
    disabled_by_default: true
    on_value:
      then:
        - lambda: |-
            id(kalibrace_koeficient) = x;
            ESP_LOGI("kalibrace", "Nový kalibrační koeficient: %.2f imp/L", x);
output:
  - platform: gpio
    pin: GPIO0
    id: gpio_rele_ventil_voda
  - platform: gpio
    pin: GPIO1
    id: gpio_rele_obehove_cerpadlo
  - platform: gpio
    pin: GPIO2
    id: gpio_rele_plyn
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    id: gpio_led_red

# ============================================================================
# OVLÁDÁNÍ
# ============================================================================

switch:
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  
  - platform: output
    output: gpio_rele_ventil_voda
    name: "Hlavní ventil vody"
    id: switch_hlavni_ventil

  - platform: output
    name: Oběhové čerpadlo kotle
    output: gpio_rele_obehove_cerpadlo
    id: switch_obehove_cerpadlo
    internal: true
  
  - platform: output
    output: gpio_rele_plyn
    name: "Spínání plynového kotle"
    id: switch_plynovy_kotel
    internal: true
  
  # Manuální override - ZAPNOUT čerpadlo
  - platform: template
    name: "Kotel: Manuální ZAP"
    id: kotel_manual_on
    icon: "mdi:pump"
    optimistic: true
    turn_on_action:
      - lambda: |-
          ESP_LOGI("kotel", "Manuální ZAP čerpadla");
          id(kotel_pump_manual_override) = true;
          id(switch_obehove_cerpadlo).turn_on();
    turn_off_action:
      - lambda: |-
          ESP_LOGI("kotel", "Manuální režim vypnut");
          id(kotel_pump_manual_override) = false;
          // Čerpadlo se vypne až když to dovolí podmínky

  - platform: template
    name: "Voda: Vypnout kontrolu"
    id: voda_pause_kontrola
    icon: "mdi:water-off"
    lambda: |-
      return id(voda_pause_aktivni);
    turn_on_action:
      - lambda: |-
          unsigned long now = millis();
          id(voda_pause_aktivni) = true;
          id(voda_pause_cas_aktivace) = now;

          ESP_LOGI("voda", "Dočasné vypnutí kontroly povodně na %.0f hodin", id(voda_pause_delka).state);
          char text[64];
          snprintf(text, sizeof(text), "Kontrola povodně vypnuta na %.0fh", (int) id(voda_pause_delka).state);
          id(voda_stav).publish_state(text);

          id(voda_pause_timer).execute();
    turn_off_action:
      - lambda: |-
          if (!id(voda_pause_aktivni)) {
            return;
          }
          id(voda_pause_aktivni) = false;
          id(voda_pause_cas_aktivace) = 0;
          ESP_LOGI("voda", "Kontrola povodně ručně zapnuta");
          id(voda_stav).publish_state("Pripraveno");

  # Povolení/zákaz plynu z Home Assistantu
  - platform: template
    name: "Plynový kotel"
    id: plyn_povolen_switch
    icon: "mdi:gas-burner"
    optimistic: false
    lambda: |-
      return id(plyn_povolen);
    turn_on_action:
      - lambda: |-
          if (id(plyn_havarie_aktivni)) {
            ESP_LOGW("plyn", "Nelze zapnout - aktivní havárie!");
            return;
          }
          ESP_LOGI("plyn", "Povolení plynu z HA - spouštím kotel");
          id(plyn_povolen) = true;
          id(plyn_zapnuto_cas) = millis();
          id(plyn_prvni_check_prosel) = false;
    turn_off_action:
      - lambda: |-
          ESP_LOGI("plyn", "Zákaz plynu z HA - vypínám kotel");
          id(plyn_povolen) = false;
          id(switch_plynovy_kotel).turn_off();
          id(plyn_zapnuto_cas) = 0;

# ============================================================================
# STAVY A DIAGNOSTIKA
# ============================================================================

binary_sensor:
  # --- Havárie (viditelné v HA dashboardu) ---
  - platform: template
    name: "Kotel: Havarie"
    id: kotel_status_havarie
    device_class: problem

  - platform: template
    name: "Plyn: Havárie"
    id: plyn_havarie_status
    device_class: problem
    lambda: |-
      return id(plyn_havarie_aktivni);

  - platform: template
    name: "Voda: Havarie"
    id: voda_havarie_status
    device_class: safety
    lambda: |-
      return id(voda_havarie_aktivni);

  - platform: template
    name: "Kotelna: Vše OK"
    id: system_all_ok
    device_class: problem
    lambda: |-
      return id(kotel_status_havarie).state || 
             id(plyn_havarie_aktivni) || 
             id(voda_havarie_aktivni);

  # --- Diagnostika (skrytá v HA, viditelná jen v diagnostickém panelu) ---
  - platform: template
    name: "Kotel: Topí (komín)"
    id: kotel_status_topi
    device_class: heat
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(teplota_komin).state)) return false;
      return id(teplota_komin).state > id(kotel_komin_zapnuti).state;

  - platform: template
    name: "Kotel: Relé"
    id: kotel_status_cerpadlo_bezi
    device_class: running
    entity_category: diagnostic
    lambda: return id(switch_obehove_cerpadlo).state;

  - platform: template
    name: "Plyn: Relé"
    id: plyn_status_rele_bezi
    device_class: running
    entity_category: diagnostic
    lambda: return id(switch_plynovy_kotel).state;

  - platform: template
    name: "Voda: Relé"
    id: voda_status_rele_uzavrena
    device_class: plug
    entity_category: diagnostic
    lambda: return id(switch_hlavni_ventil).state;

text_sensor:
  # --- Stavy (viditelné v HA dashboardu) ---
  - platform: template
    name: "Kotel: Stav"
    id: error_kotel_text
    update_interval: never
    icon: "mdi:alert-circle"

  - platform: template
    name: "Plyn: Stav"
    id: plyn_stav
    update_interval: never
    icon: "mdi:gas-burner"

  - platform: template
    name: "Voda: Stav"
    id: voda_stav
    update_interval: never
    icon: "mdi:water-alert"

  - platform: template
    name: "Kotelna: Stav"
    id: system_status
    update_interval: 5s
    icon: "mdi:home-alert"
    lambda: |-
      if (!id(system_all_ok).state) {
        return "OK";
      }
      std::string result;
      if (id(kotel_status_havarie).state) {
        result += "Kotel: " + id(error_kotel_tuha_paliva);
      }
      if (id(plyn_havarie_aktivni)) {
        if (!result.empty()) result += " | ";
        result += "Plyn: " + id(plyn_havarie_typ);
      }
      if (id(voda_havarie_aktivni)) {
        if (!result.empty()) result += " | ";
        result += "Voda: " + id(voda_havarie_typ);
      }
      return result;

# ============================================================================
# HLAVNÍ REGULAČNÍ LOGIKA
# ============================================================================

interval:
  # Střídání stránek displeje každých 4 sekund
  - interval: 4s
    then:
      - lambda: |-
          // Stránky 0-3: vždy (PLYN, KOTEL, VODA, KOTEL 2)
          // Stránky 4-6: havárie (KOTEL, PLYN, VODA) - jen pokud aktivní
          int next = (id(display_page) + 1) % 7;
          // Přeskočit havárie stránky které nejsou aktivní
          for (int i = 0; i < 7; i++) {
            if (next == 4 && !id(kotel_status_havarie).state) { next = (next + 1) % 7; continue; }
            if (next == 5 && !id(plyn_havarie_aktivni))       { next = (next + 1) % 7; continue; }
            if (next == 6 && !id(voda_havarie_aktivni))       { next = (next + 1) % 7; continue; }
            break;
          }
          id(display_page) = next;

  # LED status indikace - každou sekundu
  - interval: 1s
    then:
      - lambda: |-
          if (id(system_all_ok).state) {
            id(switch_led_red).turn_on();
          } else {
            id(switch_led_red).turn_off();
          }

  - interval: 30s
    then:
      - lambda: |-
          const float save_step_l = 50.0f;
          const unsigned long save_timeout_ms = 60UL * 60UL * 1000UL;
          float raw_total = id(celkovy_prutok).state;
          if (isnan(raw_total)) {
            return;
          }

          float delta = raw_total - id(voda_celkovy_prutok_snapshot);
          if (delta < 0.0f) {
            id(voda_celkovy_prutok_snapshot) = 0.0f;
            delta = raw_total;
          }

          if (delta <= 0.0f) {
            return;
          }

          unsigned long now = millis();
          bool save_due_to_volume = delta >= save_step_l;
          bool save_due_to_time = (now - id(voda_celkovy_prutok_posledni_ulozeni)) >= save_timeout_ms;

          if (save_due_to_volume || save_due_to_time) {
            id(voda_celkovy_prutok_zaklad) += delta;
            id(voda_celkovy_prutok_snapshot) = raw_total;
            id(voda_celkovy_prutok_posledni_ulozeni) = now;
          }
  # Hlavní regulační logika kotel - každých 10 sekund
  - interval: 10s
    then:
      - lambda: |-
          static bool last_havarie_state = false;
          bool pump_should_run = false;
          bool havarie = false;
          std::string status_text = "Neaktivní";
          std::string error_msg = "";
          float temp_vystup = id(teplota_kotel_vystup).state;
          float temp_vrat = id(teplota_kotel_vrat).state;
          float temp_komin = id(teplota_komin).state;
          bool current_pump_state = id(switch_obehove_cerpadlo).state;
          bool cidlo_vystup_ok = !isnan(temp_vystup);
          bool cidlo_vrat_ok = !isnan(temp_vrat);
          bool cidlo_komin_ok = !isnan(temp_komin);
      
          // 1. KONTROLA CHYB ČIDEL
          if (!cidlo_vystup_ok || !cidlo_vrat_ok) {
            pump_should_run = true;
            havarie = true;
            error_msg = "Chyba čidla ";
            if (!cidlo_vystup_ok) error_msg += "VYSTUP ";
            if (!cidlo_vrat_ok) error_msg += "VRAT";
            status_text = "CHYBA ČIDLA - Čerpadlo ZAP";
            ESP_LOGE("kotel", "%s", error_msg.c_str());
          } else if (!cidlo_komin_ok) {
            pump_should_run = true;
            havarie = true;
            error_msg = "Chyba čidla KOMÍN";
            status_text = "CHYBA ČIDLA KOMÍN - Čerpadlo ZAP";
            ESP_LOGE("kotel", "Čidlo komína nefunguje - přecházím do havárie");
          }
      
          // 2. KONTROLA PŘEHŘÁTÍ
          if (cidlo_vystup_ok && !havarie) {
            float limit = id(kotel_havarijni_limit).state;
            if (temp_vystup > limit) {
              pump_should_run = true;
              havarie = true;
              char buffer[100];
              snprintf(buffer, sizeof(buffer), "PŘEHŘÁTÍ %.0f°C > %.0f°C", temp_vystup, limit);
              error_msg = buffer;
              status_text = "HAVÁRIE - Chlazení!";
              if (!last_havarie_state) {
                ESP_LOGE("kotel", "HAVÁRIE! Teplota %.1f°C > limit %.1f°C - ZAPÍNÁM ČERPADLO!", temp_vystup, limit);
              }
            }
          }
      
          // 3. MANUÁLNÍ REŽIM (má přednost před automatickou regulací, ale ne před havárií)
          if (id(kotel_pump_forced_run) && !havarie) {
            pump_should_run = true;
            status_text = "Testovací běh - údržba";
          }

          // 4. MANUÁLNÍ REŽIM (má přednost před automatickou regulací, ale ne před havárií ani forced run)
          if (id(kotel_pump_manual_override) && !havarie && !id(kotel_pump_forced_run)) {
            pump_should_run = true;
            status_text = "Manuální režim - ZAP";
          }
      
          // 5. AUTOMATICKÁ REGULACE (jen pokud není forced run, manuální režim ani havárie)
          if (!havarie && !id(kotel_pump_forced_run) && !id(kotel_pump_manual_override)) {
            float rozdil = temp_vystup - temp_vrat;
            bool rozdil_vysok = rozdil >= id(kotel_rozdil_zapnuti).state;
            bool rozdil_nizky = rozdil <= id(kotel_rozdil_vypnuti).state;
            bool komin_horky = cidlo_komin_ok && (temp_komin >= id(kotel_komin_zapnuti).state);
            bool komin_studeny = cidlo_komin_ok && (temp_komin <= id(kotel_komin_vypnuti).state);
        
            // Podmínky pro ZAPNUTÍ
            if (!current_pump_state && (rozdil_vysok || komin_horky)) {
              pump_should_run = true;
              char buffer[150];
              if (rozdil_vysok && komin_horky) {
                snprintf(buffer, sizeof(buffer), "ZAP: Rozdíl %.1f°C + Komín %.0f°C", rozdil, temp_komin);
              } else if (rozdil_vysok) {
                snprintf(buffer, sizeof(buffer), "ZAP: Rozdíl %.1f°C >= %.0f°C", rozdil, id(kotel_rozdil_zapnuti).state);
              } else {
                snprintf(buffer, sizeof(buffer), "ZAP: Komín %.0f°C >= %.0f°C", temp_komin, id(kotel_komin_zapnuti).state);
              }
              status_text = buffer;
              ESP_LOGI("kotel", "%s", buffer);
            } 
            // Podmínky pro VYPNUTÍ
            else if (current_pump_state && rozdil_nizky && komin_studeny) {
              pump_should_run = false;
              char buffer[150];
              snprintf(buffer, sizeof(buffer), "VYP: Rozdíl %.1f°C + Komín %.0f°C", rozdil, temp_komin);
              status_text = buffer;
              ESP_LOGI("kotel", "%s", buffer);
            } 
            // HYSTEREZE - zůstat v aktuálním stavu
            else {
              pump_should_run = current_pump_state;
              char buffer[150];
              if (current_pump_state) {
                snprintf(buffer, sizeof(buffer), "BĚH: Δ%.1f°C K%.0f°C", rozdil, cidlo_komin_ok ? temp_komin : 0);
              } else {
                snprintf(buffer, sizeof(buffer), "ČEKÁ: Δ%.1f°C K%.0f°C", rozdil, cidlo_komin_ok ? temp_komin : 0);
              }
              status_text = buffer;
            }
          }
      
          // 6. PUBLIKOVÁNÍ STAVŮ
          id(error_kotel_tuha_paliva) = havarie ? error_msg : "OK";
          id(kotel_status_havarie).publish_state(havarie);
          id(error_kotel_text).publish_state(id(error_kotel_tuha_paliva));
      
          // 7. APLIKOVÁNÍ ROZHODNUTÍ
          if (pump_should_run != current_pump_state) {
            if (pump_should_run) {
              id(switch_obehove_cerpadlo).turn_on();
              id(kotel_last_pump_run_time) = millis();
              ESP_LOGI("kotel", "Čerpadlo ZAPNUTO");
            } else {
              id(switch_obehove_cerpadlo).turn_off();
              ESP_LOGI("kotel", "Čerpadlo VYPNUTO");
            }
          }
      
          // 8. AKTUALIZACE ČASU POSLEDNÍHO BĚHU
          if (id(switch_obehove_cerpadlo).state) {
            id(kotel_last_pump_run_time) = millis();
          }
      
          last_havarie_state = havarie;
  # Kontrola týdenního běhu čerpadla
  - interval: 1h
    then:
      - lambda: |-
          const unsigned long WEEK_IN_MS = 7UL * 24UL * 60UL * 60UL * 1000UL;
          unsigned long current_time = millis();
          unsigned long last_run = id(kotel_last_pump_run_time);
          unsigned long time_since_last_run;
          if (current_time >= last_run) {
            time_since_last_run = current_time - last_run;
          } else {
            time_since_last_run = current_time;
          }
          if (time_since_last_run > WEEK_IN_MS && !id(kotel_pump_forced_run)) {
            float days = time_since_last_run / (24.0 * 60.0 * 60.0 * 1000.0);
            ESP_LOGW("kotel", "Čerpadlo neběželo %.1f dní - spouštím 5min testovací běh", days);
            id(kotel_pump_forced_run) = true;
            id(switch_obehove_cerpadlo).turn_on();
            id(kotel_forced_run_timer).execute();
          }

  # Vodní systém - hlavní bezpečnostní kontrola průtoku
  - interval: 5s
    then:
      - lambda: |-
          unsigned long now = millis();
          
          // --- kontrola vypršení pause režimu ---
          if (id(voda_pause_aktivni) && id(voda_pause_cas_aktivace) > 0) {
            unsigned long pause_duration = (unsigned long)(id(voda_pause_delka).state * 60.0 * 60.0 * 1000.0); // hodiny na ms
            if (now - id(voda_pause_cas_aktivace) >= pause_duration) {
              id(voda_pause_aktivni) = false;
              id(voda_pause_cas_aktivace) = 0;
              ESP_LOGI("voda", "Pause režim vypršel - kontrola povodně automaticky zapnuta");
              id(voda_stav).publish_state("Kontrola povodně zapnuta (pause vypršel)");
            }
          }
          
          float flow = id(prutok_vody).state;
          bool has_flow = !isnan(flow) && flow >= id(voda_min_prutok).state;
          bool valve_open = !id(switch_hlavni_ventil).state;

          // --- týdenní test ventilů ---
          if (id(voda_test_probiha)) {
            if (id(voda_test_phase) == 1) {
              if (now - id(voda_test_phase_start) >= 60000UL) {
                id(voda_test_phase) = 2;
                id(voda_test_phase_start) = now;
                id(voda_stav).publish_state("Test ventil: sledování 30s nulového průtoku");
                id(error_voda) = "Test ventil: sleduji průtok";
                ESP_LOGI("voda", "Test ventil: přechod do fáze 2");
              }
            } else if (id(voda_test_phase) == 2) {
              if (!isnan(flow) && flow > 0.0) {
                id(voda_test_failed) = true;
                id(voda_havarie_aktivni) = true;
                id(voda_havarie_typ) = "Test ventil selhal";
                id(voda_test_phase) = 3;
                id(voda_test_phase_start) = now;
                id(voda_stav).publish_state("Test ventil selhal: nenulový průtok");
                id(error_voda) = "Test ventilu selhal: netěsnost";
                ESP_LOGW("voda", "Test ventil selhal - průtok detekován");
              } else if (now - id(voda_test_phase_start) >= 30000UL) {
                id(voda_test_failed) = false;
                id(voda_test_phase) = 3;
                id(voda_test_phase_start) = now;
                id(voda_stav).publish_state("Test ventil OK");
                id(error_voda) = "OK";
                ESP_LOGI("voda", "Test ventil OK");
              }
            } else if (id(voda_test_phase) == 3) {
              if (now - id(voda_test_phase_start) >= 2000UL) {
                id(switch_hlavni_ventil).turn_off();
                id(voda_test_probiha) = false;
                id(voda_test_phase) = 0;
                id(voda_test_phase_start) = 0;
                if (id(voda_test_failed)) {
                  id(voda_stav).publish_state("Test ventil dokončen: selhání");
                } else {
                  id(voda_stav).publish_state("Test ventil dokončen: OK");
                }
                ESP_LOGI("voda", "Test ventil fáze 3 dokončen");
              }
            }
          }

          // --- detekce vytopení při otevřeném ventilu ---
          if (!id(voda_pause_aktivni) && !id(voda_test_probiha) && !id(voda_havarie_aktivni) && valve_open) {
            if (has_flow) {
              if (id(voda_prutok_above_start) == 0) {
                id(voda_prutok_above_start) = now;
              }
              unsigned long max_duration = (unsigned long)(id(voda_max_cas_prutoku).state * 60.0 * 1000.0);
              if (max_duration == 0) {
                max_duration = 20UL * 60UL * 1000UL;
              }
              if (now - id(voda_prutok_above_start) >= max_duration) {
                id(voda_havarie_aktivni) = true;
                id(voda_havarie_typ) = "Průtok dlouhodobě nad min";
                char text[128];
                snprintf(text, sizeof(text), "Havarie: průtok >= %.1f L/min > %d min", id(voda_min_prutok).state, (int)id(voda_max_cas_prutoku).state);
                id(error_voda) = text;
                id(voda_stav).publish_state("Havarie! Uzavírám ventil");
                id(switch_hlavni_ventil).turn_on();
                ESP_LOGE("voda", "%s", text);
              }
            } else {
              id(voda_prutok_above_start) = 0;
            }
          } else if (!valve_open) {
            id(voda_prutok_above_start) = 0;
          }

          // Resety stavu - OK pokud není havárie
          if (!id(voda_havarie_aktivni)) {
            id(error_voda) = "OK";
          }

  # Plynový kotel - regulace (10s)
  - interval: 10s
    then:
      - lambda: |-
          unsigned long now = millis();
          bool should_be_on = id(plyn_povolen) && !id(plyn_havarie_aktivni);
          float temp_vystup = id(teplota_plynovy_vystup).state;
          float temp_vrat = id(teplota_plynovy_vrat).state;
          bool cidla_plynu_ok = !isnan(temp_vystup) && !isnan(temp_vrat);
          
          // 1. FYZICKÉ SPÍNÁNÍ RELÉ
          if (should_be_on && !id(switch_plynovy_kotel).state) {
            id(switch_plynovy_kotel).turn_on();
            ESP_LOGI("plyn", "Zapínám relé plynového kotle");
          } else if (!should_be_on && id(switch_plynovy_kotel).state) {
            id(switch_plynovy_kotel).turn_off();
            ESP_LOGI("plyn", "Vypínám relé plynového kotle");
          }
          
          // 2. DETEKCE FUNKČNOSTI - jednou po 5 minutách
          if (id(plyn_povolen) && !id(plyn_havarie_aktivni)
              && id(plyn_zapnuto_cas) > 0 && !id(plyn_prvni_check_prosel)) {
            unsigned long elapsed = now - id(plyn_zapnuto_cas);
            unsigned long five_minutes = 5UL * 60UL * 1000UL;
            
            if (elapsed >= five_minutes) {
              if (!cidla_plynu_ok) {
                ESP_LOGE("plyn", "HAVÁRIE (5min check): chyba čidel plynu, výstup=%.1f°C, vrat=%.1f°C", temp_vystup, temp_vrat);
                id(plyn_havarie_aktivni) = true;
                id(plyn_havarie_typ) = "Chyba čidel plynu";
                id(plyn_havarie_cas) = now;
                id(switch_plynovy_kotel).turn_off();
              } else {
                float diff = id(rozdil_plynovy).state;
                if (diff >= id(plyn_min_rozdil).state) {
                // Velký rozdíl → kotel topí, označíme první check jako prošlý
                  id(plyn_prvni_check_prosel) = true;
                  ESP_LOGI("plyn", "První check OK - kotel topí (Δ%.1f°C)", diff);
                } else {
                // Malý rozdíl, výstup určí typ havárie
                  bool studeny = temp_vystup < id(plyn_min_teplota_vystup).state;
                  ESP_LOGE("plyn", "HAVÁRIE (5min check): Δ%.1f°C, výstup%.1f°C - kotel netopí!", diff, temp_vystup);
                  id(plyn_havarie_aktivni) = true;
                  id(plyn_havarie_typ) = studeny ? "Kotel netopí - vůbec nezapnul" : "Kotel netopí";
                  id(plyn_havarie_cas) = now;
                  id(switch_plynovy_kotel).turn_off();
                }
              }
            }
          }
          
          // 3. PUBLIKOVÁNÍ STAVU
          id(plyn_stav).publish_state(
            id(plyn_havarie_aktivni) ? id(plyn_havarie_typ) :
            (id(plyn_povolen)
              ? ((now - id(plyn_zapnuto_cas)) < 5UL * 60UL * 1000UL ? "Startovní režim (0-5 min)" : "Běží")
              : "Vypnutý")
          );

  # Minutový check - stejný test jako při 5min, ale po prvním průchodu = akumulátor natopen
  - interval: 1min
    then:
      - lambda: |-
          unsigned long now = millis();
          float temp_vystup = id(teplota_plynovy_vystup).state;
          float temp_vrat = id(teplota_plynovy_vrat).state;
          
          // Spustí se jen pokud první check prošel (kotel jednou topil) a není havárie
          if (!id(plyn_povolen) || id(plyn_havarie_aktivni) || !id(plyn_prvni_check_prosel)) {
            return;
          }

          if (isnan(temp_vystup) || isnan(temp_vrat)) {
            ESP_LOGE("plyn", "HAVÁRIE (minutový check): chyba čidel plynu, výstup=%.1f°C, vrat=%.1f°C", temp_vystup, temp_vrat);
            id(plyn_havarie_aktivni) = true;
            id(plyn_havarie_typ) = "Chyba čidel plynu";
            id(plyn_havarie_cas) = now;
            id(switch_plynovy_kotel).turn_off();
            return;
          }
          
          float diff = id(rozdil_plynovy).state;
          if (diff >= id(plyn_min_rozdil).state) {
            return; // OK, stále topí
          }
          
          // Malý rozdíl přestože prve prošel → akumulátor je natopen,
          // vrátná teplota se vyrovnala výstupní, HA zřejmě zapomněl kotel vypnout
          bool vysoka_teplota = temp_vystup >= id(plyn_min_teplota_vystup).state;
          const char* typ = vysoka_teplota
            ? "Kotel zastaven - akumulátor natopen"
            : "Kotel zastaven - možné zapomenutí vypnutí";
          ESP_LOGE("plyn", "HAVÁRIE (minutový check): Δ%.1f°C, výstup %.1f°C - %s", diff, temp_vystup, typ);
          id(plyn_havarie_aktivni) = true;
          id(plyn_havarie_typ) = typ;
          id(plyn_havarie_cas) = now;
          id(switch_plynovy_kotel).turn_off();

  # Automatický reset havárie po 24 hodinách
  - interval: 24h
    then:
      - lambda: |-
          if (id(plyn_havarie_aktivni)) {
            unsigned long now = millis();
            unsigned long elapsed = now - id(plyn_havarie_cas);
            unsigned long twenty_four_hours = 24UL * 60UL * 60UL * 1000UL;
            
            if (elapsed > twenty_four_hours) {
              ESP_LOGI("plyn", "Automatický reset havárie po 24 hodinách");
              id(plyn_havarie_aktivni) = false;
              id(plyn_havarie_typ) = "";
              id(plyn_havarie_cas) = 0;
              id(plyn_prvni_check_prosel) = false;
              ESP_LOGI("plyn", "Reset startovního stavu - příště se provede 5min check");
            }
          }

script:
  - id: kotel_forced_run_timer
    then:
      - delay: 5min
      - lambda: |-
          if (id(kotel_pump_forced_run)) {
            ESP_LOGI("kotel", "Testovací běh dokončen");
            id(kotel_pump_forced_run) = false;
            id(kotel_last_pump_run_time) = millis();
          }
  
  - id: voda_test_script
    then:
      - lambda: |-
          if (id(voda_test_probiha)) {
            ESP_LOGW("voda", "Test již probíhá");
            return;
          }
          if (id(voda_havarie_aktivni)) {
            ESP_LOGW("voda", "Nelze spustit test - aktivní havárie");
            return;
          }
          id(voda_test_probiha) = true;
          id(voda_test_phase) = 1;
          id(voda_test_phase_start) = millis();
          id(voda_test_failed) = false;
          id(voda_stav).publish_state("Týdenní test - zavírám ventil");
          id(error_voda) = "Test ventilu: start";
          ESP_LOGI("voda", "Spouštím test ventilu: krok 1 (zavírání)");
      - switch.turn_on: switch_hlavni_ventil

  - id: voda_pause_timer
    then:
      - delay: !lambda |-
          return (unsigned long)(id(voda_pause_delka).state * 60.0 * 60.0 * 1000.0); // hodiny na ms
      - lambda: |-
          if (id(voda_pause_aktivni)) {
            id(voda_pause_aktivni) = false;
            id(voda_pause_cas_aktivace) = 0;
            ESP_LOGI("voda", "Pause režim vypršel - kontrola povodně automaticky zapnuta");
            id(voda_stav).publish_state("Kontrola povodně zapnuta (pause vypršel)");
          }




