# ============================================================================
# HLAVNÍ REGULAČNÍ LOGIKA
# ============================================================================

interval:
  # Střídání stránek displeje každých 4 sekund
  - interval: 4s
    then:
      - lambda: |-
          int max_pages = (id(status_havarijni_rezim).state || id(status_chyba_cidla).state) ? 4 : 3;
          id(display_page) = (id(display_page) + 1) % max_pages;

  # LED status indikace - každou sekundu
  - interval: 1s
    then:
      - lambda: |-
          if (id(status_chyba_cidla).state || id(status_havarijni_rezim).state) {
            id(switch_led_red).turn_on();
          } else {
            id(switch_led_red).turn_off();
          }
  # Hlavní regulační logika kotel - každých 10 sekund
  - interval: 10s
    then:
      - lambda: |-
          static bool last_pump_state = false;
          static bool last_havarie_state = false;
          bool pump_should_run = false;
          bool havarie = false;
          std::string status_text = "Neaktivní";
          std::string error_msg = "";
          float temp_vystup = id(teplota_kotel_vystup).state;
          float temp_vrat = id(teplota_kotel_vrat).state;
          float temp_komin = id(teplota_komin).state;
          bool cidlo_vystup_ok = !isnan(temp_vystup);
          bool cidlo_vrat_ok = !isnan(temp_vrat);
          bool cidlo_komin_ok = !isnan(temp_komin);
      
          // 1. KONTROLA CHYB ČIDEL
          if (!cidlo_vystup_ok || !cidlo_vrat_ok) {
            pump_should_run = true;
            havarie = true;
            error_msg = "Chyba čidla ";
            if (!cidlo_vystup_ok) error_msg += "VYSTUP ";
            if (!cidlo_vrat_ok) error_msg += "VRAT";
            status_text = "CHYBA ČIDLA - Čerpadlo ZAP";
            ESP_LOGE("kotel", "%s", error_msg.c_str());
          } else if (!cidlo_komin_ok) {
            error_msg = "Chyba čidla KOMÍN";
            ESP_LOGW("kotel", "Čidlo komína nefunguje - regulace jen podle rozdílu teplot");
          }
      
          // 2. KONTROLA PŘEHŘÁTÍ
          if (cidlo_vystup_ok && !havarie) {
            float limit = id(kotel_havarijni_limit).state;
            if (temp_vystup > limit) {
              pump_should_run = true;
              havarie = true;
              char buffer[100];
              snprintf(buffer, sizeof(buffer), "PŘEHŘÁTÍ %.0f°C > %.0f°C", temp_vystup, limit);
              error_msg = buffer;
              status_text = "HAVÁRIE - Chlazení!";
              if (!last_havarie_state) {
                ESP_LOGE("kotel", "HAVÁRIE! Teplota %.1f°C > limit %.1f°C - ZAPÍNÁM ČERPADLO!", temp_vystup, limit);
              }
            }
          }
      
          // 3. MANUÁLNÍ REŽIM (má přednost před automatickou regulací, ale ne před havárií)
          if (id(kotel_pump_manual_override) && !havarie) {
            pump_should_run = true;
            status_text = "Manuální režim - ZAP";
          }
      
          // 4. AUTOMATICKÁ REGULACE (jen pokud není manuální režim ani havárie)
          if (!havarie && !id(kotel_pump_manual_override)) {
            bool current_pump_state = id(switch_obehove_cerpadlo).state;
            float rozdil = temp_vystup - temp_vrat;
            bool rozdil_vysok = rozdil >= id(kotel_rozdil_zapnuti).state;
            bool rozdil_nizky = rozdil <= id(kotel_rozdil_vypnuti).state;
            bool komin_horky = cidlo_komin_ok && (temp_komin >= id(kotel_komin_zapnuti).state);
            bool komin_studeny = cidlo_komin_ok && (temp_komin <= id(kotel_komin_vypnuti).state);
        
            // Podmínky pro ZAPNUTÍ
            if (!current_pump_state && (rozdil_vysok || komin_horky)) {
              pump_should_run = true;
              char buffer[150];
              if (rozdil_vysok && komin_horky) {
                snprintf(buffer, sizeof(buffer), "ZAP: Rozdíl %.1f°C + Komín %.0f°C", rozdil, temp_komin);
              } else if (rozdil_vysok) {
                snprintf(buffer, sizeof(buffer), "ZAP: Rozdíl %.1f°C >= %.0f°C", rozdil, id(kotel_rozdil_zapnuti).state);
              } else {
                snprintf(buffer, sizeof(buffer), "ZAP: Komín %.0f°C >= %.0f°C", temp_komin, id(kotel_komin_zapnuti).state);
              }
              status_text = buffer;
              ESP_LOGI("kotel", "%s", buffer);
            } 
            // Podmínky pro VYPNUTÍ
            else if (current_pump_state && rozdil_nizky && (komin_studeny || !cidlo_komin_ok)) {
              pump_should_run = false;
              char buffer[150];
              if (cidlo_komin_ok) {
                snprintf(buffer, sizeof(buffer), "VYP: Rozdíl %.1f°C + Komín %.0f°C", rozdil, temp_komin);
              } else {
                snprintf(buffer, sizeof(buffer), "VYP: Rozdíl %.1f°C <= %.0f°C", rozdil, id(kotel_rozdil_vypnuti).state);
              }
              status_text = buffer;
              ESP_LOGI("kotel", "%s", buffer);
            } 
            // HYSTEREZE - zůstat v aktuálním stavu
            else {
              pump_should_run = current_pump_state;
              char buffer[150];
              if (current_pump_state) {
                snprintf(buffer, sizeof(buffer), "BĚH: Δ%.1f°C K%.0f°C", rozdil, cidlo_komin_ok ? temp_komin : 0);
              } else {
                snprintf(buffer, sizeof(buffer), "ČEKÁ: Δ%.1f°C K%.0f°C", rozdil, cidlo_komin_ok ? temp_komin : 0);
              }
              status_text = buffer;
            }
          }
      
          // 5. PUBLIKOVÁNÍ STAVŮ
          id(kotel_status_havarie).publish_state(havarie);
          id(kotel_stav_regulace).publish_state(status_text);
          id(status_havarijni_rezim).publish_state(havarie);
          id(status_chyba_cidla).publish_state(!cidlo_vystup_ok || !cidlo_vrat_ok);
          id(stav_regulatoru).publish_state(status_text);
      
          // 6. APLIKOVÁNÍ ROZHODNUTÍ
          if (pump_should_run != last_pump_state) {
            if (pump_should_run) {
              id(switch_obehove_cerpadlo).turn_on();
              id(kotel_last_pump_run_time) = millis();
              ESP_LOGI("kotel", "Čerpadlo ZAPNUTO");
            } else {
              id(switch_obehove_cerpadlo).turn_off();
              ESP_LOGI("kotel", "Čerpadlo VYPNUTO");
            }
            last_pump_state = pump_should_run;
          }
      
          // 7. AKTUALIZACE ČASU POSLEDNÍHO BĚHU
          if (id(switch_obehove_cerpadlo).state) {
            id(kotel_last_pump_run_time) = millis();
          }
      
          last_havarie_state = havarie;
  # Kontrola týdenního běhu čerpadla
  - interval: 1h
    then:
      - lambda: |-
          const unsigned long WEEK_IN_MS = 7UL * 24UL * 60UL * 60UL * 1000UL;
          unsigned long current_time = millis();
          unsigned long last_run = id(kotel_last_pump_run_time);
          unsigned long time_since_last_run;
          if (current_time >= last_run) {
            time_since_last_run = current_time - last_run;
          } else {
            time_since_last_run = current_time;
          }
          if (time_since_last_run > WEEK_IN_MS && !id(kotel_pump_forced_run)) {
            float days = time_since_last_run / (24.0 * 60.0 * 60.0 * 1000.0);
            ESP_LOGW("kotel", "Čerpadlo neběželo %.1f dní - spouštím 5min testovací běh", days);
            id(kotel_pump_forced_run) = true;
            id(switch_obehove_cerpadlo).turn_on();
            id(kotel_stav_regulace).publish_state("Testovací běh - údržba");
            id(kotel_forced_run_timer).execute();
          }

script:
  - id: kotel_forced_run_timer
    then:
      - delay: 5min
      - lambda: |-
          if (id(kotel_pump_forced_run)) {
            ESP_LOGI("kotel", "Testovací běh dokončen");
            id(switch_obehove_cerpadlo).turn_off();
            id(kotel_pump_forced_run) = false;
            id(kotel_last_pump_run_time) = millis();
          }
  
  - id: voda_test_script
    then:
      - lambda: |-
          if (id(voda_test_probiha)) {
            ESP_LOGW("voda", "Test již probíhá");
            return;
          }
          id(voda_test_probiha) = true;
          id(voda_stav).publish_state("Týdenní test - zavírám ventil");
          ESP_LOGI("voda", "Test ventilu: Zavírám");
      - switch.turn_on: switch_hlavni_ventil
      - delay: 10s
      - lambda: |-
          id(voda_stav).publish_state("Týdenní test - otevírám ventil");
          ESP_LOGI("voda", "Test ventilu: Otevírám");
      - switch.turn_off: switch_hlavni_ventil
      - delay: 2s
      - lambda: |-
          id(voda_test_probiha) = false;
          id(voda_stav).publish_state("Týdenní test dokončen");
          ESP_LOGI("voda", "Test ventilu dokončen");



