# ============================================================================
# BUTTONS
# ============================================================================

button:
  # Voda - reset havárie
  - platform: template
    name: "Voda: Reset havárie"
    id: voda_reset_havarie
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(voda_havarie_aktivni)) {
            ESP_LOGI("voda", "Manuální reset havárie");
            id(voda_havarie_aktivni) = false;
            id(voda_havarie_typ) = "";
            id(error_voda) = "";
            id(voda_stav).publish_state("Reset havárie - ventil stále zavřen");
          } else {
            ESP_LOGI("voda", "Žádná havárie k resetu");
          }
  
  # Voda - manuální test ventilu
  - platform: template
    name: "Voda: Test ventilu"
    id: voda_test_manual
    icon: "mdi:valve-closed"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(voda_havarie_aktivni)) {
            ESP_LOGW("voda", "Nelze spustit test - aktivní havárie");
            return;
          }
          
          if (id(voda_test_probiha)) {
            ESP_LOGW("voda", "Test již probíhá");
            return;
          }
          
          ESP_LOGI("voda", "Spouštím manuální test ventilu");
          id(voda_test_script).execute();
  
  # Kalibrace průtokoměru
  - platform: template
    name: "Voda: Kal. start"
    id: kalibrace_start
    icon: "mdi:play"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(kalibrace_aktivni)) {
            ESP_LOGW("kalibrace", "Kalibrace již probíhá");
            return;
          }
          
          id(kalibrace_aktivni) = true;
          id(kalibrace_start_cas) = millis();
          id(kalibrace_start_prutok) = id(celkovy_prutok).state;
          
          ESP_LOGI("kalibrace", "Kalibrace začala - počáteční průtok: %.3f L", id(kalibrace_start_prutok));
          
  - platform: template
    name: "Voda: Kal. stop"
    id: kalibrace_stop
    icon: "mdi:stop"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (!id(kalibrace_aktivni)) {
            ESP_LOGW("kalibrace", "Žádná kalibrace neprobíhá");
            return;
          }
          
          float start_l = id(kalibrace_start_prutok);
          float end_l = id(celkovy_prutok).state;
          float namereny_prutok = end_l - start_l;
          float cas_sekundy = (millis() - id(kalibrace_start_cas)) / 1000.0;
          
          ESP_LOGI("kalibrace", "Kalibrace dokončena - %.3f L za %.1f s", namereny_prutok, cas_sekundy);
          ESP_LOGI("kalibrace", "Kalibrace detail: start=%.3f L, end=%.3f L, koef=%.3f", start_l, end_l, id(kalibrace_koeficient));
          
          id(kalibrace_aktivni) = false;
          id(kalibrace_start_cas) = 0;
          id(kalibrace_start_prutok) = 0.0;

  # Plyn - reset havárie
  - platform: template
    name: "Plyn: Reset havárie"
    id: plyn_reset_havarie
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(plyn_havarie_aktivni)) {
            ESP_LOGI("plyn", "Manuální reset havárie plynu");
            id(plyn_havarie_aktivni) = false;
            id(plyn_havarie_cas) = 0;
            id(plyn_havarie_typ) = "";
            id(plyn_prvni_check_prosel) = false;
            ESP_LOGI("plyn", "Reset startovního stavu - příště se provede 5min check");
          } else {
            ESP_LOGI("plyn", "Žádná havárie k resetu");
          }

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 2s  # Zpomaleno z 1s - I2C timeout blokovalo hlavni smycku
    id: oled_display
    lambda: |-
      // Pomocná funkce pro formátování času
      auto format_time_ago = [](unsigned long ms_ago) -> std::string {
        if (ms_ago == 0) return "Nikdy";
        unsigned long seconds = ms_ago / 1000;
        if (seconds < 60) return str_sprintf("%lus", seconds);
        unsigned long minutes = seconds / 60;
        if (minutes < 60) return str_sprintf("%lumin", minutes);
        unsigned long hours = minutes / 60;
        if (hours < 24) return str_sprintf("%luh", hours);
        unsigned long days = hours / 24;
        return str_sprintf("%lud", days);
      };
    
      // Hlavička - stejná pro všechny stránky
      it.filled_rectangle(0, 0, 128, 13);
    
      // STRÁNKA 0: PLYNOVÝ KOTEL
      if (id(display_page) == 0) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "PLYN");
      
        // Zda topí
        it.printf(2, 16, id(font_small), "Status:");
        it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, 
                  id(switch_plynovy_kotel).state ? "TOPI" : "NETOPI");
      
        // Výstup
        it.printf(2, 26, id(font_small), "Výstup:");
        if (!isnan(id(teplota_plynovy_vystup).state)) {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(teplota_plynovy_vystup).state);
        } else {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      
        // Vrát
        it.printf(2, 36, id(font_small), "Vrat:");
        if (!isnan(id(teplota_plynovy_vrat).state)) {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(teplota_plynovy_vrat).state);
        } else {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      
        // Delta
        it.printf(2, 46, id(font_small), "Delta:");
        if (!isnan(id(rozdil_plynovy).state)) {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                    id(rozdil_plynovy).state);
        } else {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      }
            // STRÁNKA 1: KOTEL NA TUHÁ PALIVA
            else if (id(display_page) == 1) {
              it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "KOTEL");
      
              // Zda topí (čerpadlo běží = topí)
              it.printf(2, 16, id(font_small), "Status:");
              it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, 
                        id(switch_obehove_cerpadlo).state ? "TOPI" : "NETOPI");
      
              // Pokud netopí, kdy naposledy běželo čerpadlo
              if (!id(switch_obehove_cerpadlo).state) {
                it.printf(2, 26, id(font_small), "Posl.beh:");
                unsigned long time_ago = millis() - id(kotel_last_pump_run_time);
                std::string time_str = format_time_ago(time_ago);
                it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%s", time_str.c_str());
              } else {
                // Výstup
                it.printf(2, 26, id(font_small), "Výstup:");
                if (!isnan(id(teplota_kotel_vystup).state)) {
                  it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                            id(teplota_kotel_vystup).state);
                } else {
                  it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "---");
                }
              }
      
              // Vrát
              it.printf(2, 36, id(font_small), "Vrat:");
              if (!isnan(id(teplota_kotel_vrat).state)) {
                it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                          id(teplota_kotel_vrat).state);
              } else {
                it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "---");
              }
      
              // Delta
              it.printf(2, 46, id(font_small), "Delta:");
              if (!isnan(id(rozdil_kotel).state)) {
                it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", 
                          id(rozdil_kotel).state);
              } else {
                it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "---");
              }
            }
    
      // STRÁNKA 2: VODA
      else if (id(display_page) == 2) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "VODA");
                // Pokud je pause aktivní, zobrazit to prominentně
                if (id(voda_pause_aktivni)) {
                  it.printf(2, 16, id(font_small), "PAUSE:");
                  if (!isnan(id(voda_pause_zbyvajici).state)) {
                    it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "%.1fh", id(voda_pause_zbyvajici).state);
                  } else {
                    it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "---");
                  }
        
          it.printf(2, 26, id(font_small), "Kontrola:");
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "VYPNUTA");
        } else if (id(voda_test_probiha)) {
          // Zobrazit průběh testu
          it.printf(2, 16, id(font_small), "TEST:");
          it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "PROBIHA");
        
          it.printf(2, 26, id(font_small), "Ventil:");
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, 
                    id(switch_hlavni_ventil).state ? "ZAVRENY" : "OTEVRENY");
        } else {
          // Aktuální průtok
          it.printf(2, 16, id(font_small), "Prutok:");
          if (!isnan(id(prutok_vody).state)) {
            it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "%.1f L/min", 
                      id(prutok_vody).state);
          } else {
            it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "---");
          }
        
          // Celkový průtok
          it.printf(2, 26, id(font_small), "Celkem:");
