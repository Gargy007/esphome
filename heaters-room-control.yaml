# ============================================================================
# ESPHOME - ŘÍZENÍ KOTELNY V2
# ============================================================================
#
# POPIS PROJEKTU:
# ---------------
# Tento projekt řídí kompletní systém vytápění v kotelně s následujícími
# komponenty:
#   1. Kotel na tuhá paliva s oběhovým čerpadlem
#   2. Plynový kotel (záložní/doplňkový zdroj)
#   3. Vodní systém s hlavním ventilem a průtokoměrem
#
# Hardware: Seeed XIAO ESP32-C6
# Komunikace: WiFi + Home Assistant API
# Displej: OLED SH1106 128x64 (I2C)
# Čidla: DS18B20 (teploty), MAX6675 (termočlánek komína), průtokoměr
# Výstupy: 4x relé (čerpadlo, ventil, plyn, rezerva), LED indikace
#
# BEZPEČNOSTNÍ FUNKCE:
# --------------------
# - Automatická detekce chyb čidel → bezpečnostní režim
# - Havarijní chlazení při přehřátí
# - Ochrana čerpadla proti zatuhnutí (týdenní test)
# - Lokální indikace chyb (LED + LCD) i při výpadku WiFi/HA
# - Centralizovaný error systém pro všechny subsystémy
#
# ============================================================================

# ============================================================================
# SUBSYSTÉM 1: KOTEL NA TUHÁ PALIVA
# ============================================================================
#
# HARDWARE:
# ---------
# - Relé: GPIO1 (oběhové čerpadlo kotle)
# - Čidla teploty (DS18B20):
#   * 0xfb000003ea4ce628 - Výstup z kotle
#   * 0x60000003ea354528 - Vrát do kotle
# - Termočlánek (MAX6675): GPIO18 - Teplota komína
#
# FUNKCE:
# -------
# Primární úkol je řídit oběhové čerpadlo kotle podle teploty a stavu topení.
# Čerpadlo odvádí teplo z kotle do topného systému.
#
# LOGIKA ZAPNUTÍ ČERPADLA (OR podmínky):
# ---------------------------------------
# 1. Velký teplotní rozdíl (výstup - vrát) >= "Kotel - Rozdíl ZAP"
#    → Kotel má dostatek tepla k předání do systému
#
# 2. Vysoká teplota v komínu >= "Kotel - Komín ZAP"
#    → V kotli hoří, rychlá indikace topení (rychlejší než rozdíl teplot)
#
# 3. Manuální režim "Kotel - Manuální ZAP" = ON
#    → Uživatel může natvrdo zapnout čerpadlo
#
# 4. Havarijní režim (přehřátí nebo chyba čidla)
#    → Bezpečnostní zapnutí pro chlazení
#
# LOGIKA VYPNUTÍ ČERPADLA (AND podmínky):
# ----------------------------------------
# 1. Malý teplotní rozdíl <= "Kotel - Rozdíl VYP"
#    → Kotel nemá dostatek tepla
#
# 2. Nízká teplota v komínu <= "Kotel - Komín VYP"
#    → V kotli nehoří (nebo bez čidla komína - jen podmínka 1)
#
# 3. Není manuální režim
#    → Manuální režim má přednost, čerpadlo se nevypne
#
# HYSTEREZE:
# ----------
# Rozdíl mezi ZAP a VYP musí být minimálně 2°C, aby se zabránilo
# častému spínání čerpadla. Systém automaticky koriguje hodnoty.
#
# Příklad: ZAP=10°C, VYP=5°C
# - Při 10°C se zapne
# - Běží i při 9°C, 8°C, 7°C, 6°C (hystereze)
# - Při 5°C se vypne
# - Zůstane vypnuté při 6°C, 7°C, 8°C, 9°C
# - Při 10°C se znovu zapne
#
# HAVARIJNÍ STAVY:
# ----------------
# 1. Chyba čidla výstupu nebo vrátu
#    → Čerpadlo ZAP (bezpečnostní režim)
#    → Error: "Chyba čidla VYSTUP/VRAT"
#
# 2. Přehřátí: Teplota výstupu > "Kotel - Havarijní limit"
#    → Čerpadlo ZAP (nucené chlazení)
#    → Error: "PŘEHŘÁTÍ XX°C > YY°C"
#
# 3. Chyba čidla komína
#    → Jen varování, regulace pokračuje bez komína
#    → Error: "Chyba čidla KOMÍN"
#
# ÚDRŽBA ČERPADLA:
# ----------------
# Pokud čerpadlo neběželo více než 7 dní, automaticky se spustí
# 5minutový testovací běh proti zatuhnutí mechanických částí.
#
# NASTAVENÍ Z HOME ASSISTANT:
# ---------------------------
# - "Kotel - Rozdíl ZAP" (5-30°C, default 10°C)
# - "Kotel - Rozdíl VYP" (0-28°C, default 5°C)
# - "Kotel - Komín ZAP" (50-200°C, default 80°C)
# - "Kotel - Komín VYP" (30-150°C, default 50°C)
# - "Kotel - Havarijní limit" (70-95°C, default 85°C)
# - "Kotel - Manuální ZAP" (switch)
#
# STAVY A DIAGNOSTIKA:
# --------------------
# - "Kotel - Čerpadlo běží" (binary_sensor)
# - "Kotel - Topí (komín)" (binary_sensor)
# - "Kotel - Havarijní režim" (binary_sensor)
# - "Kotel - Stav regulace" (text_sensor) - detailní popis stavu
# - "Kotel - Čas od posledního běhu" (sensor v hodinách)
# - "Error - Kotel na tuhá paliva" (text_sensor) - aktuální chyba
#
# ============================================================================

esphome:
  name: "heaters-room-control"
  friendly_name: Kotelna regulator

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  logs:
    sensor: WARN
    dallas.sensor: WARN

# Enable Home Assistant API
api:
  encryption:
    key: "9L/bk2VmBAQsr1AOstQ5VefpNbnjGAEziDRPrTKyEBw="

ota:
  - platform: esphome
    password: "259251edf6e7e1e27ce716db258d0e94"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.113
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  ap:
    ssid: "Boiler-Room-Heaters_v2"
    password: "tMUQtkVnJjVW"

captive_portal:

# --- SBĚRNICE (podle schématu) ---
i2c:
  sda: GPIO22
  scl: GPIO23

spi:
  clk_pin: GPIO19
  miso_pin: GPIO20

one_wire:
  - platform: gpio
    pin: GPIO17 # Pin označený jako D5/DS18B20

# 0x3c00000559fe8628 (DS18B20) OK - Plynovy kotel vystup
# 0x0f00000559c87528 (DS18B20) OK - Plynovy kotel vrat
# 0xfb000003ea4ce628 (DS18B20) OK - Kotel na tuhá paliva vystup
# 0x60000003ea354528 (DS18B20) OK - Kotel na tuhá paliva vrat



# ============================================================================
# GLOBÁLNÍ ERROR SYSTÉM
# ============================================================================

globals:
  # Error stavy pro jednotlivé subsystémy
  - id: error_kotel_tuha_paliva
    type: std::string
    restore_value: no
    initial_value: '""'
  
  - id: error_plynovy_kotel
    type: std::string
    restore_value: no
    initial_value: '""'
  
  - id: error_voda
    type: std::string
    restore_value: no
    initial_value: '""'
  
  - id: error_system
    type: std::string
    restore_value: no
    initial_value: '""'
  
  # Globální error flag (true = alespoň jedna chyba)
  - id: global_error_active
    type: bool
    restore_value: no
    initial_value: 'false'
  
  # WiFi a HA status (jen pro interní použití)
  - id: wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  
  # Časy pro údržbu čerpadla
  - id: kotel_last_pump_run_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
  
  - id: kotel_pump_forced_run
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: kotel_pump_manual_override
    type: bool
    restore_value: no
    initial_value: 'false'

  # Voda - průtok a havárie
  - id: voda_prutok_zacatek
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: voda_posledni_prutok
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: voda_cas_zavreni
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: voda_posledni_kontrola_zavreni
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: voda_havarie_cas
    type: unsigned long
    restore_value: yes
    initial_value: '0'

  - id: voda_havarie_aktivni
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: voda_havarie_typ
    type: std::string
    restore_value: yes
    initial_value: '""'

  - id: voda_varovani_aktivni
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: voda_varovani_cas
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: voda_test_probiha
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: voda_posledni_test_den
    type: int
    restore_value: yes
    initial_value: '-1'

  # Voda - pause režim
  - id: voda_pause_cas_aktivace
    type: unsigned long
    restore_value: yes
    initial_value: '0'

  - id: voda_pause_aktivni
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: display_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_valve_close_time
    type: unsigned long
    restore_value: yes
    initial_value: '0'
sensor:
  - platform: dallas_temp
    address: 0x3c00000559fe8628
    name: Teplota - Plynovy kotel> vystup
    id: teplota_plynovy_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x0f00000559c87528
    name: Teplota - Plynovy kotel> vrat
    id: teplota_plynovy_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0xfb000003ea4ce628
    name: Teplota - Kotel> Vystup
    id: teplota_kotel_vystup
    update_interval: 10s
    filters:
      - filter_out: nan
  
  - platform: dallas_temp
    address: 0x60000003ea354528
    name: Teplota - Kotel> vrat
    id: teplota_kotel_vrat
    update_interval: 10s
    filters:
      - filter_out: nan
  
  # Teplota komína (Termočlánek přes SPI)
  - platform: max6675
    name: "Teplota - Komín (Termočlánek)"
    id: teplota_komin
    cs_pin: GPIO18
    update_interval: 10s

  # Průtokoměr - UPRAVIT EXISTUJÍCÍ
  - platform: pulse_meter
    pin: GPIO16
    name: "Aktuální průtok vody"
    id: prutok_vody
    unit_of_measurement: "L/min"
    internal_filter: 100us
    timeout: 5s
    filters:
      - lambda: return x / 7.5;
    total:
      name: "Celkový průtok vody"
      id: celkovy_prutok
      unit_of_measurement: "L"
      accuracy_decimals: 1
      filters:
        - multiply: 0.1333
    on_value:
      then:
        - lambda: |-
            if (x > 0.01) {
              id(voda_posledni_prutok) = millis();
            }
  
  # Vypočítané rozdíly teplot
  - platform: template
    name: "Rozdíl teplot - Plynový kotel"
    id: rozdil_plynovy
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_plynovy_vystup).state) || isnan(id(teplota_plynovy_vrat).state)) {
        return {};
      }
      return id(teplota_plynovy_vystup).state - id(teplota_plynovy_vrat).state;
  
  - platform: template
    name: "Rozdíl teplot - Kotel na tuhá paliva"
    id: rozdil_kotel
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(teplota_kotel_vystup).state) || isnan(id(teplota_kotel_vrat).state)) {
        return {};
      }
      return id(teplota_kotel_vystup).state - id(teplota_kotel_vrat).state;
  
  # Čas od posledního běhu (pro údržbu)
  - platform: template
    name: "Kotel - Čas od posledního běhu"
    id: kotel_cas_od_behu
    unit_of_measurement: "h"
    accuracy_decimals: 1
    update_interval: 60s
    icon: "mdi:clock-outline"
    lambda: |-
      unsigned long current_time = millis();
      unsigned long last_run = id(kotel_last_pump_run_time);
      unsigned long time_diff;
      
      if (current_time >= last_run) {
        time_diff = current_time - last_run;
      } else {
        time_diff = current_time;
      }
      
      return time_diff / (1000.0 * 60.0 * 60.0); // převod na hodiny
  
  # Voda - čas průtoku
  - platform: template
    name: "Voda - Čas průtoku"
    id: voda_cas_prutoku
    unit_of_measurement: "min"
    accuracy_decimals: 1
    update_interval: 1s
    icon: "mdi:timer-outline"
    lambda: |-
      if (id(voda_prutok_zacatek) == 0) {
        return 0.0;
      }
      unsigned long cas = millis() - id(voda_prutok_zacatek);
      return cas / (60.0 * 1000.0);
  
  # Voda - zbývající čas pause
  - platform: template
    name: "Voda - Zbývající čas pause"
    id: voda_pause_zbyvajici
    unit_of_measurement: "h"
    accuracy_decimals: 1
    update_interval: 60s
    icon: "mdi:timer-sand"
    lambda: |-
      if (!id(voda_pause_aktivni)) {
        return 0.0;
      }
      
      unsigned long uplynulo_ms = millis() - id(voda_pause_cas_aktivace);
      float uplynulo_h = uplynulo_ms / (60.0 * 60.0 * 1000.0);
      float delka_h = id(voda_pause_delka).state;
      float zbyvajici = delka_h - uplynulo_h;
      
      return zbyvajici > 0 ? zbyvajici : 0.0;


# ============================================================================
# NASTAVENÍ (ovladatelné z Home Assistant)
# ============================================================================
number:
  # Regulace podle rozdílu teplot
  - platform: template
    name: "Kotel - Rozdíl ZAP"
    id: kotel_rozdil_zapnuti
    min_value: 5
    max_value: 30
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:thermometer-chevron-up"
    on_value:
      then:
        - lambda: |-
            float vypnuti = id(kotel_rozdil_vypnuti).state;
            float zapnuti = x;
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(kotel_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("kotel", "Auto korekce: Rozdíl VYP nastaven na %.1f°C", nova_hodnota);
            }

  - platform: template
    name: "Kotel - Rozdíl VYP"
    id: kotel_rozdil_vypnuti
    min_value: 0
    max_value: 28
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:thermometer-chevron-down"
    on_value:
      then:
        - lambda: |-
            float zapnuti = id(kotel_rozdil_zapnuti).state;
            float vypnuti = x;
            if (vypnuti >= (zapnuti - 2.0)) {
              float nova_hodnota = zapnuti - 2.0;
              if (nova_hodnota < 0) nova_hodnota = 0;
              id(kotel_rozdil_vypnuti).publish_state(nova_hodnota);
              ESP_LOGW("kotel", "Neplatná hodnota! Nastaveno na %.1f°C", nova_hodnota);
            }

  # Regulace podle teploty komína
  - platform: template
    name: "Kotel - Komín ZAP"
    id: kotel_komin_zapnuti
    min_value: 50
    max_value: 200
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:fire"

  - platform: template
    name: "Kotel - Komín VYP"
    id: kotel_komin_vypnuti
    min_value: 30
    max_value: 150
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:fire-off"

  # Havarijní limit
  - platform: template
    name: "Kotel - Havarijní limit"
    id: kotel_havarijni_limit
    min_value: 70
    max_value: 95
    step: 1
    initial_value: 85
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
    icon: "mdi:alert-octagon"

  # Voda - max čas průtoku
  - platform: template
    name: "Voda - Max čas průtoku"
    id: voda_max_cas_prutoku
    min_value: 5
    max_value: 60
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    mode: box
    icon: "mdi:timer-alert-outline"

  # Voda - min průtok
  - platform: template
    name: "Voda - Min průtok pro detekci"
    id: voda_min_prutok
    min_value: 0.1
    max_value: 5.0
    step: 0.1
    initial_value: 0.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "L/min"
    mode: box
    icon: "mdi:water-outline"

  # Voda - čas varování
  - platform: template
    name: "Voda - Čas varování"
    id: voda_cas_varovani
    min_value: 0
    max_value: 300
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    mode: box
    icon: "mdi:bell-alert-outline"
    disabled_by_default: true  # <-- SKRYTO

  # Voda - den týdenního testu
  - platform: template
    name: "Voda - Den týdenního testu"
    id: voda_test_den
    min_value: 0
    max_value: 6
    step: 1
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box
    icon: "mdi:calendar-week"
    disabled_by_default: true  # <-- SKRYTO

  # Voda - hodina týdenního testu
  - platform: template
    name: "Voda - Hodina týdenního testu"
    id: voda_test_hodina
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 2
    optimistic: true
    restore_value: true
    unit_of_measurement: "h"
    mode: box
    icon: "mdi:clock-outline"
    disabled_by_default: true  # <-- SKRYTO

  # Voda - délka pause
  - platform: template
    name: "Voda - Délka pause"
    id: voda_pause_delka
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 24
    optimistic: true
    restore_value: true
    unit_of_measurement: "h"
    mode: box
    icon: "mdi:timer-pause-outline"
    disabled_by_default: true  # <-- SKRYTO
output:
  - platform: gpio
    pin: GPIO0
    id: gpio_rele_ventil_voda
  - platform: gpio
    pin: GPIO1
    id: gpio_rele_obehove_cerpadlo
  - platform: gpio
    pin: GPIO2
    id: gpio_rele_plyn
  - platform: gpio
    pin: GPIO21
    id: gpio_led_red

# ============================================================================
# OVLÁDÁNÍ
# ============================================================================

switch:
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  
  - platform: output
    output: gpio_rele_ventil_voda
    name: "Hlavní ventil vody"
    id: switch_hlavni_ventil
    on_turn_off:
      then:
        - lambda: |-
            id(last_valve_close_time) = millis();

  - platform: output
    name: Oběhové čerpadlo kotle
    output: gpio_rele_obehove_cerpadlo
    id: switch_obehove_cerpadlo
    internal: true
  
  - platform: output
    output: gpio_rele_plyn
    name: "Spínání plynového kotle"
    id: switch_plynovy_kotel
  
  # Manuální override - ZAPNOUT čerpadlo
  - platform: template
    name: "Kotel - Manuální ZAP"
    id: kotel_manual_on
    icon: "mdi:pump"
    optimistic: true
    turn_on_action:
      - lambda: |-
          ESP_LOGI("kotel", "Manuální ZAP čerpadla");
          id(kotel_pump_manual_override) = true;
          id(switch_obehove_cerpadlo).turn_on();
    turn_off_action:
      - lambda: |-
          ESP_LOGI("kotel", "Manuální režim vypnut");
          id(kotel_pump_manual_override) = false;
          // Čerpadlo se vypne až když to dovolí podmínky

# ============================================================================
# STAVY A DIAGNOSTIKA
# ============================================================================

binary_sensor:
  - platform: template
    name: "Kotel - Čerpadlo běží"
    id: kotel_status_cerpadlo_bezi
    device_class: running
    lambda: return id(switch_obehove_cerpadlo).state;
  
  - platform: template
    name: "Kotel - Topí (komín)"
    id: kotel_status_topi
    device_class: heat
    lambda: |-
      if (isnan(id(teplota_komin).state)) return false;
      return id(teplota_komin).state > id(kotel_komin_zapnuti).state;
  
  - platform: template
    name: "Kotel - Havarijní režim"
    id: kotel_status_havarie
    device_class: problem
  
  - platform: template
    name: "Status - Havarijní režim"
    id: status_havarijni_rezim
  
