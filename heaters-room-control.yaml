          it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "%.0f°C", id(teplota_komin).state);
        } else {
          it.printf(126, 16, id(font_small), TextAlign::TOP_RIGHT, "CHYBA");
        }

        // Topí dle komína
        it.printf(2, 26, id(font_small), "Topi:");
        it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT,
                  id(kotel_status_topi).state ? "ANO" : "NE");

        // Havarijní limit
        it.printf(2, 36, id(font_small), "Hav.limit:");
        it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.0f°C",
                  id(kotel_havarijni_limit).state);
      }
      // STRÁNKA 4: KOTEL HAVÁRIE
      else if (id(display_page) == 4) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "!!KOTEL!!");

        // Error text (max 22 znaků)
        it.printf(2, 16, id(font_small), "%.22s", id(error_kotel_tuha_paliva).c_str());

        it.printf(2, 26, id(font_small), "Výstup:");
        if (!isnan(id(teplota_kotel_vystup).state)) {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", id(teplota_kotel_vystup).state);
        } else {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "CHYBA");
        }

        it.printf(2, 36, id(font_small), "Vrat:");
        if (!isnan(id(teplota_kotel_vrat).state)) {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", id(teplota_kotel_vrat).state);
        } else {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "CHYBA");
        }

        it.printf(2, 46, id(font_small), "Cerpadlo:");
        it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT,
                  id(switch_obehove_cerpadlo).state ? "ZAP" : "VYP");
      }
      // STRÁNKA 5: PLYN HAVÁRIE
      else if (id(display_page) == 5) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "!!PLYN!!");

        it.printf(2, 16, id(font_small), "%.22s", id(plyn_havarie_typ).c_str());

        it.printf(2, 26, id(font_small), "Výstup:");
        if (!isnan(id(teplota_plynovy_vystup).state)) {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", id(teplota_plynovy_vystup).state);
        } else {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "CHYBA");
        }

        it.printf(2, 36, id(font_small), "Vrat:");
        if (!isnan(id(teplota_plynovy_vrat).state)) {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", id(teplota_plynovy_vrat).state);
        } else {
          it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT, "CHYBA");
        }

        it.printf(2, 46, id(font_small), "Delta:");
        if (!isnan(id(rozdil_plynovy).state)) {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%.1f°C", id(rozdil_plynovy).state);
        } else {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      }
      // STRÁNKA 6: VODA HAVÁRIE
      else if (id(display_page) == 6) {
        it.printf(64, 0, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER, "!!VODA!!");

        it.printf(2, 16, id(font_small), "%.22s", id(voda_havarie_typ).c_str());

        it.printf(2, 26, id(font_small), "Prutok:");
        if (!isnan(id(prutok_vody).state)) {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "%.1f L/m", id(prutok_vody).state);
        } else {
          it.printf(126, 26, id(font_small), TextAlign::TOP_RIGHT, "---");
        }

        it.printf(2, 36, id(font_small), "Ventil:");
        it.printf(126, 36, id(font_small), TextAlign::TOP_RIGHT,
                  id(switch_hlavni_ventil).state ? "ZAVRENY" : "OTEVRENY");

        it.printf(2, 46, id(font_small), "Celkem:");
        if (!isnan(id(celkovy_prutok).state)) {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "%.0f L", id(celkovy_prutok).state);
        } else {
          it.printf(126, 46, id(font_small), TextAlign::TOP_RIGHT, "---");
        }
      }
