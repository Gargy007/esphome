esphome:
  name: atrea-vzt-control
  friendly_name: ATREA VZT CONTROL
  platformio_options:
    board_build.flash_mode: dio # Often required for S3
  
  on_boot:
    priority: 800 # Spustí se krátce po inicializaci výstupů
    then:
      - output.set_level:
          id: dac_vystup_1
          level: 0%
      - output.set_level:
          id: dac_vystup_2
          level: 0%

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  
globals:
  - id: last_ventilation_unix
    type: int
    restore_value: yes
    initial_value: '0'
  
  - id: last_ventilation_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption
  # Spustí se, jakmile se Home Assistant (nebo jiný klient) připojí
  on_client_connected:
    then:
      - switch.turn_on: switch_led_green
      - switch.turn_off: switch_led_red

  # Spustí se okamžitě při ztrátě spojení
  on_client_disconnected:
    then:
      - switch.turn_on: switch_led_red
      - switch.turn_off: switch_led_green

ota:
  - platform: esphome
    password: !secret ota_password

# Enable Ethernet
ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO09 # Adjust based on board, sometimes unnecessary
  # Optional manual IP
  manual_ip:
    static_ip: 192.168.1.115
    gateway: 192.168.1.1
    subnet: 255.255.255.0

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Prague"

script:
  # Watchdog na vetrani, maximalne dve hodiny behu
  - id: script_safety_watchdog
    mode: restart # Klíčové: restartuje odpočet při každém zavolání
    then:
      - delay: 7200s
      - logger.log: "BEZPEČNOSTNÍ POJISTKA: Větrání běželo 2 hodiny bez změny, vypínám."
      - switch.turn_off: switch_rele_d4_control_230v
      - globals.set:
          id: last_ventilation_unix
          value: !lambda 'return id(sntp_time).now().timestamp;'
      - globals.set:
          id: last_ventilation_millis
          value: !lambda 'return millis() / 1000;'

  # Skript pro bezpečné vypnutí a zápis do globals
  - id: script_global_turn_off_check
    then:
      - if:
          condition: # Vypni jen když jsou VŠECHNY vstupy fyzicky vypnuté
            and:
              - binary_sensor.is_off: vzt_wc_prizemi
              - binary_sensor.is_off: vzt_wc_patro
              - binary_sensor.is_off: vzt_koupelna
              - binary_sensor.is_off: vzt_kuchyn
              - switch.is_off: switch_ha_externi
          then:
            - script.stop: script_safety_watchdog # ZASTAV POJISTKU, je korektně vypnuto
            - switch.turn_off: switch_rele_d4_control_230v
            - globals.set:
                id: last_ventilation_unix
                value: !lambda 'return id(sntp_time).now().timestamp;'
            - globals.set:
                id: last_ventilation_millis
                value: !lambda 'return millis() / 1000;'
            - logger.log: "Větrání vypnuto, časy uloženy."

  - id: script_wc_logic
    mode: restart
    then:
      - delay: !lambda "return id(wc_delay_start).state * 1000;"
      - switch.turn_on: switch_rele_d4_control_230v

  - id: script_wc_overrun
    mode: restart
    then:
      - delay: !lambda "return id(wc_run_over).state * 1000;"
      - script.execute: script_global_turn_off_check

  - id: script_bath_overrun
    mode: restart
    then:
      - delay: !lambda "return id(bath_run_over).state * 1000;"
      - script.execute: script_global_turn_off_check



one_wire:
  - platform: gpio
    pin: GPIO16


sensor:
  - platform: dallas_temp
    address: 0xbe0624c10c0c3828
    name: Teplota - Rekuperace - Vstup do domu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xdf0923b09c4c2b28
    name:  Teplota - Rekuperace - Vystup z domu
    update_interval: 30s
  - platform: dallas_temp
    address: 0x460000055a39a728
    name:  Teplota - Rekuperace - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xb70623b02c078728
    name:  Teplota - Rekuperace - Vrat z bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xa80623b0191bf928
    name:  Teplota - VZT - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0x620623b2dc5aa828
    name:  Teplota - VZT - Vrat z bytu (cirkulace)
    update_interval: 30s

  - platform: adc
    pin: GPIO02
    name: "Rozdíl tlaku na filtru"
    id: pressure_diff_at_filter
    # Nastavení pro maximální přesnost na ESP32-S3
    attenuation: 11db  # Umožní číst až do 3.1V (při 3.3V VCC)
    update_interval: 1s
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1

    filters:
      # 1. Odstranění šumu průměrováním z 15 vzorků (zpomalí odezvu, zvýší stabilitu)
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1
      
      # 2. Tvůj kalibrovaný vzorec
      - lambda: |-
          return (x - 1.7287) * 1500.0;
      
      # 3. Odstřižení šumu kolem nuly (pokud je hodnota +- 2 Pa, pošle 0)
      - lambda: |-
          if (abs(x) < 2.0) return 0.0;
          else return x;
  
  - platform: template
    name: "VZT - Sekundy od posledního běhu"
    id: vzt_seconds_since_last
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    update_interval: 10s
    lambda: |-
      if (id(last_ventilation_millis) == 0) return 0;
      return (millis() / 1000) - id(last_ventilation_millis);
          
output:
  - platform: gpio
    pin: 
      number: GPIO45
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_nabijeni
  - platform: gpio
    pin: 
      number: GPIO46
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_no
  - platform: gpio
    pin: 
      number: GPIO47
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_230v_1
  - platform: gpio
    pin: 
      number: GPIO48
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_230v_2
  - platform: gpio
    pin: 
      number: GPIO21
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_d4_control_230v
  
  
  - platform: gpio
    pin: GPIO03
    id: gpio_led_red
  - platform: gpio
    pin: GPIO15
    id: gpio_led_green

  - platform: mcp4725
    id: dac_vystup_1
    address: 0x60 # ADDR pin na GND

  - platform: mcp4725
    id: dac_vystup_2
    address: 0x61 # ADDR pin na 5V (VCC)

switch:
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  - platform: output
    name: LED Green
    output: gpio_led_green
    id: switch_led_green
    internal: True
  - platform: output
    name: Relé nabijení tablet
    output: gpio_rele_nabijeni
    id: switch_rele_nabijeni
  - platform: output
    name: Relé NO
    output: gpio_rele_no
    id: switch_rele_no
  - platform: output
    name: Relé 230V 1
    output: gpio_rele_230v_1
    id: switch_rele_230v_1
  - platform: output
    name: Relé 230V 2
    output: gpio_rele_230v_2
    id: switch_rele_230v_2
  - platform: output
    name: Relé ovladání větrání D4
    output: gpio_rele_d4_control_230v
    id: switch_rele_d4_control_230v
  - platform: template
    name: "VZT - HA Externí požadavek"
    id: switch_ha_externi
    optimistic: true
    on_turn_on:
      then:
        - script.execute: script_safety_watchdog
        - switch.turn_on: switch_rele_d4_control_230v
    on_turn_off:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_global_turn_off_check
    

binary_sensor:
  - # D1 - WC PŘÍZEMÍ
    platform: gpio
    id: vzt_wc_prizemi
    pin: {number: GPIO42, mode: {input: true, pullup: true}, inverted: true}
    name: "HV vstup větrání WC přízemí"
    filters: [{delayed_on_off: 25ms}]
    on_press:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_wc_logic
    on_release:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_wc_overrun

  - # D2 - WC PATRO
    platform: gpio
    id: vzt_wc_patro
    pin: {number: GPIO41, mode: {input: true, pullup: true}, inverted: true}
    name: "HV vstup větrání WC patro"
    filters: [{delayed_on_off: 25ms}]
    on_press:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_wc_logic
    on_release:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_wc_overrun

  - # D3 - KOUPELNA
    platform: gpio
    id: vzt_koupelna
    pin: {number: GPIO40, mode: {input: true, pullup: true}, inverted: true}
    name: "HV vstup větrání Koupelna"
    filters: [{delayed_on_off: 25ms}]
    on_press:
      then:
        - script.stop: script_bath_overrun
        - script.execute: script_safety_watchdog
        - switch.turn_on: switch_rele_d4_control_230v
    on_release:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_bath_overrun

  - # D4 - KUCHYŇ
    platform: gpio
    id: vzt_kuchyn
    pin: {number: GPIO39, mode: {input: true, pullup: true}, inverted: true}
    name: "HV vstup větrání kuchyň"
    filters: [{delayed_on_off: 25ms}]
    on_press:
      then:
        - script.execute: script_safety_watchdog
        - switch.turn_on: switch_rele_d4_control_230v
    on_release:
      then:
        - script.execute: script_safety_watchdog
        - script.execute: script_global_turn_off_check


  # Optional: Display IP in Logs
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
  - platform: template
    name: "VZT - Poslední vypnutí (Unix)"
    icon: "mdi:clock-end"
    lambda: |-
      char str[20];
      sprintf(str, "%d", id(last_ventilation_unix));
      return {str};

i2c:
  sda: GPIO1
  scl: GPIO0
  frequency: 100kHz
  scan: true

# Vytvoření entit v Home Assistant (např. jako čísla 0-100%)
number:
  - platform: template
    name: "Servo 1 Ovládání"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    set_action:
      then:
        - output.set_level:
            id: dac_vystup_1
            level: !lambda 'return x / 100.0f;'

  - platform: template
    name: "Servo 2 Ovládání"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    set_action:
      then:
        - output.set_level:
            id: dac_vystup_2
            level: !lambda 'return x / 100.0f;'
  
  # Nastaveni vetrani
  - platform: template
    name: "VZT WC - Zpoždění startu"
    id: wc_delay_start
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 60
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true

  - platform: template
    name: "VZT WC - Doběh"
    id: wc_run_over
    min_value: 0
    max_value: 3000
    step: 1
    initial_value: 300
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true

  - platform: template
    name: "VZT Koupelna - Doběh"
    id: bath_run_over
    min_value: 0
    max_value: 3000
    step: 1
    initial_value: 300
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true

uart:
  id: lin_test_bus
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600
