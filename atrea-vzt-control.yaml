# ╔════════════════════════════════════════════════════════════════════════════════╗
# ║                     ATREA RK2 VZT & Topení - Kontrolér                         ║
# ║                                                                                ║
# ║  Regulátor větrání a topení pro ATREA RK2 jednotku s ESP32-S3                  ║
# ║                                                                                ║
# ║  KLÍČOVÉ FUNKCE:                                                               ║
# ║  • Řízení větrání přes DAC výstup (0.0-1.0) → RK2 manager                      ║
# ║  • Řízení cirkulace a větrání přes relé (XL9535) s pevnými napětími            ║
# ║  • 4x senzory požadavků na větrání (GPIO) - WC, Koupelna, Kuchyň               ║
# ║  • Periodické větrání (2-20 minut, nastavitelné, pokud není aktivní boost)     ║
# ║  • Topení radiátorů v koupelně (bez VZT systému)                               ║
# ║  • Tepelné senzory pro diagnostiku (Dallas 1-Wire)                             ║
# ║  • Monitoring tlaku na filtru (ADC)                                            ║
# ║  • Watchdog bezpečnosti (2 hodiny timeout)                                     ║
# ║  • ❄️  ZAMRAZOVACÍ OCHRANA - Automatická ochrana výměníku (T < 2°C)            ║
# ║      • Zastaví větrání při kritické teplotě                                    ║
# ║      • Spustí topení (cirkulaci) k odmrazení                                   ║
# ║      • Pauzuje všechny nové požadavky (vstupní tlačítka ignorovaná)            ║
# ║      • Obnoví původní požadavek když T > 10°C                                  ║
# ║      • Chrání rekuperační výměník před zmrazením                               ║
# ║  • 🏠 ZONOVÉ VĚTRÁNÍ - Automatické řízení klapek podle požadavků               ║
# ║      • Zona Kuchyň (relé 2) - uzavírá se při větrání zbytku domu               ║
# ║      • Zona Zbytek domu (relé 1) - uzavírá se při větrání kuchyně              ║
# ║      • Profuk a kombinace - obě zóny otevřené                                  ║
# ║                                                                                ║
# ║  DAC VÝSTUP (dac_vystup_1) - Řízení RK2 režimů:                                ║
# ║  • 0.0 = Pouze cirkulace (bez větrání) - TOPENÍ VZT ONLY                       ║
# ║  • 0.5 = Malé větrání + cirkulace - PERIODICKÉ VĚTRÁNÍ (PROFUK)                ║
# ║  • 0.8 = Velké větrání + cirkulace - BOOST + TOPENÍ VZT                        ║
# ║  • 1.0 = Velké větrání bez cirkulace - BOOST ONLY                              ║
# ║                                                                                ║
# ║  MOTORŮ ŘÍZENÍ (XL9535 relé):                                                  ║
# ║  • Větrací ventilátor (relé 8,7,6):                                            ║
# ║    - Vypnuto: všechna relé OFF                                                 ║
# ║    - Malý výkon: relé 8=OFF, 7=OFF, 6=ON                                       ║
# ║    - Velký výkon: relé 8=ON, 7=OFF, 6=OFF                                      ║
# ║    - Boost: relé 8=ON, 7=ON, 6=OFF                                             ║
# ║  • Cirkulační ventilátor (relé 5,4,3):                                         ║
# ║    - Stejné jako větrací, ale relé 5/4/3                                       ║
# ║  • Zonové klapky (relé 2,1):                                                   ║
# ║    - Relé 2: Klapka Kuchyň (OFF=otevřena, ON=uzavřena)                         ║
# ║    - Relé 1: Klapka Zbytek domu (OFF=otevřena, ON=uzavřena)                    ║
# ║                                                                                ║
# ║  VSTUPNÍ SENZORY:                                                              ║
# ║  • vzt_wc_prizemi (GPIO40) - Požadavek na větrání WC přízemí                   ║
# ║  • vzt_wc_patro (GPIO41) - Požadavek na větrání WC patro                       ║
# ║  • vzt_koupelna (GPIO42) - Požadavek na větrání Koupelny                       ║
# ║  • vzt_kuchyn (GPIO39) - Požadavek na větrání Kuchyně                          ║
# ║  • switch_ha_externi - Externí požadavek z Home Assistant                      ║
# ║  • switch_topeni_radiatory - Aktivace topení radiátorů (samostatné od VZT)     ║
# ║  • Teplota - Rekuperace - Výstup z domu (Dallas sensor pro mraz-ochranu)       ║
# ║                                                                                ║
# ║  VÝSTUPNÍ PRVKY:                                                               ║
# ║  • dac_vystup_1 (GPIO 1-Wire DAC via I2C@0x60) - RK2 režim (VZT)               ║
# ║  • Relé motory (XL9535 I2C): větrání (relé 8,7,6), cirkulace (relé 5,4,3)      ║
# ║  • Relé klapky (XL9535 I2C): kuchyň (relé 2), zbytek domu (relé 1)             ║
# ║  • Relé výstupy (GPIO45-48, GPIO21) - Topení, bypass, čerpadlo, atd.           ║
# ║  • LED indikátory (GPIO03=RED, GPIO15=GREEN)                                   ║
# ║                                                                                ║
# ║  REŽIMY TOPENÍ:                                                                ║
# ║  • Topení VZT: Cirkulace VZT + elektromagnetický ventil (full topení)          ║
# ║  • Radiátory: Jen čerpadlo topení (bez VZT ventilu, cílené pro koupelnu)       ║
# ║                                                                                ║
# ╚════════════════════════════════════════════════════════════════════════════════╝

# ┌────────────────────────────────────────────────────────────────────────────────┐
# │                    TABULKA REŽIMŮ A STAVŮ AKTUÁTORŮ                            │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# | Režim                      | DAC  | Větrání Motor | Cirkulace Motor | Čerpadlo | Ventil VZT | Bypass     |
# |----------------------------|------|---------------|-----------------|----------|------------|------------|
# | **KLID**                   | 0.0  | VYPNUTO       | VYPNUTO         | OFF      | OFF        | dle switch |
# | **BOOST**                  | 1.0  | VELKÝ VÝKON   | VYPNUTO         | OFF      | OFF        | dle switch |
# | **BOOST + radiátory**      | 1.0  | VELKÝ VÝKON   | VYPNUTO         | ON       | OFF        | dle switch |
# | **BOOST + TOPENÍ**         | 0.8  | VELKÝ VÝKON   | VELKÝ VÝKON     | ON       | ON         | dle switch |
# | **PROFUK**                 | 1.0  | MALÝ VÝKON    | VYPNUTO         | OFF      | OFF        | dle switch |
# | **PROFUK + radiátory**     | 1.0  | MALÝ VÝKON    | VYPNUTO         | ON       | OFF        | dle switch |
# | **PROFUK + TOPENÍ**        | 0.5  | MALÝ VÝKON    | MALÝ VÝKON      | ON       | ON         | dle switch |
# | **PROFUK + TOPENÍ TURBO**  | 0.5  | MALÝ VÝKON    | BOOST VÝKON     | ON       | ON         | dle switch |
# | **TOPENÍ**                 | 0.0  | VYPNUTO       | VELKÝ VÝKON     | ON       | ON         | dle switch |
# | **TOPENÍ TURBO**           | 0.0  | VYPNUTO       | BOOST VÝKON     | ON       | ON         | dle switch |
# | **Pouze radiátory**        | 0.0  | VYPNUTO       | VYPNUTO         | ON       | OFF        | dle switch |
# | ** FROST PROTECTION**      | 0.0  | VYPNUTO       | MALÝ VÝKON      | ON       | ON         | OFF        |
#
# **LEGENDA:**
# - **DAC**: Výstupní napětí na DAC (0.0 - 1.0) → řídí RK2 manager
# - **Větrání Motor**: Stav větracího ventilátoru (řízeno relé 8,7,6)
# - **Cirkulace Motor**: Stav cirkulačního ventilátoru (řízeno relé 5,4,3)
# - **Relé 8,7,6**: XL9535 relé pro větrací motor (8=HIGH bit, 7=BOOST bit, 6=LOW bit)
# - **Relé 5,4,3**: XL9535 relé pro cirkulační motor (5=HIGH bit, 4=BOOST bit, 3=LOW bit)
# - **Čerpadlo**: GPIO21 - Čerpadlo topení (ON = aktivní topení)
# - **Ventil VZT**: GPIO48 - Elektromagnetický ventil topení VZT (ON = topení přes VZT)
# - **Bypass**: GPIO47 - Klapka bypass (řízeno manuálně přes switch_letni_rezim)
#
# **VÝKONOVÉ ÚROVNĚ CIRKULACE:**
# - **MALÝ VÝKON**: Relé 5=OFF, 4=OFF, 3=ON  (základní topení)
# - **VELKÝ VÝKON**: Relé 5=ON, 4=OFF, 3=OFF  (intenzivní topení s větráním nebo samostatné topení)
# - **BOOST VÝKON**: Relé 5=ON, 4=ON, 3=OFF  (maximální topení turbo režim)
#
# **POZNÁMKY:**
# 1. Režim se určuje podle priorit: FROST > BOOST > PROFUK > TOPENÍ > KLID
# 2. BOOST má přednost před PROFUK (pokud je aktivní boost, profuk se nespustí)
# 3. Radiátory = čerpadlo BEZ ventilu VZT (topení jen radiátorů, ne VZT)
# 4. FROST PROTECTION = nucené topení cirkulací při T < 2°C, obnoví původní režim při T > 10°C
# 5. Watchdog: Automatické vypnutí všech požadavků po 2 hodinách běhu
# 6. ⚡ TURBO režim = BOOST výkon cirkulace (relé 5=ON + 4=ON) pro maximální topení
# 7. BOOST + TOPENÍ = VELKÝ výkon cirkulace (relé 5=ON) pro topení s větráním
# 8. TOPENÍ (bez větrání) = VELKÝ výkon cirkulace (relé 5=ON) pro efektivní samostatné topení


# ┌────────────────────────────────────────────────────────────────────────────────┐
# │                    TABULKA ZONOVÉHO VĚTRÁNÍ                                    │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# | Požadavek větrání          | Klapka Kuchyň (R2) | Klapka Zbytek (R1) | Aktivní zóna      |
# |----------------------------|--------------------|--------------------|-------------------|
# | **Kuchyň**                 | OTEVŘENA (OFF)     | UZAVŘENA (ON)      | 🍳 Kuchyň         |
# | **WC přízemí**             | UZAVŘENA (ON)      | OTEVŘENA (OFF)     | 🏠 WC/Koupelna    |
# | **WC patro**               | UZAVŘENA (ON)      | OTEVŘENA (OFF)     | 🏠 WC/Koupelna    |
# | **Koupelna**               | UZAVŘENA (ON)      | OTEVŘENA (OFF)     | 🏠 WC/Koupelna    |
# | **HA externí**             | UZAVŘENA (ON)      | OTEVŘENA (OFF)     | 🏠 WC/Koupelna    |
# | **Profuk**                 | OTEVŘENA (OFF)     | OTEVŘENA (OFF)     | 🔀 Všechno        |
# | **Kuchyň + WC/Koupelna**   | OTEVŘENA (OFF)     | OTEVŘENA (OFF)     | 🔀 Všechno        |
# | **Klid (žádný požadavek)** | OTEVŘENA (OFF)     | OTEVŘENA (OFF)     | 🔀 Všechno        |
#
# **LEGENDA:**
# - **Relé 2 (Klapka Kuchyň)**: OFF = otevřena (větrá se kuchyň), ON = uzavřena (nevetrá se)
# - **Relé 1 (Klapka Zbytek)**: OFF = otevřena (větrá se zbytek), ON = uzavřena (nevetrá se)
# - **Aktivní zóna**: Která část domu se aktuálně větrá
#
# **POZNÁMKY:**
# 1. Zonové větrání se řídí automaticky podle aktivních požadavků
# 2. Při profuku se větrá celý dům (obě klapky otevřené)
# 3. Při kombinaci požadavků se větrá celý dům (obě klapky otevřené)
# 4. Default stav (klid) = obě klapky otevřené


esphome:
  name: atrea-vzt-control
  friendly_name: ATREA VZT CONTROL
  platformio_options:
    board_build.flash_mode: dio
  
  on_boot:
    priority: 800
    then:
      # RK2 manager nastaví všechny výstupy do správného stavu
      - script.execute: rk2_manager


esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
globals:
  - id: last_ventilation_unix
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_ventilation_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: dac_current_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: vet_current_mode
    type: int
    restore_value: no
    initial_value: '0'  # 0=OFF, 1=LOW, 2=HIGH, 3=BOOST
  - id: cirk_current_mode
    type: int
    restore_value: no
    initial_value: '0'  # 0=OFF, 1=LOW, 2=HIGH, 3=BOOST
  - id: flag_profuk_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_kuchyn_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_ha_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_koupelna_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_wc_prizemi_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_wc_patro_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_topeni_radiatory_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Pro detekci změny stavu (bitová maska)
  - id: last_state_hash
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # ===== FROST PROTECTION (Zamrazovací ochrana) =====
  - id: flag_frost_protection_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Typ původního požadavku na větrání (0=none, 1=kuchyn, 2=ha, 3=koupelna, 4=wc_prizemi, 5=wc_patro, 6=profuk)
  - id: frost_saved_request_type
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # Přídavná info - bylo více simultánních požadavků?
  - id: frost_saved_request_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

logger:
  level: INFO  # Globální úroveň INFO
  logs:
    # Potlačit opakující se senzory
    sensor: ERROR
    text_sensor: ERROR
    dallas.temp.sensor: ERROR
    binary_sensor: INFO  # Potlačit binary_sensor debug
    
    # Potlačit systémové komponenty
    component: ERROR
    api: WARN
    ota: WARN
    mdns: ERROR
    ethernet: WARN
    wifi: ERROR
    
    # Potlačit AC dimmer a light komponenty (hodně verbose)
    ac_dimmer: WARN
    light: WARN
    output: WARN
    
    # Povolit pouze důležité
    script: INFO
    switch: INFO
    lambda: INFO

api:
  encryption:
    key: !secret api_encryption
  on_client_connected:
    then:
      - switch.turn_on: switch_led_green
      - switch.turn_off: switch_led_red
  on_client_disconnected:
    then:
      - switch.turn_on: switch_led_red
      - switch.turn_off: switch_led_green

ota:
  - platform: esphome
    password: !secret ota_password

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO09
  manual_ip:
    static_ip: 192.168.1.115
    gateway: 192.168.1.1
    subnet: 255.255.255.0

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Prague"

#------------------------------------------------------------------------------------
#                         Start of HW part definitions (Inputs)
#------------------------------------------------------------------------------------
# Teplotní senzory (Dallas 1-Wire) - Diagnostika a monitoring teploty
# Monitorují teplotu na různých místech rekuperace a VZT jednotky
#------------------------------------------------------------------------------------

one_wire:
  - platform: gpio
    pin: GPIO16

sensor:
  - platform: dallas_temp
    address: 0xbe0624c10c0c3828
    name: Teplota - Rekuperace - Vstup do domu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xdf0923b09c4c2b28
    name:  Teplota - Rekuperace - Vystup z domu
    id: temp_reku_out_home
    update_interval: 30s
  - platform: dallas_temp
    address: 0x460000055a39a728
    name:  Teplota - Rekuperace - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xb70623b02c078728
    name:  Teplota - Rekuperace - Vrat z bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xa80623b0191bf928
    name:  Teplota - VZT - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0x620623b2dc5aa828
    name:  Teplota - VZT - Vrat z bytu (cirkulace)
    update_interval: 30s

  - platform: adc
    pin: GPIO02
    name: "Rozdíl tlaku na filtru"
    id: pressure_diff_at_filter
    internal: false
    attenuation: 12db
    update_interval: 1s
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1
      - lambda: |-
          return (x - 1.7287) * 1500.0;
      - lambda: |-
          if (abs(x) < 2.0) return 0.0;
          else return x;
  
  - platform: template
    name: "VZT - Sekundy od posledního běhu"
    id: vzt_seconds_since_last
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    update_interval: 10s
    lambda: |-
      if (id(last_ventilation_millis) == 0) return 0;
      return (millis() / 1000) - id(last_ventilation_millis);

  - platform: template
    name: "VZT - Stupeň otevření klapky RK2"
    id: sensor_dac_level
    unit_of_measurement: "%"
    icon: "mdi:percent"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return id(dac_current_level) * 100.0;

binary_sensor:
  # ============================================================================
  # VSTUPNÍ SENZORY - Každý má vlastní oddělené scripty
  # ============================================================================

  - platform: gpio
    id: vzt_kuchyn
    pin: {number: GPIO39, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání kuchyň"
    on_press: 
      - logger.log: "🍳 KUCHYŇ: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.execute: script_kuchyn_on
    on_release: 
      - logger.log: "🍳 KUCHYŇ: Senzor uvolněn"
      - script.execute: script_kuchyn_off

  - platform: gpio
    id: vzt_koupelna
    pin: {number: GPIO42, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání Koupelna"
    on_press: 
      - logger.log: "🛁 KOUPELNA: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_koupelna_off  # Zrušit doběh
      - script.execute: script_koupelna_on
    on_release: 
      - logger.log: "🛁 KOUPELNA: Senzor uvolněn"
      - script.execute: script_koupelna_off

  - platform: gpio
    id: vzt_wc_prizemi
    pin: {number: GPIO40, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání WC přízemí"
    on_press: 
      - logger.log: "🚽 WC PŘÍZEMÍ: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_wc_prizemi_off  # Zrušit doběh
      - script.execute: script_wc_prizemi_on
    on_release: 
      - logger.log: "🚽 WC PŘÍZEMÍ: Senzor uvolněn"
      - script.execute: script_wc_prizemi_off

  - platform: gpio
    id: vzt_wc_patro
    pin: {number: GPIO41, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání WC patro"
    on_press: 
      - logger.log: "🚽 WC PATRO: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_wc_patro_off  # Zrušit doběh
      - script.execute: script_wc_patro_on
    on_release: 
      - logger.log: "🚽 WC PATRO: Senzor uvolněn"
      - script.execute: script_wc_patro_off

  # Binární senzory pro sledování stavu relé topení
  - platform: template
    name: "Topení - Čerpadlo (stav)"
    id: bs_cerpadlo_topeni
    icon: mdi:water-pump
    lambda: |-
      return id(switch_rele_cerpadlo_topeni).state;

  - platform: template
    name: "Topení - Ventil VZT (stav)"
    id: bs_ventil_topeni_vzt
    icon: mdi:water
    lambda: |-
      return id(switch_rele_el_ventil_topeni_vzt).state;

  - platform: template
    name: "VZT - Bypass (stav)"
    id: bs_bypass
    icon: mdi:arrows-vertical
    lambda: |-
      return id(switch_rele_klapka_bypass).state;
  
  # Binární senzory pro sledování stavu klapek zonového větrání
  - platform: template
    name: "VZT - Klapka Kuchyň (stav)"
    id: bs_klapka_kuchyn
    icon: mdi:valve
    lambda: |-
      return id(switch_klapka_kuchyn).state;  // ON = uzavřena, OFF = otevřena
    
  - platform: template
    name: "VZT - Klapka Zbytek domu (stav)"
    id: bs_klapka_zbytek_domu
    icon: mdi:valve
    lambda: |-
      return id(switch_klapka_zbytek_domu).state;  // ON = uzavřena, OFF = otevřena

      
#------------------------------------------------------------------------------------
#                            HW part definitions (Outputs)
#------------------------------------------------------------------------------------
#
# Relé výstupy pro elektromagnetické ventily a čerpadla:
# - GPIO45: Nabijení tabletu
# - GPIO46: Relé NO (normally open)
# - GPIO47: Klapka bypass
# - GPIO48: Elektromagnetický ventil topení VZT
# - GPIO21: Čerpadlo topení
#------------------------------------------------------------------------------------
output:

  - platform: gpio
    pin: 
      number: GPIO45
      mode:
        output: true
        pullup: false
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_nabijeni
  - platform: gpio
    pin: 
      number: GPIO46
      mode:
        output: true
        pullup: false
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_no
  - platform: gpio
    pin: 
      number: GPIO47
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_klapka_bypass
  - platform: gpio
    pin: 
      number: GPIO48
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_el_ventil_topeni_vzt
  - platform: gpio
    pin: 
      number: GPIO21
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_cerpadlo_topeni
  
  - platform: gpio
    pin:
      number: GPIO03
      mode:
        output: true
        pullup: false
        pulldown: false
    id: gpio_led_red
  - platform: gpio
    pin:
      number: GPIO15
      mode:
        output: true
        pullup: false
        pulldown: false
    id: gpio_led_green

  - platform: mcp4725
    id: dac_vystup_1
    address: 0x60 # ADDR pin na GND

  - platform: mcp4725
    id: dac_vystup_2
    address: 0x61 # ADDR pin na 5V (VCC)

xl9535:
  id: xl9535_relay_board
  address: 0x20  # Default address for Xl9535 I2C 8 relay board

i2c:
  sda: GPIO1
  scl: GPIO0
  frequency: 100kHz
  scan: true

#------------------------------------------------------------------------------------
#                         Home Assistant Interface & Control
#------------------------------------------------------------------------------------
# Ovládací prvky pro HA - LED indikátory, relé, teplota, čas, nastavení
#------------------------------------------------------------------------------------

switch:
