# ╔════════════════════════════════════════════════════════════════════════════════╗
# ║                     ATREA RK2 VZT & Topení - Kontrolér                         ║
# ║                                                                                ║
# ║  Regulátor větrání a topení pro ATREA RK2 jednotku s ESP32-S3                  ║
# ║                                                                                ║
# ║  KLÍČOVÉ FUNKCE:                                                               ║
# ║  • Řízení větrání přes DAC výstup (0.0-1.0) → RK2 manager                      ║
# ║  • Řízení cirkulace a větrání přes relé (XL9535) s pevnými napětími            ║
# ║  • 4x senzory požadavků na větrání (GPIO) - WC, Koupelna, Kuchyň               ║
# ║  • Periodické větrání (2-20 minut, nastavitelné, pokud není aktivní boost)     ║
# ║  • Topení radiátorů v koupelně (bez VZT systému)                               ║
# ║  • Tepelné senzory pro diagnostiku (Dallas 1-Wire)                             ║
# ║  • Monitoring tlaku na filtru (ADC)                                            ║
# ║  • Watchdog bezpečnosti (2 hodiny timeout)                                     ║
# ║  • ❄️  ZAMRAZOVACÍ OCHRANA - Automatická ochrana výměníku (T < 2°C)            ║
# ║      • Zastaví větrání při kritické teplotě                                    ║
# ║      • Spustí topení (cirkulaci) k odmrazení                                   ║
# ║      • Pauzuje všechny nové požadavky (vstupní tlačítka ignorovaná)            ║
# ║      • Obnoví původní požadavek když T > 10°C                                  ║
# ║      • Chrání rekuperační výměník před zmrazením                               ║
# ║                                                                                ║
# ║  DAC VÝSTUP (dac_vystup_1) - Řízení RK2 režimů:                                ║
# ║  • 0.0 = Pouze cirkulace (bez větrání) - TOPENÍ VZT ONLY                       ║
# ║  • 0.5 = Malé větrání + cirkulace - PERIODICKÉ VĚTRÁNÍ (PROFUK)                ║
# ║  • 0.8 = Velké větrání + cirkulace - BOOST + TOPENÍ VZT                        ║
# ║  • 1.0 = Velké větrání bez cirkulace - BOOST ONLY                              ║
# ║                                                                                ║
# ║  MOTORŮ ŘÍZENÍ (XL9535 relé):                                                  ║
# ║  • Větrací ventilátor (relé 8,7,6):                                            ║
# ║    - Vypnuto: všechna relé OFF                                                 ║
# ║    - Malý výkon: relé 8=OFF, 7=OFF, 6=ON                                       ║
# ║    - Velký výkon: relé 8=ON, 7=OFF, 6=OFF                                      ║
# ║    - Boost: relé 8=ON, 7=ON, 6=OFF                                             ║
# ║  • Cirkulační ventilátor (relé 5,4,3):                                         ║
# ║    - Stejné jako větrací, ale relé 5/4/3                                       ║
# ║                                                                                ║
# ║  VSTUPNÍ SENZORY:                                                              ║
# ║  • vzt_wc_prizemi (GPIO40) - Požadavek na větrání WC přízemí                   ║
# ║  • vzt_wc_patro (GPIO41) - Požadavek na větrání WC patro                       ║
# ║  • vzt_koupelna (GPIO42) - Požadavek na větrání Koupelny                       ║
# ║  • vzt_kuchyn (GPIO39) - Požadavek na větrání Kuchyně                          ║
# ║  • switch_ha_externi - Externí požadavek z Home Assistant                      ║
# ║  • switch_topeni_radiatory - Aktivace topení radiátorů (samostatné od VZT)     ║
# ║  • Teplota - Rekuperace - Výstup z domu (Dallas sensor pro mraz-ochranu)       ║
# ║                                                                                ║
# ║  VÝSTUPNÍ PRVKY:                                                               ║
# ║  • dac_vystup_1 (GPIO 1-Wire DAC via I2C@0x60) - RK2 režim (VZT)               ║
# ║  • Relé motory (XL9535 I2C): větrání (relé 8,7,6), cirkulace (relé 5,4,3)      ║
# ║  • Relé výstupy (GPIO45-48, GPIO21) - Topení, bypass, čerpadlo, atd.           ║
# ║  • LED indikátory (GPIO03=RED, GPIO15=GREEN)                                   ║
# ║                                                                                ║
# ║  REŽIMY TOPENÍ:                                                                ║
# ║  • Topení VZT: Cirkulace VZT + elektromagnetický ventil (full topení)          ║
# ║  • Radiátory: Jen čerpadlo topení (bez VZT ventilu, cílené pro koupelnu)       ║
# ║                                                                                ║
# ╚════════════════════════════════════════════════════════════════════════════════╝

esphome:
  name: atrea-vzt-control
  friendly_name: ATREA VZT CONTROL
  platformio_options:
    board_build.flash_mode: dio
  
  on_boot:
    priority: 800
    then:
      # Nastavit všechna relé motorů do vypnutého stavu po bootu
      - switch.turn_off: switch_rele_8
      - switch.turn_off: switch_rele_7
      - switch.turn_off: switch_rele_6
      - switch.turn_off: switch_rele_5
      - switch.turn_off: switch_rele_4
      - switch.turn_off: switch_rele_3
      # Run RK2 manager to apply initial state (e.g. if topení radiátory were active before reboot)    
      - script.execute: rk2_manager


esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
globals:
  - id: last_ventilation_unix
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_ventilation_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: dac_current_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: vet_current_mode
    type: int
    restore_value: no
    initial_value: '0'  # 0=OFF, 1=LOW, 2=HIGH, 3=BOOST
  - id: cirk_current_mode
    type: int
    restore_value: no
    initial_value: '0'  # 0=OFF, 1=LOW, 2=HIGH, 3=BOOST
  - id: flag_profuk_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_kuchyn_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_ha_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_koupelna_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_wc_prizemi_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_wc_patro_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_topeni_radiatory_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Pro detekci změny stavu (bitová maska)
  - id: last_state_hash
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # ===== FROST PROTECTION (Zamrazovací ochrana) =====
  - id: flag_frost_protection_active
    type: bool
    restore_value: no
    initial_value: 'false'
  # Typ původního požadavku na větrání (0=none, 1=kuchyn, 2=ha, 3=koupelna, 4=wc_prizemi, 5=wc_patro, 6=profuk)
  - id: frost_saved_request_type
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # Přídavná info - bylo více simultánních požadavků?
  - id: frost_saved_request_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

logger:
  level: INFO  # Globální úroveň INFO
  logs:
    # Potlačit opakující se senzory
    sensor: ERROR
    text_sensor: ERROR
    dallas.temp.sensor: ERROR
    binary_sensor: INFO  # Potlačit binary_sensor debug
    
    # Potlačit systémové komponenty
    component: ERROR
    api: WARN
    ota: WARN
    mdns: ERROR
    ethernet: WARN
    wifi: ERROR
    
    # Potlačit AC dimmer a light komponenty (hodně verbose)
    ac_dimmer: WARN
    light: WARN
    output: WARN
    
    # Povolit pouze důležité
    script: INFO
    switch: INFO
    lambda: INFO

api:
  encryption:
    key: !secret api_encryption
  on_client_connected:
    then:
      - switch.turn_on: switch_led_green
      - switch.turn_off: switch_led_red
  on_client_disconnected:
    then:
      - switch.turn_on: switch_led_red
      - switch.turn_off: switch_led_green

ota:
  - platform: esphome
    password: !secret ota_password

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO09
  manual_ip:
    static_ip: 192.168.1.115
    gateway: 192.168.1.1
    subnet: 255.255.255.0

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Prague"

#------------------------------------------------------------------------------------
#                         Start of HW part definitions (Inputs)
#------------------------------------------------------------------------------------
# Teplotní senzory (Dallas 1-Wire) - Diagnostika a monitoring teploty
# Monitorují teplotu na různých místech rekuperace a VZT jednotky
#------------------------------------------------------------------------------------

one_wire:
  - platform: gpio
    pin: GPIO16

sensor:
  - platform: dallas_temp
    address: 0xbe0624c10c0c3828
    name: Teplota - Rekuperace - Vstup do domu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xdf0923b09c4c2b28
    name:  Teplota - Rekuperace - Vystup z domu
    id: temp_reku_out_home
    update_interval: 30s
  - platform: dallas_temp
    address: 0x460000055a39a728
    name:  Teplota - Rekuperace - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xb70623b02c078728
    name:  Teplota - Rekuperace - Vrat z bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xa80623b0191bf928
    name:  Teplota - VZT - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0x620623b2dc5aa828
    name:  Teplota - VZT - Vrat z bytu (cirkulace)
    update_interval: 30s

  - platform: adc
    pin: GPIO02
    name: "Rozdíl tlaku na filtru"
    id: pressure_diff_at_filter
    internal: false
    # Nastavení pro maximální přesnost na ESP32-S3
    attenuation: 12db  # Umožní číst až do 3.1V (při 3.3V VCC)
    update_interval: 1s
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1

    filters:
      # 1. Odstranění šumu průměrováním z 15 vzorků (zpomalí odezvu, zvýší stabilitu)
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1
      
      # 2. Tvůj kalibrovaný vzorec
      - lambda: |-
          return (x - 1.7287) * 1500.0;
      
      # 3. Odstřižení šumu kolem nuly (pokud je hodnota +- 2 Pa, pošle 0)
      - lambda: |-
          if (abs(x) < 2.0) return 0.0;
          else return x;
  
  - platform: template
    name: "VZT - Sekundy od posledního běhu"
    id: vzt_seconds_since_last
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    update_interval: 10s
    lambda: |-
      if (id(last_ventilation_millis) == 0) return 0;
      return (millis() / 1000) - id(last_ventilation_millis);

  - platform: template
    name: "VZT - Stav Cirkulačního Ventilátoru"
    id: text_stav_cirkulace
    icon: "mdi:fan"
    lambda: |-
      int mode = id(cirk_current_mode);
      return mode == 0 ? "Vypnuto" : mode == 1 ? "Malý výkon" : mode == 2 ? "Velký výkon" : mode == 3 ? "Boost" : "Neznámý stav";

  - platform: template
    name: "VZT - Stav Větracího Ventilátoru"
    id: text_stav_vetrani
    icon: "mdi:fan"
    lambda: |-
      int mode = id(vet_current_mode);
      return mode == 0 ? "Vypnuto" : mode == 1 ? "Malý výkon" : mode == 2 ? "Velký výkon" : mode == 3 ? "Boost" : "Neznámý stav";

  - platform: template
    name: "VZT - Stupeň otevření klapky RK2"
    id: sensor_dac_level
    unit_of_measurement: "%"
    icon: "mdi:percent"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return id(dac_current_level) * 100.0;
binary_sensor:
  # ============================================================================
  # VSTUPNÍ SENZORY - Každý má vlastní oddělené scripty
  # ============================================================================

  - platform: gpio
    id: vzt_kuchyn
    pin: {number: GPIO39, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání kuchyň"
    on_press: 
      - logger.log: "🍳 KUCHYŇ: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.execute: script_kuchyn_on
    on_release: 
      - logger.log: "🍳 KUCHYŇ: Senzor uvolněn"
      - script.execute: script_kuchyn_off

  - platform: gpio
    id: vzt_koupelna
    pin: {number: GPIO42, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání Koupelna"
    on_press: 
      - logger.log: "🛁 KOUPELNA: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_koupelna_off  # Zrušit doběh
      - script.execute: script_koupelna_on
    on_release: 
      - logger.log: "🛁 KOUPELNA: Senzor uvolněn"
      - script.execute: script_koupelna_off

  - platform: gpio
    id: vzt_wc_prizemi
    pin: {number: GPIO40, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání WC přízemí"
    on_press: 
      - logger.log: "🚽 WC PŘÍZEMÍ: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_wc_prizemi_off  # Zrušit doběh
      - script.execute: script_wc_prizemi_on
    on_release: 
      - logger.log: "🚽 WC PŘÍZEMÍ: Senzor uvolněn"
      - script.execute: script_wc_prizemi_off

  - platform: gpio
    id: vzt_wc_patro
    pin: {number: GPIO41, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání WC patro"
    on_press: 
      - logger.log: "🚽 WC PATRO: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_wc_patro_off  # Zrušit doběh
      - script.execute: script_wc_patro_on
    on_release: 
      - logger.log: "🚽 WC PATRO: Senzor uvolněn"
      - script.execute: script_wc_patro_off

  # Binární senzory pro sledování stavu relé topení
  - platform: template
    name: "Topení - Čerpadlo (stav)"
    id: bs_cerpadlo_topeni
    icon: mdi:water-pump
    lambda: |-
      return id(switch_rele_cerpadlo_topeni).state;

  - platform: template
    name: "Topení - Ventil VZT (stav)"
    id: bs_ventil_topeni_vzt
    icon: mdi:water
    lambda: |-
      return id(switch_rele_el_ventil_topeni_vzt).state;

  - platform: template
    name: "VZT - Bypass (stav)"
    id: bs_bypass
    icon: mdi:arrows-vertical
    lambda: |-
      return id(switch_rele_klapka_bypass).state;
      
#------------------------------------------------------------------------------------
#                            HW part definitions (Outputs)
#------------------------------------------------------------------------------------
# AC DIMMER triaky na GPIO17 a GPIO18:
# - GPIO17: Regulace cirkulace (0-100%)
# - GPIO18: Regulace větrání (0-100%)
# Oba používají zero-crossing pin GPIO34 pro synchronizaci
#
# Relé výstupy pro elektromagnetické ventily a čerpadla:
# - GPIO45: Nabijení tabletu
# - GPIO46: Relé NO (normally open)
# - GPIO47: Klapka bypass
# - GPIO48: Elektromagnetický ventil topení VZT
# - GPIO21: Čerpadlo topení
#------------------------------------------------------------------------------------
output:
    # Triaky (Fázová regulace) - ZAKOMENTOVÁNO, nahrazeno relé řízením
    # - platform: ac_dimmer
    #   id: output_cirkulace
    #   gate_pin: GPIO17
    #   zero_cross_pin:
    #     number: GPIO34
    #     allow_other_uses: true
    #     mode:
    #       input: true
    #       pullup: true
    #     inverted: yes
    #   method: LEADING_PULSE
    
    # - platform: ac_dimmer
    #   id: output_vetrani
    #   gate_pin: GPIO18
    #   zero_cross_pin:
    #     number: GPIO34
    #     allow_other_uses: true
    #     mode:
    #       input: true
    #       pullup: true
    #     inverted: yes
    #   method: LEADING_PULSE

  - platform: gpio
    pin: 
      number: GPIO45
      mode:
        output: true
        pullup: false
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_nabijeni
  - platform: gpio
    pin: 
      number: GPIO46
      mode:
        output: true
        pullup: false
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_no
  - platform: gpio
    pin: 
      number: GPIO47
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_klapka_bypass
  - platform: gpio
    pin: 
      number: GPIO48
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_el_ventil_topeni_vzt
  - platform: gpio
    pin: 
      number: GPIO21
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_cerpadlo_topeni
  
  - platform: gpio
    pin:
      number: GPIO03
      mode:
        output: true
        pullup: false
        pulldown: false
    id: gpio_led_red
  - platform: gpio
    pin:
      number: GPIO15
      mode:
        output: true
        pullup: false
        pulldown: false
    id: gpio_led_green

  - platform: mcp4725
    id: dac_vystup_1
    address: 0x60 # ADDR pin na GND

  - platform: mcp4725
    id: dac_vystup_2
    address: 0x61 # ADDR pin na 5V (VCC)

xl9535:
  id: xl9535_relay_board
  address: 0x20  # Default address for Xl9535 I2C 8 relay board

i2c:
  sda: GPIO1
  scl: GPIO0
  frequency: 100kHz
  scan: true

light:
  # Interní light entity pro řízení PWM výkonu
  # Nejsou viditelné v HA GUI (internal: true) - ZAKOMENTOVÁNO, nahrazeno relé řízením
  
  # - platform: monochromatic
  #   name: "VZT - Aktuální výkon Cirkulace"
  #   output: output_cirkulace
  #   id: light_cirkulace
  #   internal: true  # Ovládáno managerem skrze lambda
  # - platform: monochromatic
  #   name: "VZT - Aktuální výkon Větrání"
  #   output: output_vetrani
  #   id: light_vetrani
  #   internal: true
#------------------------------------------------------------------------------------
#                         Home Assistant Interface & Control
#------------------------------------------------------------------------------------
# Ovládací prvky pro HA - LED indikátory, relé, teplota, čas, nastavení
#------------------------------------------------------------------------------------

switch:
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  - platform: output
    name: LED Green
    output: gpio_led_green
    id: switch_led_green
    internal: True
  - platform: output
    name: Nabijení tablet
    output: gpio_rele_nabijeni
    id: switch_rele_nabijeni
  - platform: output
    name: Relé NO
    output: gpio_rele_no
    id: switch_rele_no
  - platform: output
    name: Klapka bypass
    output: gpio_rele_klapka_bypass
    id: switch_rele_klapka_bypass
    internal: true
  - platform: output
    name: Topení ventil VZT
    output: gpio_rele_el_ventil_topeni_vzt
    id: switch_rele_el_ventil_topeni_vzt
    internal: true
  - platform: output
    name: Čerpadlo topení
    output: gpio_rele_cerpadlo_topeni
    id: switch_rele_cerpadlo_topeni
    internal: true
  - platform: template
    name: "VZT - HA Externí požadavek"
    id: switch_ha_externi
    optimistic: true
    icon: mdi:fan
    on_turn_on: 
      - logger.log:
          format: "🏠 HA EXTERNÍ: Zapnuto"
          level: INFO
      - script.execute: script_safety_watchdog
      - script.execute: script_ha_on
    on_turn_off: 
      - logger.log:
          format: "🏠 HA EXTERNÍ: Vypnuto"
          level: INFO
      - script.execute: script_ha_off

  - platform: template
    name: "VZT - Topení aktivní"
    id: switch_topeni_on
    optimistic: true
    icon: mdi:fire
    on_turn_on: 
      - logger.log:
          format: "🔥 TOPENÍ: Zapnuto"
          level: INFO
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log:
          format: "🔥 TOPENÍ: Vypnuto"
          level: INFO
      - script.execute: rk2_manager

  - platform: template
    name: "VZT - Topení na MAX (Turbo)"
    id: switch_topeni_turbo
    optimistic: true
    icon: mdi:lightning-bolt
    on_turn_on: 
      - logger.log:
          format: "⚡ TOPENÍ TURBO: Zapnuto"
          level: INFO
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log:
          format: "⚡ TOPENÍ TURBO: Vypnuto"
          level: INFO
      - script.execute: rk2_manager

  - platform: template
    name: "VZT - Letní režim (Bypass)"
    id: switch_letni_rezim
    optimistic: true
    icon: mdi:sun
    on_turn_on: 
      - logger.log:
          format: "☀️ LETNÍ REŽIM: Zapnut"
          level: INFO
      - switch.turn_on: switch_rele_klapka_bypass
    on_turn_off: 
      - logger.log:
          format: "☀️ LETNÍ REŽIM: Vypnut"
          level: INFO
      - switch.turn_off: switch_rele_klapka_bypass

  - platform: template
    name: "Topení - radiátory"
    id: switch_topeni_radiatory
    optimistic: true
    icon: mdi:radiator
    on_turn_on: 
      - logger.log:
          format: "🔥 RADIÁTORY: Zapnuty"
          level: INFO
      - globals.set: {id: flag_topeni_radiatory_active, value: 'true'}
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log:
          format: "🔥 RADIÁTORY: Vypnuty"
          level: INFO
      - globals.set: {id: flag_topeni_radiatory_active, value: 'false'}
      - script.execute: rk2_manager

  # XL9535 I2C 8 Relay Board Switches
  - platform: gpio
    name: "XL9535 Relay 1"
    pin:
      xl9535: xl9535_relay_board
      number: 0
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "XL9535 Relay 2"
    pin:
      xl9535: xl9535_relay_board
      number: 1
      mode:
        output: true
      inverted: false
  - platform: gpio
    name: "XL9535 Relay 3"
    id: switch_rele_3
    pin:
      xl9535: xl9535_relay_board
      number: 2
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení cirkulačního motoru
  - platform: gpio
    name: "XL9535 Relay 4"
    id: switch_rele_4
    pin:
      xl9535: xl9535_relay_board
      number: 3
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení cirkulačního motoru
  - platform: gpio
    name: "XL9535 Relay 5"
    id: switch_rele_5
    pin:
      xl9535: xl9535_relay_board
      number: 4
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení cirkulačního motoru
  - platform: gpio
    name: "XL9535 Relay 6"
    id: switch_rele_6
    pin:
      xl9535: xl9535_relay_board
      number: 5
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení větracího motoru
  - platform: gpio
    name: "XL9535 Relay 7"
    id: switch_rele_7
    pin:
      xl9535: xl9535_relay_board
      number: 6
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení větracího motoru
  - platform: gpio
    name: "XL9535 Relay 8"
    id: switch_rele_8
    pin:
      xl9535: xl9535_relay_board
      number: 7
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení větracího motoru

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
  - platform: template
    name: "VZT - Poslední vypnutí (Unix)"
    icon: "mdi:clock-end"
    lambda: |-
      char str[20];
      sprintf(str, "%d", id(last_ventilation_unix));
      return {str};

  # NOVÝ - Stav zamrazovací ochrany
  - platform: template
    name: "VZT - Zamrazovací ochrana (stav)"
    id: vzt_frost_protection_status
    icon: "mdi:snowflake-alert"
    update_interval: 1s
    lambda: |-
      if (!id(flag_frost_protection_active)) {
        return std::string("Vypnuta");
      }
      
      float temp = id(temp_reku_out_home).state;
      if (std::isnan(temp)) {
        return std::string("Chyba: NaN");
      }
      
      const char* request_names[] = {"žádný", "🍳 kuchyň", "🏠 HA externí", "🛁 koupelna", "🚽 WC přízemí", "🚽 WC patro", "💨 profuk"};
      uint8_t req_type = id(frost_saved_request_type);
      
      if (req_type > 6) req_type = 0;
      
      if (req_type == 0) {
        return std::string("Aktivní - čeká se odbourání (T=" + std::to_string((int)temp) + "°C)");
      } else {
        return std::string("Aktivní - čeká se na 10°C, obnoví: " + std::string(request_names[req_type]) + " (T=" + std::to_string((int)temp) + "°C)");
      }

  # NOVÝ - Důvod nárazového větrání
  - platform: template
    name: "VZT - Důvod nárazového větrání"
    id: vzt_boost_reason
    icon: "mdi:information-outline"
    update_interval: 1s
    lambda: |-
      std::vector<std::string> reasons;
    
      // Kontrola jednotlivých aktivních vstupů
      if (id(flag_wc_prizemi_active)) {
        reasons.push_back("WC přízemí");
      }
      if (id(flag_wc_patro_active)) {
        reasons.push_back("WC patro");
      }
      if (id(flag_koupelna_active)) {
        reasons.push_back("Koupelna");
      }
      if (id(flag_kuchyn_active)) {
        reasons.push_back("Kuchyň");
      }
      if (id(flag_ha_active)) {
        reasons.push_back("HA externí");
      }
    
      // Pokud není žádný důvod
      if (reasons.empty()) {
        return std::string("Žádný");
      }
    
      // Spojení všech důvodů čárkou
      std::string result = "";
      for (size_t i = 0; i < reasons.size(); i++) {
        result += reasons[i];
        if (i < reasons.size() - 1) {
          result += ", ";
        }
      }
    
      return result;
      
  - platform: template
    name: "VZT - Aktuální režim"
    id: vzt_current_mode
    update_interval: 1s
    lambda: |-
      bool boost = id(flag_kuchyn_active) || id(flag_ha_active) || id(flag_koupelna_active) || id(flag_wc_prizemi_active) || id(flag_wc_patro_active);
      bool topeni = id(switch_topeni_on).state;
      bool profuk = id(flag_profuk_active);
      bool radiatory = id(flag_topeni_radiatory_active);
      bool frost_protection = id(flag_frost_protection_active);

      // Vytvoření bitové masky stavu (pro detekci změny)
      uint8_t current_hash = 0;
      current_hash |= (boost ? 1 : 0) << 0;
      current_hash |= (topeni ? 1 : 0) << 1;
      current_hash |= (profuk ? 1 : 0) << 2;
      current_hash |= (id(flag_wc_prizemi_active) ? 1 : 0) << 3;
      current_hash |= (id(flag_wc_patro_active) ? 1 : 0) << 4;
      current_hash |= (id(flag_koupelna_active) ? 1 : 0) << 5;
      current_hash |= (id(flag_kuchyn_active) ? 1 : 0) << 6;
      current_hash |= (id(flag_ha_active) ? 1 : 0) << 7;

      // Logovat pouze při změně stavu
      if (current_hash != id(last_state_hash)) {
        ESP_LOGI("STATE_CHANGE", "boost=%d, topeni=%d, profuk=%d, frost=%d | WC_priz=%d, WC_pat=%d, Koup=%d, Kuch=%d, HA_ext=%d", 
          boost, topeni, profuk, frost_protection,
          id(flag_wc_prizemi_active), id(flag_wc_patro_active), id(flag_koupelna_active), 
          id(flag_kuchyn_active), id(flag_ha_active));
        id(last_state_hash) = current_hash;
      }

      if (frost_protection) {
        return std::string("❄️ Zamrazovací ochrana");
      } else if (boost) {
        if (topeni) {
          return std::string("Větrání + Topení");
        } else {
          return std::string(radiatory ? "Větrání + radiátory" : "Větrání");
        }
      } else if (profuk) {
        if (topeni) {
          return std::string("Profuk + Topení");
        } else {
          return std::string(radiatory ? "Profuk + radiátory" : "Profuk");
        }
      } else if (topeni) {
        return std::string("Topení");
      } else if (radiatory) {
        return std::string("Pouze radiátory");
      }
      return std::string("Klid");


