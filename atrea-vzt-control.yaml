    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  - platform: output
    name: LED Green
    output: gpio_led_green
    id: switch_led_green
    internal: True
  - platform: output
    name: Nabijení tablet
    output: gpio_rele_nabijeni
    id: switch_rele_nabijeni
  - platform: output
    name: Relé NO
    output: gpio_rele_no
    id: switch_rele_no
  - platform: output
    name: Klapka bypass
    output: gpio_rele_klapka_bypass
    id: switch_rele_klapka_bypass
    internal: true
  - platform: output
    name: Topení ventil VZT
    output: gpio_rele_el_ventil_topeni_vzt
    id: switch_rele_el_ventil_topeni_vzt
    internal: true
  - platform: output
    name: Čerpadlo topení
    output: gpio_rele_cerpadlo_topeni
    id: switch_rele_cerpadlo_topeni
    internal: true
  - platform: template
    name: "VZT - HA Externí požadavek"
    id: switch_ha_externi
    optimistic: true
    icon: mdi:fan
    on_turn_on: 
      - logger.log:
          format: "🏠 HA EXTERNÍ: Zapnuto"
          level: INFO
      - script.execute: script_safety_watchdog
      - script.execute: script_ha_on
    on_turn_off: 
      - logger.log:
          format: "🏠 HA EXTERNÍ: Vypnuto"
          level: INFO
      - script.execute: script_ha_off

  - platform: template
    name: "VZT - Topení aktivní"
    id: switch_topeni_on
    optimistic: true
    icon: mdi:fire
    on_turn_on: 
      - logger.log:
          format: "🔥 TOPENÍ: Zapnuto"
          level: INFO
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log:
          format: "🔥 TOPENÍ: Vypnuto"
          level: INFO
      - script.execute: rk2_manager

  - platform: template
    name: "VZT - Topení na MAX (Turbo)"
    id: switch_topeni_turbo
    optimistic: true
    icon: mdi:lightning-bolt
    on_turn_on: 
      - logger.log:
          format: "⚡ TOPENÍ TURBO: Zapnuto"
          level: INFO
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log:
          format: "⚡ TOPENÍ TURBO: Vypnuto"
          level: INFO
      - script.execute: rk2_manager

  - platform: template
    name: "VZT - Letní režim (Bypass)"
    id: switch_letni_rezim
    optimistic: true
    icon: mdi:sun
    on_turn_on: 
      - logger.log:
          format: "☀️ LETNÍ REŽIM: Zapnut"
          level: INFO
      - switch.turn_on: switch_rele_klapka_bypass
    on_turn_off: 
      - logger.log:
          format: "☀️ LETNÍ REŽIM: Vypnut"
          level: INFO
      - switch.turn_off: switch_rele_klapka_bypass

  - platform: template
    name: "Topení - radiátory"
    id: switch_topeni_radiatory
    optimistic: true
    icon: mdi:radiator
    on_turn_on: 
      - logger.log:
          format: "🔥 RADIÁTORY: Zapnuty"
          level: INFO
      - globals.set: {id: flag_topeni_radiatory_active, value: 'true'}
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log:
          format: "🔥 RADIÁTORY: Vypnuty"
          level: INFO
      - globals.set: {id: flag_topeni_radiatory_active, value: 'false'}
      - script.execute: rk2_manager

  # XL9535 I2C 8 Relay Board Switches
  - platform: gpio
    name: "VZT - Klapka Zbytek domu"
    id: switch_klapka_zbytek_domu
    pin:
      xl9535: xl9535_relay_board
      number: 0
      mode:
        output: true
      inverted: false
    internal: true  # ✅ Skryto z HA - řízení klapky zbytek domu
    
  - platform: gpio
    name: "VZT - Klapka Kuchyň"
    id: switch_klapka_kuchyn
    pin:
      xl9535: xl9535_relay_board
      number: 1
      mode:
        output: true
      inverted: false
    internal: true  # ✅ Skryto z HA - řízení klapky kuchyň

  - platform: gpio
    name: "VZT - Motor Cirkulace LOW"
    id: switch_motor_cirkulace_low
    pin:
      xl9535: xl9535_relay_board
      number: 2
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení cirkulačního motoru
    
  - platform: gpio
    name: "VZT - Motor Cirkulace BOOST"
    id: switch_motor_cirkulace_boost
    pin:
      xl9535: xl9535_relay_board
      number: 3
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení cirkulačního motoru
    
  - platform: gpio
    name: "VZT - Motor Cirkulace HIGH"
    id: switch_motor_cirkulace_high
    pin:
      xl9535: xl9535_relay_board
      number: 4
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení cirkulačního motoru
    
  - platform: gpio
    name: "VZT - Motor Větrání LOW"
    id: switch_motor_vetrani_low
    pin:
      xl9535: xl9535_relay_board
      number: 5
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení větracího motoru
    
  - platform: gpio
    name: "VZT - Motor Větrání BOOST"
    id: switch_motor_vetrani_boost
    pin:
      xl9535: xl9535_relay_board
      number: 6
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení větracího motoru
    
  - platform: gpio
    name: "VZT - Motor Větrání HIGH"
    id: switch_motor_vetrani_high
    pin:
      xl9535: xl9535_relay_board
      number: 7
      mode:
        output: true
      inverted: false
    internal: true  # Skryto z HA - řízení větracího motoru


text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
      
  # Stavy ventilátorů - SPRÁVNĚ v text_sensor sekci
  - platform: template
    name: "VZT - Stav Cirkulačního Ventilátoru"
    id: text_stav_cirkulace
    icon: "mdi:fan"
    update_interval: 5s
    lambda: |-
      int mode = id(cirk_current_mode);
      if (mode == 0) return std::string("Vypnuto");
      if (mode == 1) return std::string("Malý výkon");
      if (mode == 2) return std::string("Velký výkon");
      if (mode == 3) return std::string("Boost");
      return std::string("Neznámý stav");

  - platform: template
    name: "VZT - Stav Větracího Ventilátoru"
    id: text_stav_vetrani
    icon: "mdi:fan"
    update_interval: 5s
    lambda: |-
      int mode = id(vet_current_mode);
      if (mode == 0) return std::string("Vypnuto");
      if (mode == 1) return std::string("Malý výkon");
      if (mode == 2) return std::string("Velký výkon");
      if (mode == 3) return std::string("Boost");
      return std::string("Neznámý stav");
      
  - platform: template
    name: "VZT - Poslední vypnutí (Unix)"
    icon: "mdi:clock-end"
    lambda: |-
      char str[20];
      sprintf(str, "%d", id(last_ventilation_unix));
      return std::string(str);

  - platform: template
    name: "VZT - Zamrazovací ochrana (stav)"
    id: vzt_frost_protection_status
    icon: "mdi:snowflake-alert"
    update_interval: 1s
    lambda: |-
      if (!id(flag_frost_protection_active)) {
        return std::string("Vypnuta");
      }
      
      float temp = id(temp_reku_out_home).state;
      if (std::isnan(temp)) {
        return std::string("Chyba: NaN");
      }
      
      const char* request_names[] = {"žádný", "🍳 kuchyň", "🏠 HA externí", "🛁 koupelna", "🚽 WC přízemí", "🚽 WC patro", "💨 profuk"};
      uint8_t req_type = id(frost_saved_request_type);
      
      if (req_type > 6) req_type = 0;
      
      if (req_type == 0) {
        return std::string("Aktivní - čeká se odbourání (T=" + std::to_string((int)temp) + "°C)");
      } else {
        return std::string("Aktivní - čeká se na 10°C, obnoví: " + std::string(request_names[req_type]) + " (T=" + std::to_string((int)temp) + "°C)");
      }

  - platform: template
    name: "VZT - Důvod nárazového větrání"
    id: vzt_boost_reason
    icon: "mdi:information-outline"
    update_interval: 1s
    lambda: |-
      std::vector<std::string> reasons;
    
      if (id(flag_wc_prizemi_active)) {
        reasons.push_back("WC přízemí");
      }
      if (id(flag_wc_patro_active)) {
        reasons.push_back("WC patro");
      }
      if (id(flag_koupelna_active)) {
        reasons.push_back("Koupelna");
      }
      if (id(flag_kuchyn_active)) {
        reasons.push_back("Kuchyň");
      }
      if (id(flag_ha_active)) {
        reasons.push_back("HA externí");
      }
    
      if (reasons.empty()) {
        return std::string("Žádný");
      }
    
      std::string result = "";
      for (size_t i = 0; i < reasons.size(); i++) {
        result += reasons[i];
        if (i < reasons.size() - 1) {
          result += ", ";
        }
      }
    
      return result;
      
  - platform: template
    name: "VZT - Aktuální režim"
    id: vzt_current_mode
    update_interval: 1s
    lambda: |-
      bool boost = id(flag_kuchyn_active) || id(flag_ha_active) || id(flag_koupelna_active) || id(flag_wc_prizemi_active) || id(flag_wc_patro_active);
      bool topeni = id(switch_topeni_on).state;
      bool turbo = id(switch_topeni_turbo).state;
      bool profuk = id(flag_profuk_active);
      bool radiatory = id(flag_topeni_radiatory_active);
      bool frost_protection = id(flag_frost_protection_active);

      uint8_t current_hash = 0;
      current_hash |= (boost ? 1 : 0) << 0;
      current_hash |= (topeni ? 1 : 0) << 1;
      current_hash |= (profuk ? 1 : 0) << 2;
      current_hash |= (id(flag_wc_prizemi_active) ? 1 : 0) << 3;
      current_hash |= (id(flag_wc_patro_active) ? 1 : 0) << 4;
      current_hash |= (id(flag_koupelna_active) ? 1 : 0) << 5;
      current_hash |= (id(flag_kuchyn_active) ? 1 : 0) << 6;
      current_hash |= (id(flag_ha_active) ? 1 : 0) << 7;

      if (current_hash != id(last_state_hash)) {
        ESP_LOGI("STATE_CHANGE", "boost=%d, topeni=%d, turbo=%d, profuk=%d, frost=%d | WC_priz=%d, WC_pat=%d, Koup=%d, Kuch=%d, HA_ext=%d", 
          boost, topeni, turbo, profuk, frost_protection,
          id(flag_wc_prizemi_active), id(flag_wc_patro_active), id(flag_koupelna_active), 
          id(flag_kuchyn_active), id(flag_ha_active));
        id(last_state_hash) = current_hash;
      }

      // ========================================================================
      // ROZLIŠENÍ TOPENÍ vs. BOOST TOPENÍ
      // ========================================================================
      
      if (frost_protection) {
        return std::string("❄️ Zamrazovací ochrana");
      } 
      else if (boost) {
        // BOOST VĚTRÁNÍ
        if (topeni) {
          // Boost + Topení
          if (turbo) {
            return std::string("Větrání + Boost Topení ⚡");
          } else {
            return std::string("Větrání + Topení");
          }
        } else {
          // Boost bez topení
          return std::string(radiatory ? "Větrání + radiátory" : "Větrání");
        }
      } 
      else if (profuk) {
        // PROFUK (periodické větrání)
        if (topeni) {
          // Profuk + Topení
          if (turbo) {
            return std::string("Profuk + Boost Topení ⚡");
          } else {
            return std::string("Profuk + Topení");
          }
        } else {
          // Profuk bez topení
          return std::string(radiatory ? "Profuk + radiátory" : "Profuk");
        }
      } 
      else if (topeni) {
        // POUZE TOPENÍ (bez větrání)
        if (turbo) {
          return std::string("Boost Topení ⚡");
        } else {
          return std::string("Topení");
        }
      } 
      else if (radiatory) {
        return std::string("Pouze radiátory");
      }
      
      return std::string("Klid");

  - platform: template
    name: "VZT - Zonové větrání (stav)"
    id: vzt_zone_status
    icon: "mdi:home-group"
    update_interval: 1s
    lambda: |-
      bool kuchyn = id(flag_kuchyn_active);
      bool wc_prizemi = id(flag_wc_prizemi_active);
      bool wc_patro = id(flag_wc_patro_active);
      bool koupelna = id(flag_koupelna_active);
      bool ha_ext = id(flag_ha_active);
      bool profuk = id(flag_profuk_active);
      
      bool zbytek_domu = wc_prizemi || wc_patro || koupelna || ha_ext;
      
      // ========================================================================
      // TŘI PRAKTICKY VÝZNAMNÉ STAVY
      // ========================================================================
      
      if (kuchyn && !zbytek_domu) {
        // Pouze kuchyň aktivní
        return std::string("🍳 Kuchyň");
      }
      else if (zbytek_domu && !kuchyn) {
        // Pouze WC/Koupelna/HA aktivní
        return std::string("🏠 WC/Koupelna");
      }
      else {
        // Profuk, kombinace, nebo klid (obě zóny otevřené)
        return std::string("🔀 Všechno");
      }



