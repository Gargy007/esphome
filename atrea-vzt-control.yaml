# ╔════════════════════════════════════════════════════════════════════════════════╗
# ║                     ATREA RK2 VZT & Topení - Kontrolér                         ║
# ║                                                                                ║
# ║  Regulátor větrání a topení pro ATREA RK2 jednotku s ESP32-S3                  ║
# ║                                                                                ║
# ║  KLÍČOVÉ FUNKCE:                                                               ║
# ║  • Řízení větrání přes DAC výstup (0.0-1.0) → RK2 manager                      ║
# ║  • Řízení cirkulace a větrání přes PWM triaky (AC_DIMMER)                      ║
# ║  • 4x senzory požadavků na větrání (GPIO) - WC, Koupelna, Kuchyň               ║
# ║  • Periodické větrání (5 minut/hodinu, pokud není aktivní boost)               ║
# ║  • Tepelné senzory pro diagnostiku (Dallas 1-Wire)                             ║
# ║  • Monitoring tlaku na filtru (ADC)                                            ║
# ║  • Watchdog bezpečnosti (2 hodiny timeout)                                     ║
# ║                                                                                ║
# ║  DAC VÝSTUP (dac_vystup_1) - Řízení RK2 režimů:                                ║
# ║  • 0.0 = Pouze cirkulace (bez větrání) - TOPENÍONLY                            ║
# ║  • 0.5 = Malé větrání + cirkulace - PERIODICKÉ VĚTRÁNÍ                         ║
# ║  • 0.8 = Velké větrání + cirkulace - BOOST + TOPENÍ                            ║
# ║  • 1.0 = Velké větrání bez cirkulace - BOOST ONLY                              ║
# ║                                                                                ║
# ║  VSTUPNÍ SENZORY:                                                              ║
# ║  • vzt_wc_prizemi (GPIO42) - Požadavek na větrání WC přízemí                   ║
# ║  • vzt_wc_patro (GPIO41) - Požadavek na větrání WC patro                       ║
# ║  • vzt_koupelna (GPIO40) - Požadavek na větrání Koupelny                       ║
# ║  • vzt_kuchyn (GPIO39) - Požadavek na větrání Kuchyně                          ║
# ║  • switch_ha_externi - Externí požadavek z Home Assistant                      ║
# ║                                                                                ║
# ║  VÝSTUPNÍ PRVKY:                                                               ║
# ║  • dac_vystup_1 (GPIO 1-Wire DAC via I2C@0x60) - RK2 režim                     ║
# ║  • output_vetrani (GPIO18 AC_DIMMER) - PWM větrání (0-100%)                    ║
# ║  • output_cirkulace (GPIO17 AC_DIMMER) - PWM cirkulace (0-100%)                ║
# ║  • Relé výstupy (GPIO45-48, GPIO21) - Topení, bypass, atd.                     ║
# ║  • LED indikátory (GPIO03=RED, GPIO15=GREEN)                                   ║
# ║                                                                                ║
# ╚════════════════════════════════════════════════════════════════════════════════╝

esphome:
  name: atrea-vzt-control
  friendly_name: ATREA VZT CONTROL
  platformio_options:
    board_build.flash_mode: dio
  
  on_boot:
    priority: 800
    then:
      - script.execute: rk2_manager

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
globals:
  - id: last_ventilation_unix
    type: int
    restore_value: yes
    initial_value: '0'
  - id: last_ventilation_millis
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: dac_current_level
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: vet_current_pwr
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: cirk_current_pwr
    type: float
    restore_value: no
    initial_value: '0.0'
  # NOVÉ FLAGY PRO AKTIVNÍ VĚTRÁNÍ
  - id: flag_kuchyn_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_ha_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_koupelna_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_wc_prizemi_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: flag_wc_patro_active
    type: bool
    restore_value: no
    initial_value: 'false'

logger:
  level: INFO  # Globální úroveň INFO
  logs:
    # Potlačit opakující se senzory
    sensor: ERROR
    text_sensor: ERROR
    dallas.temp.sensor: ERROR
    binary_sensor: WARN  # Potlačit binary_sensor debug
    
    # Potlačit systémové komponenty
    component: ERROR
    api: WARN
    ota: WARN
    mdns: ERROR
    ethernet: WARN
    wifi: ERROR
    
    # Potlačit AC dimmer a light komponenty (hodně verbose)
    ac_dimmer: WARN
    light: WARN
    output: WARN
    
    # Povolit pouze důležité
    script: INFO
    switch: INFO
    lambda: INFO

api:
  encryption:
    key: !secret api_encryption
  on_client_connected:
    then:
      - switch.turn_on: switch_led_green
      - switch.turn_off: switch_led_red
  on_client_disconnected:
    then:
      - switch.turn_on: switch_led_red
      - switch.turn_off: switch_led_green

ota:
  - platform: esphome
    password: !secret ota_password

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO09
  manual_ip:
    static_ip: 192.168.1.115
    gateway: 192.168.1.1
    subnet: 255.255.255.0

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Prague"

#------------------------------------------------------------------------------------
#                         Start of HW part definitions (Inputs)
#------------------------------------------------------------------------------------
# Teplotní senzory (Dallas 1-Wire) - Diagnostika a monitoring teploty
# Monitorují teplotu na různých místech rekuperace a VZT jednotky
#------------------------------------------------------------------------------------

one_wire:
  - platform: gpio
    pin: GPIO16

sensor:
  - platform: dallas_temp
    address: 0xbe0624c10c0c3828
    name: Teplota - Rekuperace - Vstup do domu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xdf0923b09c4c2b28
    name:  Teplota - Rekuperace - Vystup z domu
    update_interval: 30s
  - platform: dallas_temp
    address: 0x460000055a39a728
    name:  Teplota - Rekuperace - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xb70623b02c078728
    name:  Teplota - Rekuperace - Vrat z bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0xa80623b0191bf928
    name:  Teplota - VZT - Vystup do bytu
    update_interval: 30s
  - platform: dallas_temp
    address: 0x620623b2dc5aa828
    name:  Teplota - VZT - Vrat z bytu (cirkulace)
    update_interval: 30s

  - platform: adc
    pin: GPIO02
    name: "Rozdíl tlaku na filtru"
    id: pressure_diff_at_filter
    internal: false
    # Nastavení pro maximální přesnost na ESP32-S3
    attenuation: 11db  # Umožní číst až do 3.1V (při 3.3V VCC)
    update_interval: 1s
    unit_of_measurement: "Pa"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 1

    filters:
      # 1. Odstranění šumu průměrováním z 15 vzorků (zpomalí odezvu, zvýší stabilitu)
      - sliding_window_moving_average:
          window_size: 15
          send_every: 1
      
      # 2. Tvůj kalibrovaný vzorec
      - lambda: |-
          return (x - 1.7287) * 1500.0;
      
      # 3. Odstřižení šumu kolem nuly (pokud je hodnota +- 2 Pa, pošle 0)
      - lambda: |-
          if (abs(x) < 2.0) return 0.0;
          else return x;
  
  - platform: template
    name: "VZT - Sekundy od posledního běhu"
    id: vzt_seconds_since_last
    unit_of_measurement: "s"
    icon: "mdi:timer-outline"
    update_interval: 10s
    lambda: |-
      if (id(last_ventilation_millis) == 0) return 0;
      return (millis() / 1000) - id(last_ventilation_millis);

  - platform: template
    name: "VZT - Výkon Cirkulace"
    id: sensor_pwr_cirkulace
    unit_of_measurement: "%"
    icon: "mdi:fan"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return id(cirk_current_pwr);

  - platform: template
    name: "VZT - Výkon Větrání"
    id: sensor_pwr_vetrani
    unit_of_measurement: "%"
    icon: "mdi:fan"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return id(vet_current_pwr);

  - platform: template
    name: "VZT - Stupeň otevření klapky RK2"
    id: sensor_dac_level
    unit_of_measurement: "%"
    icon: "mdi:percent"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      return id(dac_current_level) * 100.0;
binary_sensor:
  # ============================================================================
  # VSTUPNÍ SENZORY - Každý má vlastní oddělené scripty
  # ============================================================================

  - platform: gpio
    id: vzt_kuchyn
    pin: {number: GPIO39, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání kuchyň"
    on_press: 
      - logger.log: "🍳 KUCHYŇ: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.execute: script_kuchyn_on
    on_release: 
      - logger.log: "🍳 KUCHYŇ: Senzor uvolněn"
      - script.execute: script_kuchyn_off

  - platform: gpio
    id: vzt_koupelna
    pin: {number: GPIO40, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání Koupelna"
    on_press: 
      - logger.log: "🛁 KOUPELNA: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_koupelna_off  # Zrušit doběh
      - script.execute: script_koupelna_on
    on_release: 
      - logger.log: "🛁 KOUPELNA: Senzor uvolněn"
      - script.execute: script_koupelna_off

  - platform: gpio
    id: vzt_wc_prizemi
    pin: {number: GPIO42, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání WC přízemí"
    on_press: 
      - logger.log: "🚽 WC PŘÍZEMÍ: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_wc_prizemi_off  # Zrušit doběh
      - script.execute: script_wc_prizemi_on
    on_release: 
      - logger.log: "🚽 WC PŘÍZEMÍ: Senzor uvolněn"
      - script.execute: script_wc_prizemi_off

  - platform: gpio
    id: vzt_wc_patro
    pin: {number: GPIO41, mode: {input: true, pullup: true}, inverted: true}
    name: "Požadavek větrání WC patro"
    on_press: 
      - logger.log: "🚽 WC PATRO: Senzor aktivován"
      - script.execute: script_safety_watchdog
      - script.stop: script_wc_patro_off  # Zrušit doběh
      - script.execute: script_wc_patro_on
    on_release: 
      - logger.log: "🚽 WC PATRO: Senzor uvolněn"
      - script.execute: script_wc_patro_off

  # Binární senzory pro sledování stavu relé topení
  - platform: template
    name: "Topení - Čerpadlo (stav)"
    id: bs_cerpadlo_topeni
    icon: mdi:water-pump
    lambda: |-
      return id(switch_rele_cerpadlo_topeni).state;

  - platform: template
    name: "Topení - Ventil VZT (stav)"
    id: bs_ventil_topeni_vzt
    icon: mdi:water
    lambda: |-
      return id(switch_rele_el_ventil_topeni_vzt).state;

  - platform: template
    name: "VZT - Bypass (stav)"
    id: bs_bypass
    icon: mdi:arrows-vertical
    lambda: |-
      return id(switch_rele_klapka_bypass).state;
      
#------------------------------------------------------------------------------------
#                            HW part definitions (Outputs)
#------------------------------------------------------------------------------------
# AC DIMMER triaky na GPIO17 a GPIO18:
# - GPIO17: Regulace cirkulace (0-100%)
# - GPIO18: Regulace větrání (0-100%)
# Oba používají zero-crossing pin GPIO34 pro synchronizaci
#
# Relé výstupy pro elektromagnetické ventily a čerpadla:
# - GPIO45: Nabijení tabletu
# - GPIO46: Relé NO (normally open)
# - GPIO47: Klapka bypass
# - GPIO48: Elektromagnetický ventil topení VZT
# - GPIO21: Čerpadlo topení
#------------------------------------------------------------------------------------
output:
    # Triaky (Fázová regulace)
  - platform: ac_dimmer
    id: output_cirkulace
    gate_pin: GPIO17
    zero_cross_pin:
      number: GPIO34
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: yes
    method: LEADING_PULSE
    
  - platform: ac_dimmer
    id: output_vetrani
    gate_pin: GPIO18
    zero_cross_pin:
      number: GPIO34
      allow_other_uses: true
      mode:
        input: true
        pullup: true
      inverted: yes
    method: LEADING_PULSE

  - platform: gpio
    pin: 
      number: GPIO45
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_nabijeni
  - platform: gpio
    pin: 
      number: GPIO46
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_no
  - platform: gpio
    pin: 
      number: GPIO47
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_klapka_bypass
  - platform: gpio
    pin: 
      number: GPIO48
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_el_ventil_topeni_vzt
  - platform: gpio
    pin: 
      number: GPIO21
      mode:
        output: true
        pullup: true
        pulldown: false
      inverted: false  # Keeps active-low relay OFF on boot
    id: gpio_rele_cerpadlo_topeni
  
  - platform: gpio
    pin: GPIO03
    id: gpio_led_red
  - platform: gpio
    pin: GPIO15
    id: gpio_led_green

  - platform: mcp4725
    id: dac_vystup_1
    address: 0x60 # ADDR pin na GND

  - platform: mcp4725
    id: dac_vystup_2
    address: 0x61 # ADDR pin na 5V (VCC)

i2c:
  sda: GPIO1
  scl: GPIO0
  frequency: 100kHz
  scan: true

light:
  # Interní light entity pro řízení PWM výkonu
  # Nejsou viditelné v HA GUI (internal: true) - řídí se přímo z rk2_manager
  
  - platform: monochromatic
    name: "VZT - Aktuální výkon Cirkulace"
    output: output_cirkulace
    id: light_cirkulace
    internal: true  # Ovládáno managerem skrze lambda
  - platform: monochromatic
    name: "VZT - Aktuální výkon Větrání"
    output: output_vetrani
    id: light_vetrani
    internal: true
#------------------------------------------------------------------------------------
#                         Home Assistant Interface & Control
#------------------------------------------------------------------------------------
# Ovládací prvky pro HA - LED indikátory, relé, teplota, čas, nastavení
#------------------------------------------------------------------------------------

switch:
  - platform: output
    name: LED Red
    output: gpio_led_red
    id: switch_led_red
    internal: True
  - platform: output
    name: LED Green
    output: gpio_led_green
    id: switch_led_green
    internal: True
  - platform: output
    name: Nabijení tablet
    output: gpio_rele_nabijeni
    id: switch_rele_nabijeni
  - platform: output
    name: Relé NO
    output: gpio_rele_no
    id: switch_rele_no
  - platform: output
    name: Klapka bypass
    output: gpio_rele_klapka_bypass
    id: switch_rele_klapka_bypass
    internal: true
  - platform: output
    name: Topení ventil VZT
    output: gpio_rele_el_ventil_topeni_vzt
    id: switch_rele_el_ventil_topeni_vzt
    internal: true
  - platform: output
    name: Čerpadlo topení
    output: gpio_rele_cerpadlo_topeni
    id: switch_rele_cerpadlo_topeni
    internal: true
  - platform: template
    name: "VZT - HA Externí požadavek"
    id: switch_ha_externi
    optimistic: true
    icon: mdi:fan
    on_turn_on: 
      - logger.log: "🏠 HA EXTERNÍ: Zapnuto"
      - script.execute: script_safety_watchdog
      - script.execute: script_ha_on
    on_turn_off: 
      - logger.log: "🏠 HA EXTERNÍ: Vypnuto"
      - script.execute: script_ha_off

  - platform: template
    name: "VZT - Topení aktivní"
    id: switch_topeni_on
    optimistic: true
    icon: mdi:fire
    on_turn_on: 
      - logger.log: "🔥 TOPENÍ: Zapnuto"
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log: "🔥 TOPENÍ: Vypnuto"
      - script.execute: rk2_manager

  - platform: template
    name: "VZT - Topení na MAX (Turbo)"
    id: switch_topeni_turbo
    optimistic: true
    icon: mdi:lightning-bolt
    on_turn_on: 
      - logger.log: "⚡ TOPENÍ TURBO: Zapnuto"
      - script.execute: rk2_manager
    on_turn_off: 
      - logger.log: "⚡ TOPENÍ TURBO: Vypnuto"
      - script.execute: rk2_manager

  - platform: template
    name: "VZT - Letní režim (Bypass)"
    id: switch_letni_rezim
    optimistic: true
    icon: mdi:sun
    on_turn_on: [switch.turn_on: switch_rele_klapka_bypass]
    on_turn_off: [switch.turn_off: switch_rele_klapka_bypass]
text_sensor:
  - platform: ethernet_info
    ip_address:
      name: "IP Address"
  - platform: template
    name: "VZT - Poslední vypnutí (Unix)"
    icon: "mdi:clock-end"
    lambda: |-
      char str[20];
      sprintf(str, "%d", id(last_ventilation_unix));
      return {str};

  # NOVÝ - Důvod nárazového větrání
  - platform: template
    name: "VZT - Důvod nárazového větrání"
    id: vzt_boost_reason
    icon: "mdi:information-outline"
    update_interval: 1s
    lambda: |-
      std::vector<std::string> reasons;
    
      // Kontrola jednotlivých aktivních vstupů
      if (id(flag_wc_prizemi_active)) {
        reasons.push_back("WC přízemí");
      }
      if (id(flag_wc_patro_active)) {
        reasons.push_back("WC patro");
      }
      if (id(flag_koupelna_active)) {
        reasons.push_back("Koupelna");
      }
      if (id(flag_kuchyn_active)) {
        reasons.push_back("Kuchyň");
      }
      if (id(flag_ha_active)) {
        reasons.push_back("HA externí");
      }
    
      // Pokud není žádný důvod
      if (reasons.empty()) {
        return std::string("Žádný");
      }
    
      // Spojení všech důvodů čárkou
      std::string result = "";
      for (size_t i = 0; i < reasons.size(); i++) {
        result += reasons[i];
        if (i < reasons.size() - 1) {
          result += ", ";
        }
      }
    
      return result;
  - platform: template
    name: "VZT - Aktuální režim"
    id: vzt_current_mode
    update_interval: 1s
    lambda: |-
      bool boost = id(flag_kuchyn_active) || id(flag_ha_active) || id(flag_koupelna_active) || id(flag_wc_prizemi_active) || id(flag_wc_patro_active);
      bool topeni = id(switch_topeni_on).state;
      bool profuk = id(script_periodic_ventilation).is_running();

      // Debug logging
      ESP_LOGI("SELECT_MODE", "boost=%d, topeni=%d, profuk=%d | WC_priz=%d, WC_pat=%d, Koup=%d, Kuch=%d, HA_ext=%d", 
        boost, topeni, profuk, 
        id(vzt_wc_prizemi).state, id(vzt_wc_patro).state, id(vzt_koupelna).state, id(vzt_kuchyn).state, id(switch_ha_externi).state);

      if (boost) {
        if (topeni) {
          return std::string("Větrání + Topení");
        } else {
          return std::string("Větrání");
        }
      } else if (profuk) {
        if (topeni) {
          return std::string("Profuk + Topení");
        } else {
          return std::string("Profuk");
        }
      } else if (topeni) {
        return std::string("Pouze Topení");
      }
      return std::string("Klid");


number:
  # Nastavení zpoždění a doběhu větrání
  
  - platform: template
    name: "VZT WC - Zpoždění startu"
    id: wc_delay_start
    min_value: 0
    max_value: 300
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    on_value:
      then:
        - logger.log:
            format: "⚙️ WC Zpoždění startu: %.0f s"
            args: ['x']
            
  - platform: template
    name: "VZT WC - Doběh"
    id: wc_run_over
    min_value: 0
    max_value: 3000
    step: 10
    initial_value: 300
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    on_value:
      then:
        - logger.log:
            format: "⚙️ WC Doběh: %.0f s"
            args: ['x']
            
  - platform: template
    name: "VZT Koupelna - Doběh"
    id: bath_run_over
    min_value: 0
    max_value: 3000
    step: 10
    initial_value: 300
    optimistic: true
    restore_value: true
    unit_of_measurement: "s"
    icon: mdi:timer-sand
    on_value:
      then:
        - logger.log:
            format: "⚙️ Koupelna Doběh: %.0f s"
            args: ['x']
  
  # Nastavení otáček - Procenta výkonu pro různé režimy
  
  - platform: template
    name: "VZT Výkon Větrání MALÝ"
    id: pwr_vet_low
    min_value: 0
    max_value: 100
    step: 2
    initial_value: 30
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:fan
    on_value:
      then:
        - logger.log:
            format: "⚙️ Výkon Větrání MALÝ: %.0f%%"
            args: ['x']
        - script.execute: rk2_manager
        
  - platform: template
    name: "VZT Výkon Větrání VELKÝ"
    id: pwr_vet_high
    min_value: 0
    max_value: 100
    step: 2
    initial_value: 80
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:fan
    on_value:
      then:
        - logger.log:
            format: "⚙️ Výkon Větrání VELKÝ: %.0f%%"
            args: ['x']
        - script.execute: rk2_manager
        
  - platform: template
    name: "VZT Výkon Cirkulace MALÝ"
    id: pwr_cirk_low
    min_value: 0
    max_value: 100
    step: 2
    initial_value: 35
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:fan
    on_value:
      then:
        - logger.log:
            format: "⚙️ Výkon Cirkulace MALÝ: %.0f%%"
            args: ['x']
        - script.execute: rk2_manager
        
  - platform: template
    name: "VZT Výkon Cirkulace VELKÝ"
    id: pwr_cirk_high
    min_value: 0
    max_value: 100
    step: 2
    initial_value: 90
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:fan
    on_value:
      then:
        - logger.log:
            format: "⚙️ Výkon Cirkulace VELKÝ: %.0f%%"
            args: ['x']
        - script.execute: rk2_manager
#------------------------------------------------------------------------------------
#                         Logika regulatoru (Manager) - OPRAVENO
#------------------------------------------------------------------------------------
script:
  # RK2 Manager - Centrální řídící logika ATREA RK2 jednotky
  # Řídí větrání a topení na základě:
  # - Požadavků ze senzorů (WC přízemí, WC patro, Koupelna, Kuchyň)
  # - Externího požadavku z HA (switch_ha_externi)
  # - Stavu topení (switch_topeni_on, switch_topeni_turbo)
  # - Periodického větrání (profuk)
  #
  # Výstupy:
  # - dac_vystup_1: Analogová hodnota pro RK2 (0.0-1.0) určující režim větrání
  # - light_vetrani: PWM otáček větrání (0-100%)
  # - light_cirkulace: PWM otáček cirkulace (0-100%)
  #
  # Stavy RK2 (dac_vystup_1):
  # - 0.0  = pouze cirkulace (topení bez větrání)
  # - 0.5  = větrání MALÉ + cirkulace (periodické větrání)
  # - 0.8  = větrání VELKÉ + cirkulace (boost + topení)
  # - 1.0  = větrání VELKÉ (bez topení)
  - id: rk2_manager
    mode: restart
    then:
      - lambda: |-
          // Příznak boost: zda je aktivní některý požadavek na větrání
          // POZOR: Kontrolujeme interní flagy, ne přímo senzory (kvůli zpožděním a doběhům)
          bool boost_kuchyn = id(flag_kuchyn_active);
          bool boost_ha = id(flag_ha_active);
          bool boost_koupelna = id(flag_koupelna_active);
          bool boost_wc_prizemi = id(flag_wc_prizemi_active);
          bool boost_wc_patro = id(flag_wc_patro_active);
        
          bool boost = boost_kuchyn || boost_ha || boost_koupelna || boost_wc_prizemi || boost_wc_patro;
          bool topeni = id(switch_topeni_on).state;
          bool turbo = id(switch_topeni_turbo).state;
          bool profuk = id(script_periodic_ventilation).is_running();

          float dac = 0.0, vet = 0.0, cirk = 0.0;
          std::string mode = "";

          if (boost) {
            // BOOST režim: Požadavek na větrání je aktivní
            if (topeni) { 
              // Boost + Topení: Velké větrání + malá cirkulace
              dac = 0.8; vet = id(pwr_vet_high).state; cirk = id(pwr_cirk_low).state;
              mode = "BOOST + TOPENÍ";
            }
            else { 
              // Boost bez topení: Velké větrání bez cirkulace
              dac = 1.0; vet = id(pwr_vet_high).state; cirk = 0.0;
              mode = "BOOST";
            }
          } else if (profuk) {
            // PERIODICKÉ VĚTRÁNÍ: Běh naplánovaného větrání (bez boost)
            if (topeni) { 
              // Profuk + Topení: Malé větrání + malá cirkulace
              dac = 0.5; vet = id(pwr_vet_low).state; cirk = id(pwr_cirk_low).state;
              mode = "PROFUK + TOPENÍ";
            }
            else { 
              // Profuk bez topení: Malé větrání bez cirkulace
              dac = 1.0; vet = id(pwr_vet_low).state; cirk = 0.0;
              mode = "PROFUK";
            }
          } else if (topeni) {
            // TOPENÍ BEZ VĚTRÁNÍ: Pouze cirkulace
            dac = 0.0; vet = 0.0; cirk = turbo ? id(pwr_cirk_high).state : id(pwr_cirk_low).state;
            mode = turbo ? "TOPENÍ TURBO" : "TOPENÍ";
          } else {
            mode = "KLID";
          }

          // LOGOVÁNÍ ZMĚNY REŽIMU
          ESP_LOGI("RK2", "Režim: %s | DAC: %.1f | Větrání: %.0f%% | Cirkulace: %.0f%%", 
                   mode.c_str(), dac, vet, cirk);

          // Aplikace vypočítaných hodnot na výstupy
          id(dac_vystup_1).set_level(dac);
          id(dac_current_level) = dac;  // Uložit aktuální DAC hodnotu
          
          // LOGOVÁNÍ ZMĚNY VÝKONU VĚTRÁNÍ (pokud se změnil)
          if (id(vet_current_pwr) != vet) {
            ESP_LOGI("MOTOR", "🌀 Větrání: %.0f%% → %.0f%%", id(vet_current_pwr), vet);
            id(vet_current_pwr) = vet;
          } else {
            id(vet_current_pwr) = vet;
          }
          
          // LOGOVÁNÍ ZMĚNY VÝKONU CIRKULACE (pokud se změnil)
          if (id(cirk_current_pwr) != cirk) {
            ESP_LOGI("MOTOR", "♨️  Cirkulace: %.0f%% → %.0f%%", id(cirk_current_pwr), cirk);
            id(cirk_current_pwr) = cirk;
          } else {
            id(cirk_current_pwr) = cirk;
          }
          
          auto cv = id(light_vetrani).make_call(); cv.set_brightness(vet/100.0f); cv.set_state(vet>0); cv.perform();
          auto cc = id(light_cirkulace).make_call(); cc.set_brightness(cirk/100.0f); cc.set_state(cirk>0); cc.perform();

          // Řízení externích zařízení topení
          if (topeni) {
            id(switch_rele_cerpadlo_topeni).turn_on();
            id(switch_rele_el_ventil_topeni_vzt).turn_on();
          } else {
            id(switch_rele_cerpadlo_topeni).turn_off();
            id(switch_rele_el_ventil_topeni_vzt).turn_off();
          }

  # ============================================================================
  # KUCHYŇ - Přímé zapnutí/vypnutí bez logiky
  # ============================================================================
  - id: script_kuchyn_on
    mode: restart
    then:
      - logger.log: "🍳 KUCHYŇ: Zapnuto"
      - globals.set:
          id: flag_kuchyn_active
          value: 'true'
      - script.execute: rk2_manager

  - id: script_kuchyn_off
    mode: restart
    then:
      - logger.log: "🍳 KUCHYŇ: Vypnuto"
      - globals.set:
          id: flag_kuchyn_active
          value: 'false'
      - script.execute: script_global_turn_off_check

  # ============================================================================
  # HA EXTERNÍ - Přímé zapnutí/vypnutí
  # ============================================================================
  - id: script_ha_on
    mode: restart
    then:
      - logger.log: "🏠 HA EXTERNÍ: Zapnuto"
      - globals.set:
          id: flag_ha_active
          value: 'true'
      - script.execute: rk2_manager

  - id: script_ha_off
    mode: restart
    then:
      - logger.log: "🏠 HA EXTERNÍ: Vypnuto"
      - globals.set:
          id: flag_ha_active
          value: 'false'
      - script.execute: script_global_turn_off_check

  # ============================================================================
  # KOUPELNA - Okamžité zapnutí + doběh (reset při opětovném zapnutí)
  # ============================================================================
  - id: script_koupelna_on
    mode: restart  # Restart = zruší předchozí běh (včetně doběhu)
    then:
      - logger.log: "🛁 KOUPELNA: Zapnuto"
      - globals.set:
          id: flag_koupelna_active
          value: 'true'
      - script.execute: rk2_manager  # Okamžitě spustit větrání

  - id: script_koupelna_off
    mode: restart
    then:
      - logger.log: "🛁 KOUPELNA: Doběh zahájen"
      # Spustit doběh
      - delay: !lambda "return id(bath_run_over).state * 1000;"
      # Po doběhu vypnout
      - logger.log: "🛁 KOUPELNA: Vypnuto po doběhu"
      - globals.set:
          id: flag_koupelna_active
          value: 'false'
      - script.execute: script_global_turn_off_check

  # ============================================================================
  # WC PŘÍZEMÍ - Zpoždění zapnutí + doběh
  # Logika:
  # - Při zapnutí: čeká zpoždění, pak zapne větrání
  # - Při vypnutí během zpoždění: zruší celý script (= reset zpoždění)
  # - Při vypnutí po zapnutí: prodlouží doběh
  # ============================================================================
  - id: script_wc_prizemi_on
    mode: restart  # Restart = zruší předchozí zpoždění i doběh
    then:
      - logger.log: "🚽 WC PŘÍZEMÍ: Zpoždění startu"
      # Zpoždění zapnutí
      - delay: !lambda "return id(wc_delay_start).state * 1000;"
      # Po zpoždění zapnout větrání
      - logger.log: "🚽 WC PŘÍZEMÍ: Zapnuto"
      - globals.set:
          id: flag_wc_prizemi_active
          value: 'true'
      - script.execute: rk2_manager

  - id: script_wc_prizemi_off
    mode: restart
    then:
      # Pokud je větrání aktivní, spustit doběh
      - if:
          condition:
            lambda: 'return id(flag_wc_prizemi_active);'
          then:
            - logger.log: "🚽 WC PŘÍZEMÍ: Doběh zahájen"
            # Doběh
            - delay: !lambda "return id(wc_run_over).state * 1000;"
            # Po doběhu vypnout
            - logger.log: "🚽 WC PŘÍZEMÍ: Vypnuto po doběhu"
            - globals.set:
                id: flag_wc_prizemi_active
                value: 'false'
            - script.execute: script_global_turn_off_check
          else:
            # Pokud větrání neběží (vypnuto během zpoždění), jen zrušit script_wc_prizemi_on
            - logger.log: "🚽 WC PŘÍZEMÍ: Zrušeno během zpoždění"
            - script.stop: script_wc_prizemi_on

  # ============================================================================
  # WC PATRO - Zpoždění zapnutí + doběh (stejná logika jako WC přízemí)
  # ============================================================================
  - id: script_wc_patro_on
    mode: restart
    then:
      - logger.log: "🚽 WC PATRO: Zpoždění startu"
      # Zpoždění zapnutí
      - delay: !lambda "return id(wc_delay_start).state * 1000;"
      # Po zpoždění zapnout větrání
      - logger.log: "🚽 WC PATRO: Zapnuto"
      - globals.set:
          id: flag_wc_patro_active
          value: 'true'
      - script.execute: rk2_manager

  - id: script_wc_patro_off
    mode: restart
    then:
      # Pokud je větrání aktivní, spustit doběh
      - if:
          condition:
            lambda: 'return id(flag_wc_patro_active);'
          then:
            - logger.log: "🚽 WC PATRO: Doběh zahájen"
            # Doběh
            - delay: !lambda "return id(wc_run_over).state * 1000;"
            # Po doběhu vypnout
            - logger.log: "🚽 WC PATRO: Vypnuto po doběhu"
            - globals.set:
                id: flag_wc_patro_active
                value: 'false'
            - script.execute: script_global_turn_off_check
          else:
            # Pokud větrání neběží (vypnuto během zpoždění), jen zrušit script
            - logger.log: "🚽 WC PATRO: Zrušeno během zpoždění"
            - script.stop: script_wc_patro_on

  # ============================================================================
  # Bezpečnostní kontrola vypnutí
  # ============================================================================
  - id: script_global_turn_off_check
    then:
      - if:
          condition:
            lambda: |-
              return !id(flag_kuchyn_active) && 
                    !id(flag_ha_active) && 
                    !id(flag_koupelna_active) && 
                    !id(flag_wc_prizemi_active) && 
                    !id(flag_wc_patro_active);
          then:
            - logger.log: "✅ Všechny požadavky vypnuty - přechod do klidového režimu"
            - script.stop: script_safety_watchdog
            - script.execute: rk2_manager
            - globals.set: {id: last_ventilation_unix, value: !lambda "return id(sntp_time).now().timestamp;"}
            - globals.set: {id: last_ventilation_millis, value: !lambda "return millis() / 1000;"}

  # ============================================================================
  # Watchdog bezpečnosti - 2 hodiny timeout
  # ============================================================================
  - id: script_safety_watchdog
    mode: restart
    then:
      - logger.log: 
          format: "⚠️ WATCHDOG: Spuštěn (timeout 2h)"
          level: WARN
      - delay: 7200s
      - logger.log:
          format: "🚨 WATCHDOG: TIMEOUT! Nucené vypnutí všech požadavků"
          level: ERROR
      - globals.set: {id: flag_kuchyn_active, value: 'false'}
      - globals.set: {id: flag_ha_active, value: 'false'}
      - globals.set: {id: flag_koupelna_active, value: 'false'}
      - globals.set: {id: flag_wc_prizemi_active, value: 'false'}
      - globals.set: {id: flag_wc_patro_active, value: 'false'}
      - script.execute: rk2_manager

  # ============================================================================
  # Periodické větrání
  # ============================================================================
  - id: script_periodic_ventilation
    mode: single  # Pouze jeden běh najednou
    then:
      - logger.log: "💨 PROFUK: START (5 minut)"
      - script.execute: rk2_manager
      - delay: 300s  # 5 minut větrání
      - logger.log: "💨 PROFUK: KONEC"
      - globals.set: {id: last_ventilation_unix, value: !lambda "return id(sntp_time).now().timestamp;"}
      - globals.set: {id: last_ventilation_millis, value: !lambda "return millis() / 1000;"}
      - script.execute: rk2_manager
      
interval:
  # Periodická kontrola - spouští větrání každou hodinu, pokud neběželo dlouhodobě
  # (více než 1 hodina bez větrání)
  - interval: 1min
    then:
      - if:
          condition:
            lambda: |-
              // Profuk pouze pokud:
              // 1. Neběží žádný boost
              // 2. Uplynula více než 1 hodina od posledního větrání
              bool boost = id(flag_kuchyn_active) || id(flag_ha_active) || 
                          id(flag_koupelna_active) || id(flag_wc_prizemi_active) || 
                          id(flag_wc_patro_active);
              bool time_elapsed = (id(sntp_time).now().timestamp - id(last_ventilation_unix)) > 3600;
              return !boost && time_elapsed;
          then: 
            - script.execute: script_periodic_ventilation

