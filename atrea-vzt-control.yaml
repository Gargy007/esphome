#------------------------------------------------------------------------------------
#                         Logika regulatoru (Manager) - OPRAVENO
#------------------------------------------------------------------------------------
script:
# ============================================================================
# Skripty pro řízení motorů přes relé
# ============================================================================
- id: script_motor_vetrani_off
  then:
    - switch.turn_off: switch_rele_8
    - switch.turn_off: switch_rele_7
    - switch.turn_off: switch_rele_6
    - logger.log: "🌀 VĚTRÁNÍ: Vypnuto"

- id: script_motor_vetrani_low
  then:
    - switch.turn_off: switch_rele_8
    - switch.turn_off: switch_rele_7
    - switch.turn_on: switch_rele_6
    - logger.log: "🌀 VĚTRÁNÍ: Malý výkon"

- id: script_motor_vetrani_high
  then:
    - switch.turn_on: switch_rele_8
    - switch.turn_off: switch_rele_7
    - switch.turn_off: switch_rele_6
    - logger.log: "🌀 VĚTRÁNÍ: Velký výkon"

- id: script_motor_vetrani_boost
  then:
    - switch.turn_on: switch_rele_8
    - switch.turn_on: switch_rele_7
    - switch.turn_off: switch_rele_6
    - logger.log: "🌀 VĚTRÁNÍ: Boost"

- id: script_motor_cirkulace_off
  then:
    - switch.turn_off: switch_rele_5
    - switch.turn_off: switch_rele_4
    - switch.turn_off: switch_rele_3
    - logger.log: "♨️ CIRKULACE: Vypnuto"

- id: script_motor_cirkulace_low
  then:
    - switch.turn_off: switch_rele_5
    - switch.turn_off: switch_rele_4
    - switch.turn_on: switch_rele_3
    - logger.log: "♨️ CIRKULACE: Malý výkon"

- id: script_motor_cirkulace_high
  then:
    - switch.turn_on: switch_rele_5
    - switch.turn_off: switch_rele_4
    - switch.turn_off: switch_rele_3
    - logger.log: "♨️ CIRKULACE: Velký výkon"

- id: script_motor_cirkulace_boost
  then:
    - switch.turn_on: switch_rele_5
    - switch.turn_on: switch_rele_4
    - switch.turn_off: switch_rele_3
    - logger.log: "♨️ CIRKULACE: Boost"
# RK2 Manager - Centrální řídící logika ATREA RK2 jednotky
- id: rk2_manager
  mode: restart
  then:
    - lambda: |-
        // ⚠️ KRITICKÁ BEZPEČNOST: Pokud je aktivní zamrazovací ochrana, nic se nemění!
        if (id(flag_frost_protection_active)) {
          ESP_LOGW("RK2", "🔒 Zamrazovací ochrana aktivní - rk2_manager je ZABLOKOVÁN!");
          return;  // STOP - Nic se nemění během ochrany!
        }

        // Příznak boost: zda je aktivní některý požadavek na větrání
        // POZOR: Kontrolujeme interní flagy, ne přímo senzory (kvůli zpožděním a doběhům)
        bool boost_kuchyn = id(flag_kuchyn_active);
        bool boost_ha = id(flag_ha_active);
        bool boost_koupelna = id(flag_koupelna_active);
        bool boost_wc_prizemi = id(flag_wc_prizemi_active);
        bool boost_wc_patro = id(flag_wc_patro_active);
        
        bool boost = boost_kuchyn || boost_ha || boost_koupelna || boost_wc_prizemi || boost_wc_patro;
        bool topeni = id(switch_topeni_on).state;
        bool turbo = id(switch_topeni_turbo).state;
        bool profuk = id(flag_profuk_active);
        bool radiatory = id(flag_topeni_radiatory_active);

        float dac = 0.0;
        int vet_mode = 0;  // 0=OFF, 1=LOW, 2=HIGH, 3=BOOST
        int cirk_mode = 0; // 0=OFF, 1=LOW, 2=HIGH, 3=BOOST
        std::string mode = "";

        if (boost) {
          // BOOST režim: Požadavek na větrání je aktivní
          if (topeni) { 
            // Boost + Topení: Velké větrání + malá cirkulace
            dac = 0.8; vet_mode = 2; cirk_mode = 1;  // HIGH + LOW
            mode = "BOOST + TOPENÍ";
          }
          else { 
            // Boost bez topení: Velké větrání bez cirkulace
            dac = 1.0; vet_mode = 2; cirk_mode = 0;  // HIGH + OFF
            mode = radiatory ? "BOOST + radiátory" : "BOOST";
          }
        } else if (profuk) {
          // PERIODICKÉ VĚTRÁNÍ: Běh naplánovaného větrání (bez boost)
          if (topeni) { 
            // Profuk + Topení: Malé větrání + malá cirkulace
            dac = 0.5; vet_mode = 1; cirk_mode = 1;  // LOW + LOW
            mode = "PROFUK + TOPENÍ";
          }
          else { 
            // Profuk bez topení: Malé větrání bez cirkulace
            dac = 1.0; vet_mode = 1; cirk_mode = 0;  // LOW + OFF
            mode = radiatory ? "PROFUK + radiátory" : "PROFUK";
          }
        } else if (topeni) {
          // TOPENÍ BEZ VĚTRÁNÍ: Pouze cirkulace
          dac = 0.0; vet_mode = 0; cirk_mode = turbo ? 2 : 1;  // OFF + HIGH/LOW
          mode = turbo ? "TOPENÍ TURBO" : "TOPENÍ";
        } else if (radiatory) {
          // POUZE RADIÁTORY: Jen čerpadlo topení, bez větrání
          dac = 0.0; vet_mode = 0; cirk_mode = 0;  // OFF + OFF
          mode = "Pouze radiátory";
        } else {
          mode = "KLID";
        }

        // Aplikace vypočítaných hodnot na výstupy
        id(dac_vystup_1).set_level(dac);
          
        // LOGOVÁNÍ ZMĚNY DAC (pouze při změně)
        if (id(dac_current_level) != dac) {
          ESP_LOGI("RK2", "Režim: %s | DAC: %.1f", mode.c_str(), dac);
          id(dac_current_level) = dac;
        } else {
          id(dac_current_level) = dac;
        }
          
        // Řízení motorů přes relé místo PWM
        // Větrání
        if (id(vet_current_mode) != vet_mode) {
          ESP_LOGI("MOTOR", "🌀 Větrání: režim %d → %d", id(vet_current_mode), vet_mode);
          id(vet_current_mode) = vet_mode;
        }
        switch (vet_mode) {
          case 0: id(script_motor_vetrani_off).execute(); break;
          case 1: id(script_motor_vetrani_low).execute(); break;
          case 2: id(script_motor_vetrani_high).execute(); break;
          case 3: id(script_motor_vetrani_boost).execute(); break;
          default: ESP_LOGW("MOTOR", "Neznámý režim větrání: %d", vet_mode);
        }
          
        // Cirkulace
        if (id(cirk_current_mode) != cirk_mode) {
          ESP_LOGI("MOTOR", "♨️  Cirkulace: režim %d → %d", id(cirk_current_mode), cirk_mode);
          id(cirk_current_mode) = cirk_mode;
        }
        switch (cirk_mode) {
          case 0: id(script_motor_cirkulace_off).execute(); break;
          case 1: id(script_motor_cirkulace_low).execute(); break;
          case 2: id(script_motor_cirkulace_high).execute(); break;
          case 3: id(script_motor_cirkulace_boost).execute(); break;
          default: ESP_LOGW("MOTOR", "Neznámý režim cirkulace: %d", cirk_mode);
        }

        // Řízení externích zařízení topení
        // Čerpadlo běží při topení i radiátorech
        if (topeni || radiatory) {
          id(switch_rele_cerpadlo_topeni).turn_on();
        } else {
          id(switch_rele_cerpadlo_topeni).turn_off();
        }
        // Ventil běží jen při topení (ne při radiátorech!!)
        if (topeni) {
          id(switch_rele_el_ventil_topeni_vzt).turn_on();
        } else {
          id(switch_rele_el_ventil_topeni_vzt).turn_off();
        }

# ============================================================================
# KUCHYŇ - Přímé zapnutí/vypnutí bez logiky
# ============================================================================
- id: script_kuchyn_on
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return id(flag_frost_protection_active);'
        then:
          - logger.log:
              format: "🍳 KUCHYŇ: Požadavek IGNOROVÁN (Zamrazovací ochrana aktivní!)"
              level: WARN
        else:
          - logger.log:
              format: "🍳 KUCHYŇ: Zapnuto"
              level: INFO
          - globals.set:
              id: flag_kuchyn_active
              value: 'true'
          - script.execute: rk2_manager

- id: script_kuchyn_off
  mode: restart
  then:
    - logger.log:
        format: "🍳 KUCHYŇ: Vypnuto"
        level: INFO
    - globals.set:
        id: flag_kuchyn_active
        value: 'false'
    - script.execute: script_global_turn_off_check

# ============================================================================
# HA EXTERNÍ - Přímé zapnutí/vypnutí
# ============================================================================
- id: script_ha_on
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return id(flag_frost_protection_active);'
        then:
          - logger.log:
              format: "🏠 HA EXTERNÍ: Požadavek IGNOROVÁN (Zamrazovací ochrana aktivní!)"
              level: WARN
        else:
          - logger.log:
              format: "🏠 HA EXTERNÍ: Zapnuto"
              level: INFO
          - globals.set:
              id: flag_ha_active
              value: 'true'
          - script.execute: rk2_manager

- id: script_ha_off
  mode: restart
  then:
    - logger.log:
        format: "🏠 HA EXTERNÍ: Vypnuto"
        level: INFO
    - globals.set:
        id: flag_ha_active
        value: 'false'
    - script.execute: script_global_turn_off_check

# ============================================================================
# KOUPELNA - Okamžité zapnutí + doběh (reset při opětovném zapnutí)
# ============================================================================
- id: script_koupelna_on
  mode: restart  # Restart = zruší předchozí běh (včetně doběhu)
  then:
    - if:
        condition:
          lambda: 'return id(flag_frost_protection_active);'
        then:
          - logger.log:
              format: "🛁 KOUPELNA: Požadavek IGNOROVÁN (Zamrazovací ochrana aktivní!)"
              level: WARN
        else:
          - logger.log:
              format: "🛁 KOUPELNA: Zapnuto"
              level: INFO
          - globals.set:
              id: flag_koupelna_active
              value: 'true'
          - script.execute: rk2_manager  # Okamžitě spustit větrání

- id: script_koupelna_off
  mode: restart
  then:
    - logger.log:
        format: "🛁 KOUPELNA: Doběh zahájen"
        level: INFO
    # Spustit doběh
    - delay: !lambda "return id(bath_run_over).state * 1000;"
    # Po doběhu vypnout
    - logger.log:
        format: "🛁 KOUPELNA: Vypnuto po doběhu"
        level: INFO
    - globals.set:
        id: flag_koupelna_active
        value: 'false'
    - script.execute: script_global_turn_off_check

# ============================================================================
# WC PŘÍZEMÍ - Zpoždění zapnutí + doběh
# Logika:
# - Při zapnutí: čeká zpoždění, pak zapne větrání
# - Při vypnutí během zpoždění: zruší celý script (= reset zpoždění)
# - Při vypnutí po zapnutí: prodlouží doběh
# ============================================================================
- id: script_wc_prizemi_on
  mode: restart  # Restart = zruší předchozí zpoždění i doběh
  then:
    - if:
        condition:
          lambda: 'return id(flag_frost_protection_active);'
        then:
          - logger.log:
              format: "🚽 WC PŘÍZEMÍ: Požadavek IGNOROVÁN (Zamrazovací ochrana aktivní!)"
              level: WARN
        else:
          - logger.log:
              format: "🚽 WC PŘÍZEMÍ: Zpoždění startu"
              level: INFO
          # Zpoždění zapnutí
          - delay: !lambda "return id(wc_delay_start).state * 1000;"
          # Po zpoždění zapnout větrání
          - logger.log:
              format: "🚽 WC PŘÍZEMÍ: Zapnuto"
              level: INFO
          - globals.set:
              id: flag_wc_prizemi_active
              value: 'true'
          - script.execute: rk2_manager

- id: script_wc_prizemi_off
  mode: restart
  then:
    # Pokud je větrání aktivní, spustit doběh
    - if:
        condition:
          lambda: 'return id(flag_wc_prizemi_active);'
        then:
          - logger.log:
              format: "🚽 WC PŘÍZEMÍ: Doběh zahájen"
              level: INFO
          # Doběh
          - delay: !lambda "return id(wc_run_over).state * 1000;"
          # Po doběhu vypnout
          - logger.log:
              format: "🚽 WC PŘÍZEMÍ: Vypnuto po doběhu"
              level: INFO
          - globals.set:
              id: flag_wc_prizemi_active
              value: 'false'
          - script.execute: script_global_turn_off_check
        else:
          # Pokud větrání neběží (vypnuto během zpoždění), jen zrušit script_wc_prizemi_on
          - logger.log:
              format: "🚽 WC PŘÍZEMÍ: Zrušeno během zpoždění"
              level: INFO
          - script.stop: script_wc_prizemi_on

# ============================================================================
# WC PATRO - Zpoždění zapnutí + doběh (stejná logika jako WC přízemí)
# ============================================================================
- id: script_wc_patro_on
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return id(flag_frost_protection_active);'
        then:
          - logger.log:
              format: "🚽 WC PATRO: Požadavek IGNOROVÁN (Zamrazovací ochrana aktivní!)"
              level: WARN
        else:
          - logger.log:
              format: "🚽 WC PATRO: Zpoždění startu"
              level: INFO
          # Zpoždění zapnutí
          - delay: !lambda "return id(wc_delay_start).state * 1000;"
          # Po zpoždění zapnout větrání
          - logger.log:
              format: "🚽 WC PATRO: Zapnuto"
              level: INFO
          - globals.set:
              id: flag_wc_patro_active
              value: 'true'
          - script.execute: rk2_manager

- id: script_wc_patro_off
  mode: restart
  then:
    # Pokud je větrání aktivní, spustit doběh
    - if:
        condition:
          lambda: 'return id(flag_wc_patro_active);'
        then:
          - logger.log:
              format: "🚽 WC PATRO: Doběh zahájen"
              level: INFO
          # Doběh
          - delay: !lambda "return id(wc_run_over).state * 1000;"
          # Po doběhu vypnout
          - logger.log:
              format: "🚽 WC PATRO: Vypnuto po doběhu"
              level: INFO
          - globals.set:
              id: flag_wc_patro_active
              value: 'false'
          - script.execute: script_global_turn_off_check
        else:
          # Pokud větrání neběží (vypnuto během zpoždění), jen zrušit script
          - logger.log:
              format: "🚽 WC PATRO: Zrušeno během zpoždění"
              level: INFO
          - script.stop: script_wc_patro_on

# ============================================================================
# Bezpečnostní kontrola vypnutí
# ============================================================================
- id: script_global_turn_off_check
  then:
    - if:
        condition:
          lambda: |-
            return !id(flag_kuchyn_active) && 
                  !id(flag_ha_active) && 
                  !id(flag_koupelna_active) && 
                  !id(flag_wc_prizemi_active) && 
                  !id(flag_wc_patro_active);
        then:
          - logger.log:
              format: "✅ Všechny požadavky vypnuty - přechod do klidového režimu"
              level: INFO
          - script.stop: script_safety_watchdog
          - script.execute: rk2_manager
          - globals.set: {id: last_ventilation_unix, value: !lambda "return id(sntp_time).now().timestamp;"}
          - globals.set: {id: last_ventilation_millis, value: !lambda "return millis() / 1000;"}

# ============================================================================
# Watchdog bezpečnosti - 2 hodiny timeout
# ============================================================================
- id: script_safety_watchdog
  mode: restart
  then:
    - logger.log: 
        format: "⚠️ WATCHDOG: Spuštěn (timeout 2h)"
        level: WARN
    - delay: 7200s
    - logger.log:
        format: "🚨 WATCHDOG: TIMEOUT! Nucené vypnutí všech požadavků"
        level: ERROR
    - globals.set: {id: flag_kuchyn_active, value: 'false'}
    - globals.set: {id: flag_ha_active, value: 'false'}
    - globals.set: {id: flag_koupelna_active, value: 'false'}
    - globals.set: {id: flag_wc_prizemi_active, value: 'false'}
    - globals.set: {id: flag_wc_patro_active, value: 'false'}
    - script.execute: rk2_manager

# ============================================================================
# FROST PROTECTION (Zamrazovací ochrana) - Ochrana proti zmrazení výstupu
# ============================================================================
- id: script_frost_protection_on
  mode: restart
  then:
    - logger.log:
        format: "❄️ FROST PROTECTION: AKTIVOVÁNA! T=%.1f°C < 2.0°C - Všechny větrací požadavky PAUZOVÁNY!"
        args: ['id(temp_reku_out_home).state']
        level: WARN
    # Uložit typ původního požadavku
    - lambda: |-
        // Určit který flag byl aktivní (přioritizovat v pořadí)
        uint8_t req_type = 0;
        if (id(flag_kuchyn_active)) {
          req_type = 1; // KUCHYN
          ESP_LOGI("FROST", "  └─ Uložen požadavek: 🍳 Kuchyň");
        } else if (id(flag_ha_active)) {
          req_type = 2; // HA
          ESP_LOGI("FROST", "  └─ Uložen požadavek: 🏠 HA externí");
        } else if (id(flag_koupelna_active)) {
          req_type = 3; // KOUPELNA
          ESP_LOGI("FROST", "  └─ Uložen požadavek: 🛁 Koupelna");
        } else if (id(flag_wc_prizemi_active)) {
          req_type = 4; // WC PRIZEMI
          ESP_LOGI("FROST", "  └─ Uložen požadavek: 🚽 WC přízemí");
        } else if (id(flag_wc_patro_active)) {
          req_type = 5; // WC PATRO
          ESP_LOGI("FROST", "  └─ Uložen požadavek: 🚽 WC patro");
        } else if (id(flag_profuk_active)) {
          req_type = 6; // PROFUK
          ESP_LOGI("FROST", "  └─ Uložen požadavek: 💨 Profuk");
        } else {
          ESP_LOGI("FROST", "  └─ Žádný aktivní požadavek");
        }
        id(frost_saved_request_type) = req_type;
    - globals.set: {id: flag_frost_protection_active, value: 'true'}
    # Zastavit všechny požadavky na větrání
    - globals.set: {id: flag_kuchyn_active, value: 'false'}
    - globals.set: {id: flag_ha_active, value: 'false'}
    - globals.set: {id: flag_koupelna_active, value: 'false'}
    - globals.set: {id: flag_wc_prizemi_active, value: 'false'}
    - globals.set: {id: flag_wc_patro_active, value: 'false'}
    - globals.set: {id: flag_profuk_active, value: 'false'}
    - logger.log:
        format: "❄️ Zastavena všechna větrání - Spouštím topení na cirkulaci pro odmrazení..."
        level: WARN
    - script.stop: script_safety_watchdog
    # Zapnout topení - cirkulace k odmrazení
    - switch.turn_on: switch_topeni_on
    - script.execute: rk2_manager

- id: script_frost_protection_off
  mode: restart
  then:
    - logger.log:
        format: "❄️ FROST PROTECTION: Deaktivována (T >10°C)"
        level: INFO
    - globals.set: {id: flag_frost_protection_active, value: 'false'}
    # Vypnout topení
    - switch.turn_off: switch_topeni_on
    # Pokud byl původní požadavek, znovu jej aktivovat
    - lambda: |-
        uint8_t req_type = id(frost_saved_request_type);
        bool had_request = (req_type > 0);
        
        switch (req_type) {
          case 1: // KUCHYN
            ESP_LOGI("FROST", "Obnova: Kuchyň");
            id(script_kuchyn_on).execute();
            break;
          case 2: // HA
            ESP_LOGI("FROST", "Obnova: HA externí");
            id(script_ha_on).execute();
            break;
          case 3: // KOUPELNA
            ESP_LOGI("FROST", "Obnova: Koupelna");
            id(script_koupelna_on).execute();
            break;
          case 4: // WC PRIZEMI
            ESP_LOGI("FROST", "Obnova: WC přízemí");
            id(script_wc_prizemi_on).execute();
            break;
          case 5: // WC PATRO
            ESP_LOGI("FROST", "Obnova: WC patro");
            id(script_wc_patro_on).execute();
            break;
          case 6: // PROFUK
            ESP_LOGI("FROST", "Obnova: Profuk");
            id(script_periodic_ventilation).execute();
            break;
          default:
            ESP_LOGI("FROST", "Žádný požadavek k obnovení");
            break;
        }
        
        // ⚠️ DŮLEŽITÉ: Znovu spustit watchdog pouze pokud byl nějaký požadavek
        if (had_request) {
          ESP_LOGI("FROST", "Restart watchdog pro obnovený požadavek");
          id(script_safety_watchdog).execute();
        }
    - globals.set: {id: frost_saved_request_type, value: '0'}
    - script.execute: rk2_manager

# ============================================================================
# Periodické větrání
# ============================================================================
- id: script_periodic_ventilation
  mode: single  # Pouze jeden běh najednou
  then:
    - globals.set: {id: flag_profuk_active, value: 'true'}
    - logger.log:
        format: "💨 PROFUK: START"
        level: INFO
    - script.execute: rk2_manager
    - delay: !lambda "return id(profuk_duration).state * 60 * 1000;"
    - globals.set: {id: flag_profuk_active, value: 'false'}
    - logger.log:
        format: "💨 PROFUK: KONEC"
        level: INFO
    - globals.set: {id: last_ventilation_unix, value: !lambda "return id(sntp_time).now().timestamp;"}
    - globals.set: {id: last_ventilation_millis, value: !lambda "return millis() / 1000;"}
    - script.execute: rk2_manager
      
interval:
  # ============================================================================
  # FROST PROTECTION MONITOR - Monitorování teploty výstupu domu
  # ============================================================================
  # Pokud T_out < 2°C: Aktivovat zamrazovací ochranu (= zastavit větrání, zapnout topení)
  # Pokud T_out > 10°C: Deaktivovat zamrazovací ochranu
  # ============================================================================
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              float temp = id(temp_reku_out_home).state;
              // Kontrola validity teploty
              if (std::isnan(temp) || std::isinf(temp)) {
                ESP_LOGW("FROST", "Teplota není dostupná (NaN): %.1f", temp);
                return false;
              }
              
              bool frost_active = id(flag_frost_protection_active);
              
              // Pokud není aktivní a teplota klesla pod 2°C
              if (!frost_active && temp < 2.0) {
                ESP_LOGW("FROST", "🚨 KRITICKÁ TEPLOTA: %.1f°C < 2.0°C - Aktivace zamrazovací ochrany!", temp);
                return true;
              }
              // Pokud JE aktivní a je pod 10°C, počkej a nespouštěj znovu
              // Pokud je pod 1.5°C během ochrany, znovu aktivuj ochranu (paranoia)
              if (frost_active && temp < 1.5) {
                ESP_LOGW("FROST", "⚠️ KRITICKÁ OSCILACE: %.1f°C < 1.5°C během ochrany - Reset ochrany!", temp);
                return true;
              }
              return false;
          then:
            - script.execute: script_frost_protection_on
      
      - if:
          condition:
            lambda: |-
              float temp = id(temp_reku_out_home).state;
              bool frost_active = id(flag_frost_protection_active);
              
              // Pokud je aktivní a teplota se vrátila nad 10°C
              if (frost_active && temp > 10.0) {
                ESP_LOGI("FROST", "✅ Teplota se vrátila k normálu: %.1f°C > 10.0°C - Deaktivace ochrany", temp);
                return true;
              }
              return false;
          then:
            - script.execute: script_frost_protection_off

  # Periodická kontrola - spouští větrání každou hodinu, pokud neběželo dlouhodobě
  # (více než 1 hodina bez větrání)
  - interval: 1min
    then:
      - if:
          condition:
            lambda: |-
              // Profuk pouze pokud:
              // 1. Neběží žádný boost
              // 2. Uplynula více než 1 hodina od posledního větrání
              bool boost = id(flag_kuchyn_active) || id(flag_ha_active) || 
                          id(flag_koupelna_active) || id(flag_wc_prizemi_active) || 
                          id(flag_wc_patro_active);
              bool time_elapsed = (id(sntp_time).now().timestamp - id(last_ventilation_unix)) > 3600;
              return !boost && time_elapsed;
          then: 
            - script.execute: script_periodic_ventilation

